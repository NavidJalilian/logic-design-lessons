// Lesson 33 — book slides 81–83 (Chapter 6: clocked RS flip-flop and D flip-flop).
// Explanations are Persian; numbers, math and technical terms stay as written in English.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run (numbers, math) intact inside Persian board text
const nand = (a, c) => +!(a && c);

// ---------------------------------------------------------------- circuit logic
// Gates 3 and 4 feed a NAND latch (gate 1 makes Q, gate 2 makes Q'); the latch is left to settle.
function rsCalc(cp, S, R, q) {
  const g3 = nand(S, cp), g4 = nand(R, cp);
  let qn = +!q;
  for (let i = 0; i < 6; i++) { q = nand(g3, qn); qn = nand(g4, q); }
  return { g3, g4, q, qn };
}
const dCalc = (cp, D, q) => rsCalc(cp, D, +!D, q); // D goes to S, D' goes to R
// Next state after one clock pulse (null = indeterminate, Q = Q').
function rsNext(q, S, R) { const r = rsCalc(1, S, R, q); return r.q === r.qn ? null : r.q; }
const dNext = (q, D) => dCalc(1, D, q).q;

// ---------------------------------------------------------------- circuit drawing
async function drawClocked(b, mode) {
  const p3 = b.pins('nand', 260, 170), p4 = b.pins('nand', 260, 290);
  const p1 = b.pins('nand', 440, 178), p2 = b.pins('nand', 440, 282);
  await all([b.gate('g1', 'nand', 440, 178, { label: '1' }), b.gate('g2', 'nand', 440, 282, { label: '2' })]);
  await all([b.wire('wq', [p1.out, [600, 178]]), b.wire('wqn', [p2.out, [600, 282]]), b.dot('dq', 560, 178), b.dot('dqn', 560, 282)]);
  await all([
    b.write('lq', 622, 188, 'Q', { size: 30, color: 'green', bold: true }),
    b.write('lqn', 626, 292, "Q'", { size: 30, color: 'green', bold: true }),
    b.wire('fq', [[560, 178], [560, 213], [410, 247], [410, 274], p2.ins[0]], { color: 'purple' }),
    b.wire('fqn', [[560, 282], [560, 247], [410, 213], [410, 186], p1.ins[1]], { color: 'purple' }),
  ]);
  await all([b.gate('g3', 'nand', 260, 170, { label: '3', color: 'orange' }), b.gate('g4', 'nand', 260, 290, { label: '4', color: 'orange' })]);
  await all([b.wire('w31', [p3.out, p1.ins[0]]), b.wire('w42', [p4.out, p2.ins[1]])]);
  if (mode === 'rs') {
    await all([
      b.wire('ws', [[120, 162], p3.ins[0]]), b.write('ls', 100, 172, 'S', { size: 30, color: 'blue', bold: true }),
      b.wire('wr', [[120, 298], p4.ins[1]]), b.write('lr', 100, 308, 'R', { size: 30, color: 'blue', bold: true }),
    ]);
  } else {
    await all([b.wire('wd', [[120, 162], p3.ins[0]]), b.write('ld', 100, 172, 'D', { size: 30, color: 'blue', bold: true }), b.dot('dd', 150, 162)]);
    await b.wire('wdn', [[150, 162], [150, 298], [165, 298]]);
    await b.gate('gn', 'not', 165, 298);
    await b.wire('wdn2', [b.pins('not', 165, 298).out, p4.ins[1]]);
  }
  await all([
    b.wire('wc', [[120, 230], [240, 230]], { color: 'orange' }),
    b.wire('wc3', [[240, 230], [240, 178], p3.ins[1]], { color: 'orange' }),
    b.wire('wc4', [[240, 230], [240, 282], p4.ins[0]], { color: 'orange' }),
    b.dot('dc', 240, 230, { color: 'orange' }),
    b.write('lc', 96, 238, 'cp', { size: 28, color: 'orange', bold: true }),
  ]);
}
// Writes every wire value: inputs, outputs of gates 3 and 4, Q and Q'.
async function clkVals(b, mode, cp, x, R, q0) {
  const r = mode === 'rs' ? rsCalc(cp, x, R, q0) : dCalc(cp, x, q0);
  const bad = r.q === r.qn;
  const w = (id, xx, yy, v, color) => b.write(id, xx, yy, String(v), { size: 24, color, bold: true, dur: 150 });
  await all([
    w('v-x', 190, 150, x, 'blue'),
    mode === 'rs' ? w('v-r', 190, 326, R, 'blue') : Promise.resolve(),
    w('v-cp', 190, 218, cp, 'orange'),
  ]);
  await all([w('v-3', 380, 158, r.g3, 'purple'), w('v-4', 380, 318, r.g4, 'purple')]);
  await all([w('v-q', 585, 166, r.q, bad ? 'red' : 'green'), w('v-qn', 585, 270, r.qn, bad ? 'red' : 'green')]);
  return r;
}

// ---------------------------------------------------------------- small table on the right
const MX = [690, 740, 790, 865, 920];
async function miniHead(b) {
  await all(['cp', 'S', 'R', 'Q', "Q'"].map((h, k) => b.write(`mh${k}`, MX[k], 105, h, { size: 26, color: k ? (k > 2 ? 'green' : 'blue') : 'orange', bold: true })));
  await all([b.line('mhl', 665, 120, 950, 120, { color: 'soft', width: 2 }), b.line('mhv', 828, 80, 828, 345, { color: 'soft', width: 2 })]);
}
async function miniRow(b, r, cp, S, R, res) {
  const vals = [cp, S, R, res.q, res.qn], y = 155 + r * 42;
  await all(vals.map((v, k) => b.write(`mr${r}-${k}`, MX[k], y, String(v), { size: 24, color: k > 2 ? (res.q === res.qn ? 'red' : 'green') : 'ink', dur: 150 })));
}
async function note(b, fa, en, color = 'orange') {
  await b.erase(['nb', 'n1', 'n2']);
  await b.box('nb', 140, 410, 720, 110, { color, fill: color });
  await b.write('n1', 500, 455, en, { size: 30, color: color === 'red' ? 'red' : 'ink', bold: true });
  await b.write('n2', 500, 497, fa, { size: 22, fa: true });
}

// ---------------------------------------------------------------- flip-flop symbol
async function ffSymbol(b, x, y, ins, outs) {
  await b.box('sym', x, y, 160, 200, { color: 'ink', fill: 'soft' });
  for (const [k, [name, ext]] of ins.entries()) {
    const yy = y + ((k + 1) * 200) / (ins.length + 1);
    await all([
      b.line(`si${k}`, x - 70, yy, x, yy),
      b.write(`sin${k}`, x + 16, yy + 10, name, { size: 28, anchor: 'start', bold: true }),
      b.write(`sie${k}`, x - 95, yy + 10, ext, { size: 26, color: name === 'C' ? 'orange' : 'blue' }),
    ]);
  }
  for (const [k, name] of outs.entries()) {
    const yy = y + ((k + 1) * 200) / (outs.length + 1);
    await all([
      b.line(`so${k}`, x + 160, yy, x + 230, yy),
      b.write(`son${k}`, x + 144, yy + 10, name, { size: 28, anchor: 'end', color: 'green', bold: true }),
    ]);
  }
}

// ---------------------------------------------------------------- timing diagrams
const TX = 160, TW = 100;
const px = k => TX + k * TW;        // start of period k
const rise = k => px(k) + TW / 4;   // the clock goes to 1 here: the flip-flop reacts
// Square wave: level lv[k] holds from xs[k] to xs[k+1]; 0 sits on y, 1 sits h above it.
function sq(xs, lv, y, h = 40) {
  let d = `M${xs[0]} ${y - lv[0] * h}`;
  lv.forEach((v, k) => { const yy = y - v * h; if (k) d += `L${xs[k]} ${yy}`; d += `L${xs[k + 1]} ${yy}`; });
  return d;
}
function clockPath(n, y) {
  const xs = [px(0)], lv = [];
  for (let k = 0; k < n; k++) { lv.push(0, 1, 0); xs.push(rise(k), rise(k) + TW / 2, px(k + 1)); }
  return sq(xs, lv, y);
}
const bitsPath = (bits, y) => sq([...bits.map((_, k) => px(k)), px(bits.length)], bits, y);
async function waveRow(b, id, name, d, y, color) {
  await b.write(id + '-n', 100, y - 12, name, { size: 28, color, bold: true, dur: 150 });
  await b.path(id, d, { color, dur: 900 });
}
// Draws the clock, the input waves and the empty Q row.
async function timingSetup(b, ins, rows, qy) {
  const n = Object.values(ins)[0].length;
  await waveRow(b, 'ck', 'cp', clockPath(n, rows[0]), rows[0], 'orange');
  for (const [k, name] of Object.keys(ins).entries()) await waveRow(b, `w${name}`, name, bitsPath(ins[name], rows[k + 1]), rows[k + 1], 'blue');
  await b.write('wq-n', 100, qy - 12, 'Q', { size: 28, color: 'green', bold: true });
}
// Steps the flip-flop pulse by pulse: reads the inputs at the rising edge, computes Q(t+1), draws that slice of Q.
async function runFF(b, ins, q0, next, qy) {
  const names = Object.keys(ins), n = ins[names[0]].length;
  let q = q0;
  for (let k = 0; k < n; k++) {
    const v = names.map(nm => ins[nm][k]), nq = next(q, ...v);
    await b.line(`ed${k}`, rise(k), 85, rise(k), qy + 10, { color: 'orange', width: 2, dur: 200 });
    await b.write('rd', 500, 55, `pulse ${k + 1}:   ${names.map((nm, j) => `${nm}=${v[j]}`).join('   ')}     Q: ${q} → ${nq}`, { size: 28, color: nq !== q ? 'orange' : 'ink', dur: 200 });
    await b.path(`qw${k}`, sq([px(k), rise(k), px(k + 1)], [q, nq], qy), { color: 'green', dur: 400 });
    await b.write(`qv${k}`, rise(k) + TW * 0.375, qy + 32, String(nq), { size: 22, color: 'green', dur: 120 });
    await b.recolor(`ed${k}`, 'soft');
    q = nq;
  }
  return q;
}

// ---------------------------------------------------------------- characteristic table + K-map
const CX = [140, 220, 280, 400];
const kx = c => 660 + c * 80;   // K-map column centres (SR = 00, 01, 11, 10)
const ky = r => 245 + r * 70;   // K-map row centres (Q = 0, 1)
const GRAY = [[0, 0], [0, 1], [1, 1], [1, 0]];

// ---------------------------------------------------------------- quizzes
const QN = 6;
function quizBoard(n, question, o = { size: 34 }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از ${QN}`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 150, question, o);
  };
}
async function circuitSolve(b, mode, cp, x, R, q0) {
  await b.move('q-q', 0, 330);
  await drawClocked(b, mode);
  await b.write('s0', 820, 170, `قبل:  ${LTR('Q = ' + q0)}`, { size: 28, color: 'soft', fa: true });
  const r = await clkVals(b, mode, cp, x, R, q0);
  await b.write('s1', 820, 290, `Q = ${r.q}`, { size: 44, color: 'green', bold: true });
}

const RS_DEMO = { S: [1, 0, 0, 0, 1, 0, 0], R: [0, 0, 1, 0, 0, 0, 1] };
const D_DEMO = { D: [1, 1, 0, 1, 0, 0, 1] };

            b.write(`d${r}-1`, 780, y, String(D), { size: 24, color: 'orange', dur: 120 }),

    {

    {
      say: 'مثال زمانیِ D flip-flop. clock همان 7 پالس است و D بین پالس‌ها عوض می‌شود. دوباره اول Q = 0. قبل از اینکه ادامه بدهید، خودتان حدس بزنید Q چه شکلی می‌شود.',

    {

    {
      say: 'نوبت شماست! یک RS flip-flop با Q = 0. با S = 1 و R = 0 یک پالس clock می‌آید. Q بعد از پالس چند است؟',
      draw: quizBoard(1, 'RS:   Q = 0 ,  S = 1 ,  R = 0 ,  clock pulse   →   Q = ?'),
      quiz: { answer: ['1'], hint: 'S = 1 و R = 0 یعنی set.', explain: "Q(t+1) = S + R'Q = 1 + 1·0 = 1" },
      solve: b => circuitSolve(b, 'rs', 1, 1, 0, 0),

      quiz: { answer: ['1'], hint: 'S = R = 0 یعنی بدون تغییر.', explain: "Q(t+1) = S + R'Q = 0 + 1·1 = 1" },
      solve: b => circuitSolve(b, 'rs', 1, 0, 0, 1),

    {
      say: 'سؤال تله‌ای! RS flip-flop با Q = 0. ورودی‌ها S = 1 و R = 0 هستند، ولی cp = 0 است. Q چند است؟',

      quiz: { answer: ['0'], hint: 'وقتی cp = 0 است گیت‌های 3 و 4 چه می‌دهند؟', explain: 'با cp = 0 گیت‌های 3 و 4 هر دو 1 می‌دهند، پس latch بدون تغییر می‌ماند و Q = 0.' },

      quiz: {

        explain: "از K-map: گروه S و گروه R'Q؛ و S و R نباید با هم 1 باشند.",

      solve: async b => {
        await b.write('a', 500, 280, "Q(t+1) = S + R'Q", { size: 48, color: 'green', bold: true });

      say: 'سؤال آخر: RS flip-flop با Q = 1. در چهار پالس پشت سر هم ورودی‌ها این‌ها هستند: (S, R) = (0, 0)، (1, 0)، (0, 1)، (0, 0). Q را بعد از هر پالس پشت سر هم بنویسید، مثلاً 0110.',
      draw: quizBoard(6, '(S,R):  (0,0)  (1,0)  (0,1)  (0,0)     Q = 1', { size: 32 }),

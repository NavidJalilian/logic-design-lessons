// Lesson 19 — book slides 44–45 (Chapter 3: Simplification of logic functions).
// Explanations are Persian; numbers, math and technical terms stay as written in English.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run (numbers, math) intact inside Persian board text

// ================================================================ K-map helpers
// (the same block is copied into every chapter-3 lesson: 17–22)
//   const K = kmap({ id: 'k', x: 300, y: 150, rows: 'x', cols: 'yz' });   // x, y = top-left corner of the cells
//   await drawMap(b, K)                 grid + Gray-code labels + variable names
//   await fillMap(b, K, ones, { dc, zeros })   writes 1 / X / 0 in the cells (in the order given)
//   await group(b, K, 'g1', [m...], { color })  rounded box around a group (split at the edges when it wraps)
//   termOf('xyz', [m...]) → "x'z"      sumOf('xyz', [m...]) → "(x+z')"   (variables that stay constant)
const GRAY = [[0, 1], [0, 1, 3, 2]];
const bits = (v, n) => v.toString(2).padStart(n, '0');

function kmap(o) {
  const nr = o.rows.length, nc = o.cols.length;
  const K = { cw: 76, ch: 64, offset: 0, ...o, nr, nc };
  K.R = GRAY[nr - 1];
  K.C = GRAY[nc - 1];
  K.W = K.C.length * K.cw;
  K.H = K.R.length * K.ch;
  K.n = K.R.length * K.C.length;
  K.pos = m => { const i = m - K.offset; return { r: K.R.indexOf(i >> nc), c: K.C.indexOf(i & ((1 << nc) - 1)) }; };
  K.at = (r, c) => K.offset + (K.R[r] << nc) + K.C[c];
  K.cx = c => K.x + (c + 0.5) * K.cw;
  K.cy = r => K.y + (r + 0.5) * K.ch;
  K.has = m => m >= K.offset && m < K.offset + K.n;
  K.all = () => K.R.flatMap((_, r) => K.C.map((__, c) => K.at(r, c)));
  return K;
}

// Grid, Gray-code labels on the rows and columns, and the variable names in the corner.
// o.idx: small minterm numbers in the cell corners. o.brackets: variable brackets (where each variable = 1).
async function drawMap(b, K, o = {}) {
  const { id, x, y, W, H, cw, ch } = K;
  await b.box(`${id}-frame`, x, y, W, H, { r: 4, dur: o.dur ?? 500 });
  await Promise.all([
    ...K.C.slice(1).map((_, k) => b.line(`${id}-vl${k}`, x + (k + 1) * cw, y, x + (k + 1) * cw, y + H, { width: 2, dur: 200 })),
    ...K.R.slice(1).map((_, k) => b.line(`${id}-hl${k}`, x, y + (k + 1) * ch, x + W, y + (k + 1) * ch, { width: 2, dur: 200 })),
  ]);
  await b.line(`${id}-diag`, x - 48, y - 44, x, y, { width: 2, dur: 200 });
  await Promise.all([
    b.write(`${id}-rn`, x - 36, y - 2, K.rows, { size: 22, color: 'blue', dur: 200 }),
    b.write(`${id}-cn`, x - 12, y - 26, K.cols, { size: 22, color: 'blue', dur: 200 }),
  ]);
  await Promise.all([
    ...K.C.map((v, c) => b.write(`${id}-cl${c}`, K.cx(c), y - 10, bits(v, K.nc), { size: 22, color: 'purple', dur: 160 })),
    ...K.R.map((v, r) => b.write(`${id}-rl${r}`, x - 22, K.cy(r) + 8, bits(v, K.nr), { size: 22, color: 'purple', dur: 160 })),
  ]);
  if (o.idx) await Promise.all(K.all().map(m => { const p = K.pos(m); return b.write(`${id}-i${m}`, x + p.c * cw + 5, y + p.r * ch + 15, String(m), { size: 13, color: 'soft', anchor: 'start', dur: 80 }); }));
  if (o.brackets) await brackets(b, K);
}

// Brackets that show where each variable is 1: first column variable above, second below;
// first row variable on the left, second on the right.
async function brackets(b, K) {
  const { id, x, y, W, H, cw, ch } = K;
  const span = (seq, nbits, k) => { const bit = nbits - 1 - k; const on = seq.map((v, i) => ((v >> bit) & 1 ? i : -1)).filter(i => i >= 0); return [Math.min(...on), Math.max(...on) + 1]; };
  const jobs = [];
  [...K.cols].forEach((v, k) => {
    const [a, e] = span(K.C, K.nc, k), x0 = x + a * cw + 8, x1 = x + e * cw - 8;
    const yy = k === 0 ? y - 34 : y + H + 12, d = k === 0 ? 8 : -8;
    jobs.push(b.path(`${id}-bc${k}`, `M${x0} ${yy + d}L${x0} ${yy}L${x1} ${yy}L${x1} ${yy + d}`, { color: 'blue', width: 2.5, dur: 250 }));
    jobs.push(b.write(`${id}-bct${k}`, (x0 + x1) / 2, k === 0 ? yy - 6 : yy + 24, v, { size: 22, color: 'blue', dur: 150 }));
  });
  [...K.rows].forEach((v, k) => {
    const [a, e] = span(K.R, K.nr, k), y0 = y + a * ch + 8, y1 = y + e * ch - 8;
    const xx = k === 0 ? x - 46 : x + W + 12, d = k === 0 ? 8 : -8;
    jobs.push(b.path(`${id}-br${k}`, `M${xx + d} ${y0}L${xx} ${y0}L${xx} ${y1}L${xx + d} ${y1}`, { color: 'blue', width: 2.5, dur: 250 }));
    jobs.push(b.write(`${id}-brt${k}`, k === 0 ? xx - 14 : xx + 16, (y0 + y1) / 2 + 8, v, { size: 22, color: 'blue', dur: 150 }));
  });
  await Promise.all(jobs);
}

// Writes 1s (and X / 0) into the cells, one after another, like a teacher filling the map.
async function fillMap(b, K, ones, o = {}) {
  const put = (m, ch, color) => K.has(m) && b.write(`${K.id}-v${m}`, K.cx(K.pos(m).c), K.cy(K.pos(m).r) + 11, ch, { size: o.size || 32, color, bold: ch === '1', dur: o.dur ?? 160 });
  for (const m of ones) await put(m, '1', o.color || 'ink');
  for (const m of o.dc || []) await put(m, 'X', 'purple');
  if (o.zeros) for (const m of K.all()) if (!ones.includes(m) && !(o.dc || []).includes(m)) await put(m, '0', o.zeroColor || 'soft');
}

// A rounded box path; sides listed in `open` ('t','r','b','l') are left open (the group continues across the edge).
function groupPath(x0, y0, x1, y1, open, r = 14) {
  const P = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]], S = ['t', 'r', 'b', 'l'];
  const isOpen = s => open.includes(S[(s + 4) % 4]);
  const unit = s => { s = (s + 4) % 4; const [a, c] = [P[s], P[(s + 1) % 4]]; const L = Math.hypot(c[0] - a[0], c[1] - a[1]); return [(c[0] - a[0]) / L, (c[1] - a[1]) / L]; };
  const pt = (p, u, k) => `${(p[0] + u[0] * k).toFixed(1)} ${(p[1] + u[1] * k).toFixed(1)}`;
  const k0 = S.findIndex((_, s) => isOpen(s));
  const first = k0 < 0 ? 3 : k0;
  let d = '', pen = false;
  for (let i = 1; i <= 4; i++) {
    const s = (first + i) % 4;
    if (isOpen(s)) { pen = false; continue; }
    const u = unit(s), from = P[s], to = P[(s + 1) % 4];
    const start = isOpen(s - 1) ? pt(from, u, 0) : pt(from, u, r);
    if (!pen) d += `M${start}`;
    if (isOpen(s + 1)) { d += `L${pt(to, u, 0)}`; pen = false; }
    else { d += `L${pt(to, u, -r)}Q${pt(to, u, 0)} ${pt(to, unit(s + 1), r)}`; pen = true; }
  }
  return k0 < 0 ? d + 'Z' : d;
}

// The cyclic run of positions a group covers along one side → one or two pieces [start, end, openSide].
function runs(vals, n, lo, hi) {
  const set = [...new Set(vals)];
  if (set.length >= n) return [[0, n - 1, '']];
  const s = set.find(v => !set.includes((v - 1 + n) % n));
  const e = s + set.length - 1;
  return e < n ? [[s, e, '']] : [[s, n - 1, hi], [0, e - n, lo]];
}

// Draws a group as a rounded box (or as open pieces when it wraps around an edge).
// Only the cells that belong to this map are used, so a 5-variable group can be drawn on each half.
async function group(b, K, gid, ms, o = {}) {
  const ps = ms.filter(K.has).map(K.pos);
  if (!ps.length) return;
  const pad = o.pad ?? 7, ext = 9;
  const R = runs(ps.map(p => p.r), K.R.length, 't', 'b'), C = runs(ps.map(p => p.c), K.C.length, 'l', 'r');
  const jobs = [];
  let k = 0;
  for (const [r0, r1, ro] of R) for (const [c0, c1, co] of C) {
    const open = ro + co;
    const x0 = open.includes('l') ? K.x - ext : K.x + c0 * K.cw + pad;
    const x1 = open.includes('r') ? K.x + K.W + ext : K.x + (c1 + 1) * K.cw - pad;
    const y0 = open.includes('t') ? K.y - ext : K.y + r0 * K.ch + pad;
    const y1 = open.includes('b') ? K.y + K.H + ext : K.y + (r1 + 1) * K.ch - pad;
    jobs.push(b.path(`${gid}-${k++}`, groupPath(x0, y0, x1, y1, open), { color: o.color || 'orange', width: 4, dur: o.dur ?? 600, fill: o.fill }));
  }
  await Promise.all(jobs);
}

// Pulses the Gray-code labels of the rows / columns a group sits in (so the eye sees which bits stay fixed).
function pulseLabels(b, K, ms) {
  const ps = ms.filter(K.has).map(K.pos);
  return b.pulse([...new Set(ps.map(p => `${K.id}-rl${p.r}`)), ...new Set(ps.map(p => `${K.id}-cl${p.c}`))]);
}

// The product term of a group: the variables that keep the same value in every cell (1 → x, 0 → x').
function termOf(vars, ms) {
  const n = vars.length;
  const t = [...vars].map((v, i) => { const s = new Set(ms.map(m => (m >> (n - 1 - i)) & 1)); return s.size > 1 ? '' : v + (s.has(1) ? '' : "'"); }).join('');
  return t || '1';
}
// The sum term of a group of 0s (product of sums): constant 0 → x, constant 1 → x'.
function sumOf(vars, ms) {
  const n = vars.length;
  const t = [...vars].map((v, i) => { const s = new Set(ms.map(m => (m >> (n - 1 - i)) & 1)); return s.size > 1 ? '' : v + (s.has(1) ? "'" : ''); }).filter(Boolean);
  return `(${t.join('+')})`;
}
// ================================================================ end of K-map helpers

const QN = 5;
function quizBoard(n, question, o = { size: 36 }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 50, `سؤال ${n} از ${QN}`, { size: 22, color: 'soft', fa: true });
    await b.write('q-q', 500, 115, question, o);
  };
}

const ONES = [0, 1, 2, 5, 8, 9, 10];                     // slide 44: F(A,B,C,D) = Σ(0,1,2,5,8,9,10)
const map4 = () => kmap({ id: 'k', x: 200, y: 160, rows: 'AB', cols: 'CD', cw: 80, ch: 60 });
const map3 = () => kmap({ id: 'k', x: 200, y: 170, rows: 'x', cols: 'yz', cw: 100, ch: 80 });

// Draws a group, pulses the row / column labels it sits in, then writes its term.
async function circle(b, K, gid, ms, vars, tx, ty, color = 'orange', o = {}) {
  await group(b, K, gid, ms, { color, pad: o.pad });
  await pulseLabels(b, K, ms);
  await b.write(`${gid}-t`, tx, ty, o.term || termOf(vars, ms), { size: o.size || 34, color, bold: true });
}

    // ---------------------------------------------------------- 12. shortcut
    {
      say: 'میان‌بر امتحان: لازم نیست هر بار DeMorgan بنویسید. هر گروه صفر را مستقیم به یک پرانتز جمع تبدیل کنید، فقط برعکسِ گروه 1: متغیری که در گروه 1 ثابت است، *با پریم* می‌آید و متغیری که 0 ثابت است، *بدون پریم*. مثلاً گروه AB = 11 مستقیم می‌شود (A\' + B\').',
      tip: true,
      draw: async b => {
        await b.clear();
        await b.write('h', 500, 80, 'میان‌بر: گروه صفرها ← پرانتز جمع', { size: 36, color: 'orange', bold: true, fa: true });
        await b.write('r1', 500, 170, 'گروه 1ها:  متغیرِ 1 ← بی‌پریم،  متغیرِ 0 ← پریم‌دار', { size: 28, color: 'blue', fa: true });
        await b.write('r2', 500, 230, 'گروه 0ها:  متغیرِ 1 ← پریم‌دار،  متغیرِ 0 ← بی‌پریم', { size: 28, color: 'red', fa: true });
        const G = [[[12, 13, 14, 15], 'AB = 11'], [[3, 7, 11, 15], 'CD = 11'], [[4, 6, 12, 14], 'B = 1 , D = 0']];
        for (const [k, [ms, why]] of G.entries()) {
          await b.write(`w${k}`, 360, 320 + k * 60, why, { size: 30, color: 'purple' });
          await b.write(`a${k}`, 530, 320 + k * 60, '→', { size: 30, color: 'soft' });
          await b.write(`s${k}`, 660, 320 + k * 60, sumOf('ABCD', ms), { size: 34, color: 'green', bold: true });
        }
      },
    },
    // ---------------------------------------------------------- 13. Π form → zeros
    {
      say: 'نکته‌ی کتاب: 1های تابع minterm‌ها را نشان می‌دهند و 0ها *maxterm*‌ها را. پس اگر تابع به شکل حاصل‌ضرب maxterm‌ها داده شود، یعنی با Π، شماره‌ها جای 0ها هستند: آن مربع‌ها را 0 می‌گذاریم و بقیه را 1. مثال کتاب: F(x,y,z) = Π(0,2,5,7)؛ پس F = Σ(1,3,4,6).',
      term: ['Maxterm', 'عبارت بیشینه'],
      draw: async b => {
        await b.clear();
        await b.write('h', 500, 55, 'F(x,y,z) = Π(0, 2, 5, 7) = Σ(1, 3, 4, 6)', { size: 34, color: 'orange', bold: true });
        const K = map3();
        await drawMap(b, K, { idx: true, brackets: true });
        for (const m of [0, 2, 5, 7]) await b.write(`k-v${m}`, K.cx(K.pos(m).c), K.cy(K.pos(m).r) + 11, '0', { size: 32, color: 'red', dur: 160 });
        await fillMap(b, K, [1, 3, 4, 6]);
        await b.write('n', 680, 450, 'Π : شماره‌ی 0ها', { size: 28, color: 'red', fa: true });
        await b.write('n2', 320, 450, 'Σ : شماره‌ی 1ها', { size: 28, color: 'ink', fa: true });
      },
    },
    // ---------------------------------------------------------- 14. SOP from 1s
    {
      say: 'الف) با 1ها: مربع‌های 1 و 3 در ردیف x = 0 و ستون‌های z = 1: x\'z. مربع‌های 4 و 6 از لبه به هم می‌رسند، x = 1 و z = 0: xz\' . پس F = x\'z + xz\' .',
      draw: async b => {
        await b.erase(['n', 'n2']);
        const K = map3();
        await circle(b, K, 'g1', [1, 3], 'xyz', 790, 180, 'blue');
        await circle(b, K, 'g2', [4, 6], 'xyz', 790, 230, 'blue', { pad: 12 });
        await b.write('sop', 500, 450, "F = x'z + xz'", { size: 36, color: 'blue', bold: true });
      },
    },
    // ---------------------------------------------------------- 15. F' from 0s
    {
      say: 'ب) با 0ها: مربع‌های 0 و 2 از لبه به هم می‌رسند، x = 0 و z = 0: x\'z\' . مربع‌های 5 و 7، x = 1 و z = 1: xz. پس F\' = xz + x\'z\' .',
      draw: async b => {
        const K = map3();
        await b.erase(['g1*', 'g2*']);
        await circle(b, K, 'z1', [0, 2], 'xyz', 790, 300, 'red');
        await circle(b, K, 'z2', [5, 7], 'xyz', 790, 350, 'red', { pad: 12 });
        await b.write('fp', 500, 500, "F' = xz + x'z'", { size: 34, color: 'red' });
      },
    },
    // ---------------------------------------------------------- 16. POS
    {
      say: 'و با DeMorgan: F = (xz + x\'z\')\' = (x\' + z\')(x + z). یعنی همان تابع، یک بار به شکل sum of products و یک بار به شکل product of sums. هر دو درست‌اند؛ در امتحان هر شکلی که خواسته شد را بنویس.',
      draw: async b => {
        await b.clear();
        await b.write('l1', 500, 120, "F' = xz + x'z'", { size: 38, color: 'red' });
        await b.write('l2', 500, 200, "F = (xz + x'z')'", { size: 38 });
        await b.write('l3', 500, 290, "F = (x' + z')(x + z)", { size: 44, color: 'green', bold: true });
        await b.write('l4', 500, 400, "SOP:  F = x'z + xz'", { size: 34, color: 'blue' });
        await b.write('l5', 500, 470, 'هر دو یک تابع‌اند', { size: 28, color: 'soft', fa: true });
      },
    },
    // ---------------------------------------------------------- 17. summary
    {
      say: 'جمع‌بندی درس. این چهار نکته را به خاطر بسپارید.',
      draw: async b => {
        await b.clear();
        await b.write('h', 500, 80, 'یادت باشد', { size: 48, color: 'orange', bold: true, fa: true });
        const L = [
          `1ها ← ${LTR('minterm')} ← ${LTR('sum of products')}`,
          `0ها را گروه کن ← ${LTR("F'")} ← با ${LTR('DeMorgan')} ← ${LTR('product of sums')}`,
          'در گروه صفر: متغیرِ 1 پریم‌دار، متغیرِ 0 بی‌پریم',
          `تابعِ داده‌شده با ${LTR('Π')}: شماره‌ها جای 0ها هستند`,
        ];
        for (const [k, l] of L.entries()) await b.write(`m${k}`, 900, 170 + k * 80, '•  ' + l, { size: 27, anchor: 'start', fa: true });
      },
    },
    // ---------------------------------------------------------- quizzes
    {
      say: 'نوبت شماست! برای پیدا کردن product of sums با جدول کارنو، کدام مربع‌ها را گروه می‌کنیم؟',
      draw: quizBoard(1, `برای ${LTR('product of sums')} کدام مربع‌ها را گروه می‌کنیم؟`, { size: 34, fa: true }),
      quiz: {
        choices: ['مربع‌های 0', 'مربع‌های 1', 'همه‌ی مربع‌ها'], correct: 0,
        explain: 'صفرها را گروه می‌کنیم تا F\' به دست بیاید؛ بعد با DeMorgan، F به شکل product of sums درمی‌آید.',
      },
      solve: async b => {
        await b.write('s1', 500, 240, `0ها ← ${LTR("F'")}`, { size: 40, color: 'red', fa: true });
        await b.write('s2', 500, 320, "F = (F')'", { size: 40 });
        await b.write('s3', 500, 400, 'product of sums', { size: 40, color: 'green', bold: true });
      },
    },
    {
      say: 'F(x,y,z) = Π(0,1,4,5). ساده‌ترین شکلش چیست؟',
      draw: quizBoard(2, 'F(x,y,z) = Π(0, 1, 4, 5) = ?'),
      quiz: {
        choices: ['y', "y'", '(x + y)', "(x' + y)"], correct: 0,
        hint: 'صفرها را در 0، 1، 4، 5 بگذار. همه در کدام ناحیه‌اند؟',
        explain: 'صفرها دو ستون اول‌اند، یعنی جایی که y = 0. پس F\' = y\' و F = y.',
      },
      solve: async b => {
        const K = kmap({ id: 'k', x: 220, y: 240, rows: 'x', cols: 'yz', cw: 90, ch: 70 });
        await drawMap(b, K, { idx: true, brackets: true });
        await fillMap(b, K, [2, 3, 6, 7], { zeros: true, zeroColor: 'red', size: 28 });
        await circle(b, K, 'z1', [0, 1, 4, 5], 'xyz', 790, 270, 'red', { term: "F' = y'" });
        await b.write('s-ans', 790, 340, 'F = y', { size: 40, color: 'green', bold: true });
      },
    },
    {
      say: 'در یک نقشه‌ی سه متغیری x، y، z، صفرهای مربع 0 و مربع 4 را با هم گروه کرده‌ایم. این گروه کدام پرانتز product of sums را می‌دهد؟',
      draw: quizBoard(3, `گروه صفرِ ${LTR('m0 , m4')} ← کدام پرانتز؟`, { size: 36, fa: true }),
      quiz: {
        choices: ['(y + z)', "(y' + z')", "y'z'", '(x + y + z)'], correct: 0,
        hint: 'در این دو مربع کدام متغیرها ثابت‌اند و مقدارشان چیست؟',
        explain: 'در مربع 0 و 4 فقط x عوض می‌شود؛ y = 0 و z = 0 ثابت‌اند. در گروه صفر، متغیرِ 0 بی‌پریم می‌آید: (y + z).',
      },
      solve: async b => {
        const K = kmap({ id: 'k', x: 220, y: 240, rows: 'x', cols: 'yz', cw: 90, ch: 70 });
        await drawMap(b, K, { idx: true, brackets: true });
        for (const m of [0, 4]) await b.write(`k-v${m}`, K.cx(0), K.cy(K.pos(m).r) + 11, '0', { size: 28, color: 'red' });
        await circle(b, K, 'z1', [0, 4], 'xyz', 790, 270, 'red', { term: 'y = 0 , z = 0' });
        await b.write('s-ans', 790, 340, sumOf('xyz', [0, 4]), { size: 40, color: 'green', bold: true });
      },
    },
    {
      say: 'یک مثال چهار متغیری: F(A,B,C,D) = Π(0,1,2,3,4,6,12,14). product of sums ساده‌شده‌اش کدام است؟',
      draw: quizBoard(4, 'F(A,B,C,D) = Π(0,1,2,3,4,6,12,14) = ?', { size: 34 }),
      quiz: {
        choices: ["(A + B)(B' + D)", "(A' + B')(B + D')", "A'B' + BD'", '(A + B)(B + D)'], correct: 0,
        hint: 'صفرها: ردیف اول کامل، و یک گروه چهارتایی در ستون‌های 00 و 10.',
        explain: 'صفرهای ردیف اول: A\'B\' ؛ صفرهای 4، 6، 12، 14: BD\' . پس F\' = A\'B\' + BD\' و F = (A + B)(B\' + D).',
      },
      solve: async b => {
        const K = kmap({ id: 'k', x: 230, y: 200, rows: 'AB', cols: 'CD', cw: 70, ch: 52 });
        const zeros = [0, 1, 2, 3, 4, 6, 12, 14];
        await drawMap(b, K, { idx: true, brackets: true });
        await fillMap(b, K, K.all().filter(m => !zeros.includes(m)), { zeros: true, zeroColor: 'red', size: 26 });
        await circle(b, K, 'z1', [0, 1, 2, 3], 'ABCD', 770, 240, 'red');
        await circle(b, K, 'z2', [4, 6, 12, 14], 'ABCD', 770, 290, 'purple', { pad: 12 });
        await b.write('fp', 770, 350, "F' = A'B' + BD'", { size: 30, color: 'red' });
        await b.write('s-ans', 500, 500, "F = (A + B)(B' + D)", { size: 40, color: 'green', bold: true });
      },
    },
    {
      say: 'سؤال آخر: اگر F\' = xy + z\' باشد، F کدام است؟',
      draw: quizBoard(5, "F' = xy + z'   →   F = ?"),
      quiz: {
        choices: ["(x' + y')z", "(x + y)z'", "x'y' + z", "x' + y' + z"], correct: 0,
        hint: 'DeMorgan: جمع ← ضرب، و (xy)\' = x\' + y\' .',
        explain: 'F = (xy + z\')\' = (xy)\' · (z\')\' = (x\' + y\')z.',
      },
      solve: async b => {
        await b.write('s1', 500, 230, "F = (xy + z')'", { size: 40 });
        await b.write('s2', 500, 310, "= (xy)' · (z')'", { size: 40, color: 'blue' });
        await b.write('s3', 500, 400, "= (x' + y')z", { size: 44, color: 'green', bold: true });
      },
    },
  ],
});

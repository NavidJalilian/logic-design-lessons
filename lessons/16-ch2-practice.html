// Lesson 16 — book slide 33 (Chapter 2 exercises) as a practice exam.
// Exercise 1 on the slide is jumbled by the right-to-left layout; the reconstruction is
// a) X+1  b) X+X  c) 1·0  d) X+0·y  e) X+(1+x). Every answer below was checked with a truth table.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run (math) intact inside Persian board text
const TOTAL = 14;

async function lines(b, p, y0, gap, rows) {
  for (const [k, [text, o]] of rows.entries()) await b.write(`${p}${k}`, 500, y0 + k * gap, text, { size: 34, ...o });
}

function quizBoard(n, label, question, o = { size: 48 }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 55, `سؤال ${n} از ${TOTAL} — تمرین ${label}`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 150, question, o);
  };
}

// Writes an exercise sheet: heading + parts, one per line.
async function sheet(b, title, parts) {
  await b.clear();
  await b.write('h', 500, 75, title, { size: 38, color: 'orange', bold: true, fa: true });
  for (const [k, p] of parts.entries()) await b.write(`p${k}`, 500, 160 + k * 70, p, { size: 36 });
}

// A gate whose input wires start at x - 70 (spread apart so labels don't touch).
async function gateIn(b, id, kind, x, y, labels) {
  await b.gate(id, kind, x, y);
  const P = b.pins(kind, x, y, labels.length);
  const spread = labels.length === 1 ? [0] : [-16, 16];
  for (const [k, [px, py]] of P.ins.entries()) {
    const sy = y + spread[k];
    await b.wire(`${id}-i${k}`, [[x - 70, sy], [x - 30, sy], [x - 30, py], [px, py]], { color: 'blue', dur: 200 });
    await b.write(`${id}-l${k}`, x - 84, sy + 7, labels[k], { size: 22, color: 'blue' });
  }
  return P;
}

      draw: async b => {
        await b.clear();
        await b.write('h', 500, 70, 'یادت باشد', { size: 48, color: 'orange', bold: true, fa: true });
        const L = [
          "x + 1 = 1        x + x = x        x·0 = 0        x + 0 = x",
          "(A + B)' = A'B'        (AB)' = A' + B'",
          'x + xy = x        (absorption)',
          'x + yz = (x + y)(x + z)',
        ];
        for (const [k, l] of L.entries()) await b.write(`m${k}`, 500, 160 + k * 80, l, { size: 32, color: k === 1 ? 'blue' : 'ink' });
        await b.write('nx', 500, 500, 'فصل بعد: جدول کارنو', { size: 32, color: 'green', bold: true, fa: true });
      },
    },
  ],
});
</script>
</body>
</html>

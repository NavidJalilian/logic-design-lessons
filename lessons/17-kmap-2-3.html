<script>
// Lesson 17 — book slides 34–39 (Chapter 3: Simplification of logic functions).
// Explanations are Persian; numbers, math and technical terms stay as written in English.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run (numbers, math) intact inside Persian board text

// ================================================================ K-map helpers
// (the same block is copied into every chapter-3 lesson: 17–22)
//   const K = kmap({ id: 'k', x: 300, y: 150, rows: 'x', cols: 'yz' });   // x, y = top-left corner of the cells
//   await drawMap(b, K)                 grid + Gray-code labels + variable names
//   await fillMap(b, K, ones, { dc, zeros })   writes 1 / X / 0 in the cells (in the order given)
//   await group(b, K, 'g1', [m...], { color })  rounded box around a group (split at the edges when it wraps)
//   termOf('xyz', [m...]) → "x'z"      sumOf('xyz', [m...]) → "(x+z')"   (variables that stay constant)
const GRAY = [[0, 1], [0, 1, 3, 2]];
const bits = (v, n) => v.toString(2).padStart(n, '0');

function kmap(o) {
  const nr = o.rows.length, nc = o.cols.length;
  const K = { cw: 76, ch: 64, offset: 0, ...o, nr, nc };
  K.R = GRAY[nr - 1];
  K.C = GRAY[nc - 1];
  K.W = K.C.length * K.cw;
  K.H = K.R.length * K.ch;
  K.n = K.R.length * K.C.length;
  K.pos = m => { const i = m - K.offset; return { r: K.R.indexOf(i >> nc), c: K.C.indexOf(i & ((1 << nc) - 1)) }; };
  K.at = (r, c) => K.offset + (K.R[r] << nc) + K.C[c];
  K.cx = c => K.x + (c + 0.5) * K.cw;
  K.cy = r => K.y + (r + 0.5) * K.ch;
  K.has = m => m >= K.offset && m < K.offset + K.n;
  K.all = () => K.R.flatMap((_, r) => K.C.map((__, c) => K.at(r, c)));
  return K;
}

// Grid, Gray-code labels on the rows and columns, and the variable names in the corner.
// o.idx: small minterm numbers in the cell corners. o.brackets: variable brackets (where each variable = 1).
async function drawMap(b, K, o = {}) {
  const { id, x, y, W, H, cw, ch } = K;
  await b.box(`${id}-frame`, x, y, W, H, { r: 4, dur: o.dur ?? 500 });
  await Promise.all([
    ...K.C.slice(1).map((_, k) => b.line(`${id}-vl${k}`, x + (k + 1) * cw, y, x + (k + 1) * cw, y + H, { width: 2, dur: 200 })),
    ...K.R.slice(1).map((_, k) => b.line(`${id}-hl${k}`, x, y + (k + 1) * ch, x + W, y + (k + 1) * ch, { width: 2, dur: 200 })),
  ]);
  await b.line(`${id}-diag`, x - 48, y - 44, x, y, { width: 2, dur: 200 });
  await Promise.all([
    b.write(`${id}-rn`, x - 36, y - 2, K.rows, { size: 22, color: 'blue', dur: 200 }),
    b.write(`${id}-cn`, x - 12, y - 26, K.cols, { size: 22, color: 'blue', dur: 200 }),
  ]);
  await Promise.all([
    ...K.C.map((v, c) => b.write(`${id}-cl${c}`, K.cx(c), y - 10, bits(v, K.nc), { size: 22, color: 'purple', dur: 160 })),
    ...K.R.map((v, r) => b.write(`${id}-rl${r}`, x - 22, K.cy(r) + 8, bits(v, K.nr), { size: 22, color: 'purple', dur: 160 })),
  ]);
  if (o.idx) await Promise.all(K.all().map(m => { const p = K.pos(m); return b.write(`${id}-i${m}`, x + p.c * cw + 5, y + p.r * ch + 15, String(m), { size: 13, color: 'soft', anchor: 'start', dur: 80 }); }));
  if (o.brackets) await brackets(b, K);
}

// Brackets that show where each variable is 1: first column variable above, second below;
// first row variable on the left, second on the right.
async function brackets(b, K) {
  const { id, x, y, W, H, cw, ch } = K;
  const span = (seq, nbits, k) => { const bit = nbits - 1 - k; const on = seq.map((v, i) => ((v >> bit) & 1 ? i : -1)).filter(i => i >= 0); return [Math.min(...on), Math.max(...on) + 1]; };
  const jobs = [];
  [...K.cols].forEach((v, k) => {
    const [a, e] = span(K.C, K.nc, k), x0 = x + a * cw + 8, x1 = x + e * cw - 8;
    const yy = k === 0 ? y - 34 : y + H + 12, d = k === 0 ? 8 : -8;
    jobs.push(b.path(`${id}-bc${k}`, `M${x0} ${yy + d}L${x0} ${yy}L${x1} ${yy}L${x1} ${yy + d}`, { color: 'blue', width: 2.5, dur: 250 }));
    jobs.push(b.write(`${id}-bct${k}`, (x0 + x1) / 2, k === 0 ? yy - 6 : yy + 24, v, { size: 22, color: 'blue', dur: 150 }));
  });
  [...K.rows].forEach((v, k) => {
    const [a, e] = span(K.R, K.nr, k), y0 = y + a * ch + 8, y1 = y + e * ch - 8;
    const xx = k === 0 ? x - 46 : x + W + 12, d = k === 0 ? 8 : -8;
    jobs.push(b.path(`${id}-br${k}`, `M${xx + d} ${y0}L${xx} ${y0}L${xx} ${y1}L${xx + d} ${y1}`, { color: 'blue', width: 2.5, dur: 250 }));
    jobs.push(b.write(`${id}-brt${k}`, k === 0 ? xx - 14 : xx + 16, (y0 + y1) / 2 + 8, v, { size: 22, color: 'blue', dur: 150 }));
  });
  await Promise.all(jobs);
}

// Writes 1s (and X / 0) into the cells, one after another, like a teacher filling the map.
async function fillMap(b, K, ones, o = {}) {
  const put = (m, ch, color) => K.has(m) && b.write(`${K.id}-v${m}`, K.cx(K.pos(m).c), K.cy(K.pos(m).r) + 11, ch, { size: o.size || 32, color, bold: ch === '1', dur: o.dur ?? 160 });
  for (const m of ones) await put(m, '1', o.color || 'ink');
  for (const m of o.dc || []) await put(m, 'X', 'purple');
  if (o.zeros) for (const m of K.all()) if (!ones.includes(m) && !(o.dc || []).includes(m)) await put(m, '0', o.zeroColor || 'soft');
}

// A rounded box path; sides listed in `open` ('t','r','b','l') are left open (the group continues across the edge).
function groupPath(x0, y0, x1, y1, open, r = 14) {
  const P = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]], S = ['t', 'r', 'b', 'l'];
  const isOpen = s => open.includes(S[(s + 4) % 4]);
  const unit = s => { s = (s + 4) % 4; const [a, c] = [P[s], P[(s + 1) % 4]]; const L = Math.hypot(c[0] - a[0], c[1] - a[1]); return [(c[0] - a[0]) / L, (c[1] - a[1]) / L]; };
  const pt = (p, u, k) => `${(p[0] + u[0] * k).toFixed(1)} ${(p[1] + u[1] * k).toFixed(1)}`;
  const k0 = S.findIndex((_, s) => isOpen(s));
  const first = k0 < 0 ? 3 : k0;
  let d = '', pen = false;
  for (let i = 1; i <= 4; i++) {
    const s = (first + i) % 4;
    if (isOpen(s)) { pen = false; continue; }
    const u = unit(s), from = P[s], to = P[(s + 1) % 4];
    const start = isOpen(s - 1) ? pt(from, u, 0) : pt(from, u, r);
    if (!pen) d += `M${start}`;
    if (isOpen(s + 1)) { d += `L${pt(to, u, 0)}`; pen = false; }
    else { d += `L${pt(to, u, -r)}Q${pt(to, u, 0)} ${pt(to, unit(s + 1), r)}`; pen = true; }
  }
  return k0 < 0 ? d + 'Z' : d;
}

// The cyclic run of positions a group covers along one side → one or two pieces [start, end, openSide].
function runs(vals, n, lo, hi) {
  const set = [...new Set(vals)];
  if (set.length >= n) return [[0, n - 1, '']];
  const s = set.find(v => !set.includes((v - 1 + n) % n));
  const e = s + set.length - 1;
  return e < n ? [[s, e, '']] : [[s, n - 1, hi], [0, e - n, lo]];
}

// Draws a group as a rounded box (or as open pieces when it wraps around an edge).
// Only the cells that belong to this map are used, so a 5-variable group can be drawn on each half.
async function group(b, K, gid, ms, o = {}) {
  const ps = ms.filter(K.has).map(K.pos);
  if (!ps.length) return;
  const pad = o.pad ?? 7, ext = 9;
  const R = runs(ps.map(p => p.r), K.R.length, 't', 'b'), C = runs(ps.map(p => p.c), K.C.length, 'l', 'r');
  const jobs = [];
  let k = 0;
  for (const [r0, r1, ro] of R) for (const [c0, c1, co] of C) {
    const open = ro + co;
    const x0 = open.includes('l') ? K.x - ext : K.x + c0 * K.cw + pad;
    const x1 = open.includes('r') ? K.x + K.W + ext : K.x + (c1 + 1) * K.cw - pad;
    const y0 = open.includes('t') ? K.y - ext : K.y + r0 * K.ch + pad;
    const y1 = open.includes('b') ? K.y + K.H + ext : K.y + (r1 + 1) * K.ch - pad;
    jobs.push(b.path(`${gid}-${k++}`, groupPath(x0, y0, x1, y1, open), { color: o.color || 'orange', width: 4, dur: o.dur ?? 600, fill: o.fill }));
  }
  await Promise.all(jobs);
}

// Pulses the Gray-code labels of the rows / columns a group sits in (so the eye sees which bits stay fixed).
function pulseLabels(b, K, ms) {
  const ps = ms.filter(K.has).map(K.pos);
  return b.pulse([...new Set(ps.map(p => `${K.id}-rl${p.r}`)), ...new Set(ps.map(p => `${K.id}-cl${p.c}`))]);
}

// The product term of a group: the variables that keep the same value in every cell (1 → x, 0 → x').
function termOf(vars, ms) {
  const n = vars.length;
  const t = [...vars].map((v, i) => { const s = new Set(ms.map(m => (m >> (n - 1 - i)) & 1)); return s.size > 1 ? '' : v + (s.has(1) ? '' : "'"); }).join('');
  return t || '1';
}
// The sum term of a group of 0s (product of sums): constant 0 → x, constant 1 → x'.
function sumOf(vars, ms) {
  const n = vars.length;
  const t = [...vars].map((v, i) => { const s = new Set(ms.map(m => (m >> (n - 1 - i)) & 1)); return s.size > 1 ? '' : v + (s.has(1) ? "'" : ''); }).filter(Boolean);
  return `(${t.join('+')})`;
}
// ================================================================ end of K-map helpers

const QN = 5;
function quizBoard(n, question, o = { size: 36 }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 50, `سؤال ${n} از ${QN}`, { size: 22, color: 'soft', fa: true });
    await b.write('q-q', 500, 115, question, o);
  };
}

// The 3-variable map used for most of the lesson (x on the rows, yz on the columns).
const map3 = (x = 200, y = 170, cw = 100, ch = 80, id = 'k') => kmap({ id, x, y, rows: 'x', cols: 'yz', cw, ch });
const QMAP = () => map3(220, 240, 90, 70);

// Draws a group, pulses the row / column labels it sits in, then writes its term.
async function circle(b, K, gid, ms, vars, tx, ty, color = 'orange', o = {}) {
  await group(b, K, gid, ms, { color, pad: o.pad });
  await pulseLabels(b, K, ms);
  await b.write(`${gid}-t`, tx, ty, o.term || termOf(vars, ms), { size: o.size || 36, color, bold: true });
}

// Quiz solution: map, 1s, groups and the answer.
async function solveMap(b, ones, groups, answer) {
  const K = QMAP();
  await drawMap(b, K, { idx: true, brackets: true });
  await fillMap(b, K, ones, { zeros: true, size: 28 });
  const colors = ['orange', 'blue', 'green'];
  for (const [k, g] of groups.entries()) await circle(b, K, `sg${k}`, g, 'xyz', 790, 250 + k * 55, colors[k], { pad: 6 + k * 5, size: 32 });
  await b.write('s-ans', 500, 480, answer, { size: 40, color: 'green', bold: true });
}

// Lesson 32 — book slides 77–80 (Chapter 6: sequential circuits, basic latches).
// Explanations are Persian; numbers, math and technical terms stay as written in English.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run (numbers, math) intact inside Persian board text

// ---------------------------------------------------------------- latch logic
const gateOut = (kind, a, c) => (kind === 'nor' ? +!(a || c) : +!(a && c));
// Lets the two cross-coupled gates settle. Gate 1 makes Q, gate 2 makes Q'.
// NOR latch: gate 1 gets R, gate 2 gets S.  NAND latch: gate 1 gets S, gate 2 gets R.
function settle(kind, S, R, q) {
  let qn = +!q;
  const [t, u] = kind === 'nor' ? [R, S] : [S, R];
  for (let i = 0; i < 6; i++) { q = gateOut(kind, t, qn); qn = gateOut(kind, u, q); }
  return [q, qn];
}

// ---------------------------------------------------------------- latch drawing
const LX = 340, LY1 = 170, LY2 = 290;
async function drawLatch(b, kind, top, bot) {
  const p1 = b.pins(kind, LX, LY1), p2 = b.pins(kind, LX, LY2);
  await all([b.gate('g1', kind, LX, LY1, { label: '1' }), b.gate('g2', kind, LX, LY2, { label: '2' })]);
  await all([
    b.wire('wt', [[200, p1.ins[0][1]], p1.ins[0]]),
    b.wire('wb', [[200, p2.ins[1][1]], p2.ins[1]]),
    b.write('lt', 180, p1.ins[0][1] + 10, top, { size: 30, color: 'blue', bold: true }),
    b.write('lb', 180, p2.ins[1][1] + 10, bot, { size: 30, color: 'blue', bold: true }),
  ]);
  await all([b.wire('wq', [p1.out, [540, LY1]]), b.wire('wqn', [p2.out, [540, LY2]])]);
  await all([
    b.write('lq', 562, LY1 + 10, 'Q', { size: 30, color: 'green', bold: true }),
    b.write('lqn', 566, LY2 + 10, "Q'", { size: 30, color: 'green', bold: true }),
  ]);
  await all([b.dot('dq', 460, LY1), b.dot('dqn', 460, LY2)]);
  await b.wire('fq', [[460, LY1], [460, LY1 + 35], [310, LY2 - 35], [310, p2.ins[0][1]], p2.ins[0]], { color: 'purple', dur: 600 });
  await b.wire('fqn', [[460, LY2], [460, LY2 - 35], [310, LY1 + 35], [310, p1.ins[1][1]], p1.ins[1]], { color: 'purple', dur: 600 });
}
// Writes the input values on the input wires and the output values next to Q and Q'.
async function latchVals(b, top, bot, q, qn) {
  const oc = q === qn ? 'red' : 'green';
  await all([
    b.write('vt', 255, LY1 - 18, String(top), { size: 26, color: 'orange', bold: true, dur: 150 }),
    b.write('vb', 255, LY2 + 38, String(bot), { size: 26, color: 'orange', bold: true, dur: 150 }),
  ]);
  await b.write('vqn', 505, LY2 - 12, String(qn), { size: 26, color: oc, bold: true, dur: 150 });
  await b.write('vq', 505, LY1 - 12, String(q), { size: 26, color: oc, bold: true, dur: 150 });
}

// ---------------------------------------------------------------- table (right side)
const TBX = [650, 700, 770, 820];
async function tableHead(b) {
  await all(['S', 'R', 'Q', "Q'"].map((h, k) => b.write(`th${k}`, TBX[k], 105, h, { size: 28, color: 'blue', bold: true })));
  await all([b.line('thl', 625, 120, 955, 120, { color: 'soft', width: 2 }), b.line('thv', 735, 80, 735, 345, { color: 'soft', width: 2 })]);
}
async function tableRow(b, r, vals, note, noteColor = 'soft') {
  const y = 155 + r * 42;
  await all(vals.map((v, k) => b.write(`tr${r}-${k}`, TBX[k], y, String(v), { size: 26, color: k > 1 ? (vals[2] === vals[3] ? 'red' : 'green') : 'ink', dur: 150 })));
  if (note) await b.write(`tn${r}`, 955, y, note, { size: 18, color: noteColor, anchor: 'start', fa: true });
}

// ---------------------------------------------------------------- timing diagrams
const TX = 160, TW = 100;
const px = k => TX + k * TW; // start of period k
// Square wave: level lv[k] holds from xs[k] to xs[k+1]; 0 sits on y, 1 sits h above it.
function sq(xs, lv, y, h = 40) {
  let d = `M${xs[0]} ${y - lv[0] * h}`;
  lv.forEach((v, k) => { const yy = y - v * h; if (k) d += `L${xs[k]} ${yy}`; d += `L${xs[k + 1]} ${yy}`; });
  return d;
}
const bitsPath = (bits, y) => sq([...bits.map((_, k) => px(k)), px(bits.length)], bits, y);
async function waveRow(b, id, name, d, y, color) {
  await b.write(id + '-n', 100, y - 12, name, { size: 28, color, bold: true, dur: 150 });
  await b.path(id, d, { color, dur: 900 });
}
// Steps the latch through the input periods and draws Q slice by slice, updating the read-out line.
async function runLatch(b, kind, ins, q0, qy) {
  let q = q0;
  for (let k = 0; k < ins.S.length; k++) {
    const S = ins.S[k], R = ins.R[k], nq = settle(kind, S, R, q)[0];
    await b.write('rd', 500, 60, `t${k + 1}:   S=${S}   R=${R}    Q: ${q} → ${nq}`, { size: 28, color: nq !== q ? 'orange' : 'ink', dur: 200 });
    await b.path(`qw${k}`, sq([px(k), px(k), px(k + 1)], [q, nq], qy), { color: 'green', dur: 350 });
    await b.write(`qv${k}`, px(k) + TW / 2, qy + 32, String(nq), { size: 22, color: 'green', dur: 120 });
    q = nq;
  }
}

// ---------------------------------------------------------------- quizzes
const QN = 6;
function quizBoard(n, question, o = { size: 34 }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از ${QN}`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 150, question, o);
  };
}
// Draws the latch, then applies the new inputs and lets it settle.
async function latchSolve(b, kind, S, R, q0) {
  const [top, bot] = kind === 'nor' ? ['R', 'S'] : ['S', 'R'];
  await b.move('q-q', 0, 330);
  await drawLatch(b, kind, top, bot);
  await b.write('s0', 780, 170, `قبل:  ${LTR('Q = ' + q0)}`, { size: 28, color: 'soft', fa: true });
  const [q, qn] = settle(kind, S, R, q0);
  const [vt, vb] = kind === 'nor' ? [R, S] : [S, R];
  await latchVals(b, vt, vb, q, qn);
  await b.write('s1', 780, 290, q === qn ? `Q = Q' = ${q}` : `Q = ${q}`, { size: 40, color: q === qn ? 'red' : 'green', bold: true });
}

      say: 'نسخه‌ی دوم کتاب: flip-flop پایه با گیت‌های *NAND*. همان دو گیتِ ضربدری است، ولی این بار S به گیت بالا می‌رود که Q را می‌سازد، و R به گیت پایین. یادآوری NAND: اگر حتی یک ورودی 0 باشد، خروجی 1 است.',

        await b.clear();

    {
      say: 'سطر اول جدول کتاب: S = 1 و R = 0. گیت 2 یک ورودیِ 0 دارد، پس Q\' = 1. گیت 1 حالا S = 1 و Q\' = 1 می‌بیند، پس Q = 0. بعد R را به 1 برمی‌گردانیم: S = R = 1 و خروجی‌ها بدون تغییر می‌مانند.',

        await tableRow(b, 1, [1, 1, ...settle('nand', 1, 1, 0)], 'بدون تغییر');

    },

    {
      say: 'حالا S = 0 و R = 1. گیت 1 یک ورودیِ 0 دارد، پس Q = 1؛ و گیت 2 با R = 1 و Q = 1 می‌دهد Q\' = 0. این بار با *0 کردنِ* S مدار set شد! در latch با NAND ورودی‌ها با 0 فعال می‌شوند. دوباره S = R = 1: بدون تغییر.',
      draw: async b => {
        await latchVals(b, 0, 1, ...settle('nand', 0, 1, 0));
        await tableRow(b, 2, [0, 1, ...settle('nand', 0, 1, 0)], 'set');
        await latchVals(b, 1, 1, ...settle('nand', 1, 1, 1));
        await tableRow(b, 3, [1, 1, ...settle('nand', 1, 1, 1)], 'بدون تغییر');
      },
    },
    // ---------------------------------------------------------- 20. NAND indeterminate
    {
      say: 'و اگر S = 0 و R = 0؟ هر دو گیت یک ورودیِ 0 دارند، پس Q = Q\' = 1. پس در NAND حالت *نامعین* S = R = 0 است. طبق جزوه، اینجا خروجی وقتی عوض می‌شود که یک ورودی از 1 به 0 برود.',
      draw: async b => {
        await latchVals(b, 0, 0, ...settle('nand', 0, 0, 1));
        await tableRow(b, 4, [0, 0, ...settle('nand', 0, 0, 1)], 'نامعین', 'red');

        await b.box('rb', 140, 410, 720, 110, { color: 'red', fill: 'red' });

      tip: true,
      draw: async b => {
        await b.clear();
        await b.write('h', 500, 80, 'NOR  یا  NAND ؟', { size: 44, color: 'orange', bold: true, fa: true });

        for (const [r, row] of R.entries()) {
          const y = 160 + r * 75;
          await all(row.map((t, k) => b.write(`c${r}-${k}`, [210, 470, 760][k], y, t, { size: r ? 30 : 32, color: r === 0 ? 'blue' : r === 4 ? 'red' : k ? 'ink' : 'purple', bold: !r })));
        }
        await b.line('hl', 120, 185, 900, 185, { color: 'soft', width: 2 });
        await b.line('vl', 615, 120, 615, 480, { color: 'soft', width: 2 });
      },
    },
    // ---------------------------------------------------------- 22. summary
    {
      say: 'جمع‌بندی کنیم: پنج نکته برای امتحان. یک بار دیگر بخوانیدشان، بعد برویم سراغ سؤال‌ها.',
      draw: async b => {
        await b.clear();
        await b.write('h', 500, 80, 'یادت باشد', { size: 48, color: 'orange', bold: true, fa: true });
        const L = [
          'مدار ترتیبی = مدار ترکیبی + عنصر حافظه',
          'هر flip-flop یک بیت نگه می‌دارد: Q و مکملش',
          `در NOR latch: ${LTR('S=1 → Q=1')}،  ${LTR('R=1 → Q=0')}،  ${LTR('00')} بدون تغییر`,
          `در NOR latch حالت ${LTR('S=R=1')} نامعین است`,
          `در NAND latch ورودی‌ها با 0 فعال‌اند و ${LTR('S=R=0')} نامعین است`,

        for (const [k, l] of L.entries()) await b.write(`m${k}`, 900, 160 + k * 72, '•  ' + l, { size: 27, anchor: 'start', fa: true });

    {
      say: 'نوبت شماست! در latch با NOR فعلاً Q = 1 است. ورودی‌ها را S = 0 و R = 1 می‌کنیم. Q چه می‌شود؟ فقط یک رقم بنویسید.',
      draw: quizBoard(1, 'NOR latch:   Q = 1 ,   S = 0 ,  R = 1   →   Q = ?'),
      quiz: { answer: ['0'], hint: 'R به گیتی می‌رود که Q را می‌سازد. یک ورودیِ 1 کافی است تا خروجی NOR صفر شود.', explain: 'R = 1 یعنی reset، پس Q = 0 و Q\' = 1.' },
      solve: b => latchSolve(b, 'nor', 0, 1, 1),
    },
    {
      say: 'در latch با NOR فعلاً Q = 0 است و هر دو ورودی 0 هستند: S = 0 و R = 0. Q چند است؟',

      quiz: { answer: ['0'], hint: 'S = R = 0 در NOR latch یعنی بدون تغییر.', explain: 'هیچ فرمانی نیامده، پس Q همان 0 قبلی می‌ماند.' },
      solve: b => latchSolve(b, 'nor', 0, 0, 0),

      quiz: {
        choices: ['S = 0 , R = 0', 'S = 1 , R = 1', 'S = 1 , R = 0'], correct: 1,
        explain: 'با S = R = 1 هر دو گیت NOR صفر می‌دهند، پس Q = Q\' = 0 و خروجی‌ها دیگر مکمل هم نیستند.',
      },
      solve: b => latchSolve(b, 'nor', 1, 1, 0),
    },
    {
      say: 'حالا latch با NAND. فعلاً Q = 0 است. ورودی‌ها را S = 0 و R = 1 می‌کنیم. Q چه می‌شود؟',
      draw: quizBoard(4, 'NAND latch:   Q = 0 ,   S = 0 ,  R = 1   →   Q = ?'),
      quiz: { answer: ['1'], hint: 'S به گیتی می‌رود که Q را می‌سازد. یک ورودیِ 0 کافی است تا خروجی NAND یک شود.', explain: 'در NAND latch ورودی‌ها با 0 فعال‌اند: S = 0 یعنی set، پس Q = 1.' },
      solve: b => latchSolve(b, 'nand', 0, 1, 0),
    },
    {
      say: 'کدام ترکیب ورودی در latch با NAND *نامعین* است؟',
      draw: quizBoard(5, 'کدام ورودی در NAND latch نامعین است؟', { size: 40, fa: true }),
      quiz: {
        choices: ['S = 1 , R = 1', 'S = 0 , R = 1', 'S = 0 , R = 0'], correct: 2,
        explain: 'با S = R = 0 هر دو گیت NAND یک می‌دهند، پس Q = Q\' = 1. ترکیب 11 در NAND یعنی بدون تغییر.',
      },
      solve: b => latchSolve(b, 'nand', 0, 0, 1),
    },
    {
      say: 'سؤال آخر: کدام جمله تعریف درست مدار ترتیبی است؟',
      draw: quizBoard(6, 'مدار ترتیبی یعنی…', { size: 44, fa: true }),
      quiz: {
        choices: ['output depends only on the present input', 'output depends on the present input and the previous state', 'a circuit with no gates'], correct: 1,
        explain: 'مدار ترتیبی یک عنصر حافظه دارد، پس خروجی‌اش به ورودیِ فعلی و حالت قبلی بستگی دارد.',
      },
      solve: async b => {
        await b.box('bx2', 110, 200, 780, 150, { color: 'green', fill: 'green' });

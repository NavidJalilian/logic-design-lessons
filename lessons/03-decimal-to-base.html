// Lesson 3 — book slides 4–5 (Chapter 1): decimal → any base.
// Whole part: repeated division (remainders, read bottom → top).
// Fraction part: repeated multiplication (integer parts, read top → bottom).

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run intact inside Persian board text
const DIG = '0123456789ABCDEF';

// ---- repeated division: rows { n, q, r } until the quotient is 0
function divRows(n, base) {
  const rows = [];
  do { rows.push({ n, base, q: Math.floor(n / base), r: n % base }); n = Math.floor(n / base); } while (n > 0);
  return rows;
}
// g = { xr: right end of "n ÷ base = q", y0: first row, dy: row gap, size }
async function divRow(b, p, row, k, g) {
  const y = g.y0 + k * g.dy;
  await b.write(`${p}e${k}`, g.xr, y, `${row.n} ÷ ${row.base} = ${row.q}`, { size: g.size, anchor: 'end', dur: 350 });
  await b.write(`${p}r${k}`, g.xr + 70, y, row.r > 9 ? `${row.r}=${DIG[row.r]}` : String(row.r), { size: g.size, color: 'red', bold: true, dur: 200 });
}
async function divUp(b, p, rows, g) {
  const yBot = g.y0 + (rows.length - 1) * g.dy;
  await b.arrow(`${p}up`, g.xr + 140, yBot + 5, g.xr + 140, g.y0 - g.size, { color: 'orange' });
}
async function divTable(b, p, n, base, g) {
  const rows = divRows(n, base);
  for (const [k, row] of rows.entries()) await divRow(b, p, row, k, g);
  await divUp(b, p, rows, g);
  return rows.map(r => DIG[r.r]).reverse().join('');
}

// ---- repeated multiplication with exact integer arithmetic (frac like "0.6875")
const dec = (num, k) => String(num).padStart(k, '0').replace(/0+$/, '');
function mulRows(frac, base, max = 8) {
  const digits = frac.split('.')[1], k = digits.length, den = 10 ** k;
  let num = Number(digits);
  const rows = [];
  while (num && rows.length < max) {
    const prod = num * base, d = Math.floor(prod / den), rest = prod % den;
    rows.push({ inS: '0.' + dec(num, k), base, outS: `${d}.${dec(rest, k) || '0'}`, d });
    num = rest;
  }
  return { rows, ended: num === 0 };
}
async function mulRow(b, p, row, k, g) {
  const y = g.y0 + k * g.dy;
  await b.write(`${p}e${k}`, g.xr, y, `${row.inS} × ${row.base} = ${row.outS}`, { size: g.size, anchor: 'end', dur: 400 });
  await b.write(`${p}r${k}`, g.xr + 70, y, DIG[row.d], { size: g.size, color: 'green', bold: true, dur: 200 });
}
async function mulDown(b, p, n, g) {
  await b.arrow(`${p}dn`, g.xr + 130, g.y0 - g.size, g.xr + 130, g.y0 + (n - 1) * g.dy + 5, { color: 'orange' });
}
async function mulTable(b, p, frac, base, g, max) {
  const { rows, ended } = mulRows(frac, base, max);
  for (const [k, row] of rows.entries()) await mulRow(b, p, row, k, g);
  if (!ended) await b.write(`${p}more`, g.xr - 120, g.y0 + rows.length * g.dy - 10, '⋮', { size: g.size, color: 'soft' });
  await mulDown(b, p, rows.length, g);
  return '0.' + rows.map(r => DIG[r.d]).join('');
}

function quizBoard(n, question, o = { size: 54 }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از 6`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 150, question, o);
  };
}
// Solutions for quizzes
const QD = { xr: 330, y0: 250, dy: 50, size: 34 };   // division column
const QM = { xr: 420, y0: 250, dy: 55, size: 32 };   // multiplication column
async function solveDiv(b, n, base) {
  const res = await divTable(b, 's-', n, base, QD);
  await b.write('s-ans', 710, 360, `(${n})_10 = (${res})_${base}`, { size: 42, color: 'green', bold: true });
}
async function solveMul(b, frac, base, max) {
  const res = await mulTable(b, 's-', frac, base, QM, max);
  await b.write('s-ans', 500, 505, `(${frac})_10 ≈ (${res})_${base}`.replace('≈', mulRows(frac, base, max).ended ? '=' : '≈'), { size: 40, color: 'green', bold: true });
}

      quiz: { answer: ['144'], hint: 'این بار بر 8 تقسیم کن.', explain: '100 ÷ 8 = 12 باقی 4، 12 ÷ 8 = 1 باقی 4، 1 ÷ 8 = 0 باقی 1؛ از پایین به بالا 144. چک: 64 + 32 + 4 = 100.' },
      solve: b => solveDiv(b, 100, 8),
    },
    {
      say: 'یک عدد مخلوط: (6.25)_10 را به binary تبدیل کنید. یادتان باشد هر قسمت جدا.',
      draw: quizBoard(4, '(6.25)_10 = ( ? )_2'),
      quiz: { answer: ['110.01'], hint: '6 را با تقسیم و 0.25 را با ضرب تبدیل کن، بعد کنار هم بگذار.', explain: '6 = (110)_2 و 0.25 = (0.01)_2، پس 110.01.' },
      solve: async b => {
        const w = await divTable(b, 'sw', 6, 2, { xr: 250, y0: 260, dy: 52, size: 32 });
        const f = await mulTable(b, 'sf', '0.25', 2, { xr: 750, y0: 260, dy: 52, size: 32 });
        await b.write('s-w', 300, 445, `6 → (${w})_2`, { size: 32, color: 'blue' });
        await b.write('s-f', 720, 445, `0.25 → (${f})_2`, { size: 32, color: 'blue' });
        await b.write('s-ans', 500, 520, `(6.25)_10 = (${w}${f.slice(1)})_2`, { size: 40, color: 'green', bold: true });
      },
    },
    {
      say: 'اعشاری که تمام نمی‌شود: (0.3)_10 را تا سه رقم اعشار به مبنای 8 ببرید.',
      draw: quizBoard(5, '(0.3)_10 = ( ? )_8', { size: 54 }),
      quiz: { answer: ['0.231'], hint: 'سه بار در 8 ضرب کن و قسمت صحیح‌ها را بنویس.', explain: '0.3 × 8 = 2.4 → 2، 0.4 × 8 = 3.2 → 3، 0.2 × 8 = 1.6 → 1؛ پس تقریباً 0.231 (و ادامه دارد).' },
      solve: b => solveMul(b, '0.3', 8, 3),
    },
    {
      say: 'سؤال آخر، مبنای 16: (26)_10 در hex کدام است؟',
      draw: quizBoard(6, '(26)_10 = ( ? )_16'),
      quiz: {
        choices: ['(110)_16', '(A1)_16', '(1A)_16'], correct: 2,
        explain: '26 ÷ 16 = 1 باقی 10، یعنی رقم A؛ بعد 1 ÷ 16 = 0 باقی 1. از پایین به بالا: 1A.',
      },
      solve: b => solveDiv(b, 26, 16),
    },
  ],
});

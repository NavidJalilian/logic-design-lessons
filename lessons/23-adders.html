<script>
const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run (math, numbers) intact inside Persian board text

function quizBoard(n, total, question, o = { size: 54 }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از ${total}`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 150, question, o);
  };
}

// ---- truth tables: tg() gives the geometry (pure), table() draws it, rowRing() circles a row.
function tg(id, cx, y0, ncols, o = {}) {
  const cw = o.cw || 80, rh = o.rh || 44, size = o.size || 32, x0 = cx - ((ncols - 1) * cw) / 2;
  return { id, cw, rh, size, ncols, nin: o.nin ?? ncols, x0, y0, X: c => x0 + c * cw, Y: r => y0 + rh * (r + 1), left: x0 - cw / 2, right: x0 + (ncols - 1) * cw + cw / 2 };
}
async function table(b, T, cols, rows, o = {}) {
  await all(cols.map((c, k) => b.write(`${T.id}-h${k}`, T.X(k), T.y0, c.h, { size: T.size, color: c.c || 'blue', bold: true, dur: 200 })));
  await b.line(`${T.id}-hl`, T.left, T.y0 + T.rh * 0.4, T.right, T.y0 + T.rh * 0.4, { color: 'soft', dur: 250 });
  if (T.nin < T.ncols) {
    const vx = T.x0 + (T.nin - 0.5) * T.cw;
    await b.line(`${T.id}-vl`, vx, T.y0 - T.rh * 0.6, vx, T.y0 + T.rh * (rows.length + 0.4), { color: 'soft', dur: 250 });
  }
  for (const [r, row] of rows.entries()) {
    await all(row.map((v, k) => b.write(`${T.id}-${r}-${k}`, T.X(k), T.Y(r), String(v), { size: T.size, color: k < T.nin ? 'ink' : cols[k].c || 'green', dur: o.fast ? 70 : 140 })));
  }
}
function rowRing(b, T, r, color = 'orange', name = 'rr') {
  return b.ring(`${T.id}-${name}${r}`, (T.left + T.right) / 2, T.Y(r) - T.size * 0.3, (T.right - T.left) / 2 + 6, T.rh / 2 - 3, { color, tilt: 0 });
}
const bits3 = m => [m >> 2, (m >> 1) & 1, m & 1];

// ---- Karnaugh maps for 3 variables (rows x = 0,1; columns yz = 00,01,11,10)
function kg(id, cx, cy, cell = 80) {
  const gx = cx - 2 * cell, gy = cy - cell, col = m => [0, 1, 3, 2][m & 3];
  return { id, cell, gx, gy, at: m => [gx + (col(m) + 0.5) * cell, gy + ((m >> 2) + 0.5) * cell] };
}
async function kmap(b, K, vals, o = {}) {
  const { id, cell, gx, gy } = K;
  await all([
    b.box(`${id}-box`, gx, gy, 4 * cell, 2 * cell, { color: 'ink', r: 4, dur: 500 }),
    ...[1, 2, 3].map(i => b.line(`${id}-v${i}`, gx + i * cell, gy, gx + i * cell, gy + 2 * cell, { color: 'soft', width: 2.5, dur: 400 })),
    b.line(`${id}-hm`, gx, gy + cell, gx + 4 * cell, gy + cell, { color: 'soft', width: 2.5, dur: 400 }),
  ]);
  await all([
    ...['00', '01', '11', '10'].map((t, i) => b.write(`${id}-c${i}`, gx + (i + 0.5) * cell, gy - 14, t, { size: 22, color: 'purple', dur: 200 })),
    ...[0, 1].map(i => b.write(`${id}-r${i}`, gx - 22, gy + (i + 0.5) * cell + 8, String(i), { size: 24, color: 'purple', dur: 200 })),
    b.write(`${id}-corner`, gx - 10, gy - 14, 'x\\yz', { size: 20, color: 'purple', anchor: 'end', dur: 250 }),
  ]);
  await all([...vals.keys()].map(m => {
    const [x, y] = K.at(m);
    return b.write(`${id}-m${m}`, x, y + 14, String(vals[m]), { size: 40, color: vals[m] ? 'blue' : 'soft', bold: !!vals[m], dur: 180 });
  }));
  if (o.nums) await all([...vals.keys()].map(m => { const [x, y] = K.at(m); return b.write(`${id}-n${m}`, x + cell / 2 - 12, y - cell / 2 + 16, String(m), { size: 15, color: 'soft', dur: 120 }); }));
}
function kgroup(b, K, gid, ms, color = 'orange') {
  const pts = ms.map(m => K.at(m)), xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const w = Math.max(...xs) - Math.min(...xs), h = Math.max(...ys) - Math.min(...ys);
  return b.ring(`${K.id}-g${gid}`, (Math.max(...xs) + Math.min(...xs)) / 2, (Math.max(...ys) + Math.min(...ys)) / 2, w / 2 + K.cell * 0.4, h / 2 + K.cell * 0.4, { color, tilt: 0, dur: 450 });
}
// ---- gate-level circuits as data. pin() matches the player's gate geometry.
const curveX = (x, dy) => { const t = (dy + 25) / 50; return x + 40 * t * (1 - t); };
const OUTX = { and: 60, nand: 72, or: 70, nor: 82, xor: 70, xnor: 82, buf: 50, not: 62 };
function pin(kind, x, y, n = kind === 'not' || kind === 'buf' ? 1 : 2) {
  const gap = n === 1 ? 0 : Math.min(16, 40 / (n - 1));
  const ins = Array.from({ length: n }, (_, k) => {
    const yy = y + (k - (n - 1) / 2) * gap, dy = yy - y;
    const xx = kind === 'or' || kind === 'nor' ? curveX(x, dy) : kind === 'xor' || kind === 'xnor' ? curveX(x - 10, dy) : x;
    return [xx, yy];
  });
  return { ins, out: [x + OUTX[kind], y] };
}
// part: { gates:[[id,kind,x,y]], wires:[[id,net,pts]], dots:[[x,y]], texts:[[id,x,y,str,color,size]] }
async function drawPart(b, part) {
  await all([
    ...(part.gates || []).map(([id, kind, x, y]) => b.gate(id, kind, x, y)),
    ...(part.wires || []).map(([id, , pts]) => b.wire(id, pts)),
    ...(part.boxes || []).map(([id, x, y, w, h]) => b.box(id, x, y, w, h, { color: 'soft', r: 8 })),
  ]);
  await all([
    ...(part.dots || []).map(([x, y], k) => b.dot(`${part.name}-dot${k}`, x, y)),
    ...(part.texts || []).map(([id, x, y, s, c, z]) => b.write(id, x, y, s, { size: z || 24, color: c || 'blue', dur: 200 })),
  ]);
}
// Signals: draws every wire of the given nets again in orange (1) or soft grey (0), like current flowing.
async function flow(b, parts, vals, nets, tags) {
  const jobs = [];
  for (const p of parts) for (const [id, net, pts] of p.wires || []) if (nets.includes(net)) jobs.push(b.wire(`f-${id}`, pts, { color: vals[net] ? 'orange' : 'soft', dur: 450, width: 5 }));
  await all(jobs);
  await all(nets.filter(n => tags[n]).map(n => b.write(`tag-${n}`, tags[n][0], tags[n][1], String(vals[n]), { size: 30, color: vals[n] ? 'orange' : 'soft', bold: true, dur: 200 })));
}
const unflow = b => b.erase(['f-*', 'tag-*'], 250);
async function runFlow(b, C, vals, stages) { for (const st of stages) await flow(b, C.parts, vals, st, C.tags); }

// ---------------------------------------------------------------- circuits
const haVals = (x, y) => ({ x, y, nx: 1 - x, ny: 1 - y, p1: (1 - x) & y, p2: x & (1 - y), s: x ^ y, c: x & y });

function haSop() {
  const nx = pin('not', 220, 80), ny = pin('not', 220, 330), a1 = pin('and', 360, 150), a2 = pin('and', 360, 260), a3 = pin('and', 360, 420), o1 = pin('or', 520, 205);
  const A = {
    name: 'haA',
    gates: [['g-nx', 'not', 220, 80], ['g-ny', 'not', 220, 330], ['g-a1', 'and', 360, 150], ['g-a2', 'and', 360, 260]],
    wires: [
      ['w-x0', 'x', [[80, 80], nx.ins[0]]], ['w-x1', 'x', [[130, 80], [130, 252]]], ['w-xa', 'x', [[130, 252], a2.ins[0]]],
      ['w-y0', 'y', [[80, 120], [170, 120]]], ['w-y1', 'y', [[170, 120], [170, 330]]], ['w-ya', 'y', [[170, 158], a1.ins[1]]], ['w-yn', 'y', [[170, 330], ny.ins[0]]],
      ['w-nx', 'nx', [nx.out, [330, 80], [330, a1.ins[0][1]], a1.ins[0]]], ['w-ny', 'ny', [ny.out, [330, 330], [330, a2.ins[1][1]], a2.ins[1]]],
    ],
    dots: [[130, 80], [130, 252], [170, 158], [170, 330]],
    texts: [['l-x', 50, 90, 'x'], ['l-y', 50, 130, 'y'], ['l-nx', 308, 62, "x'", 'soft', 20], ['l-ny', 308, 312, "y'", 'soft', 20]],
  };
  const B = {
    name: 'haB',
    gates: [['g-o1', 'or', 520, 205], ['g-a3', 'and', 360, 420]],
    wires: [
      ['w-x2', 'x', [[130, 252], [130, 412], a3.ins[0]]], ['w-y2', 'y', [[170, 330], [170, 428], a3.ins[1]]],
      ['w-p1', 'p1', [a1.out, [480, 150], [480, o1.ins[0][1]], o1.ins[0]]], ['w-p2', 'p2', [a2.out, [480, 260], [480, o1.ins[1][1]], o1.ins[1]]],
      ['w-s', 's', [o1.out, [670, 205]]], ['w-c', 'c', [a3.out, [670, 420]]],
    ],
    texts: [['l-s', 705, 215, 'S', 'green', 30], ['l-c', 705, 430, 'C', 'red', 30]],
  };
  const tags = { x: [100, 66], y: [100, 106], s: [755, 215], c: [755, 430] };
  return { parts: [A, B], tags };
}

function haPos(v3) {

    wires: [
      ['w-x0', 'x', [[80, 80], nx.ins[0]]], ['w-x1', 'x', [[130, 80], [130, 142], o1.ins[0]]],
      ['w-y0', 'y', [[80, 120], [170, 120]]], ['w-y1', 'y', [[170, 120], [170, 330]]], ['w-ya', 'y', [[170, 158], o1.ins[1]]], ['w-yn', 'y', [[170, 330], ny.ins[0]]],
      ['w-nx', 'nx', [nx.out, [330, 80], [330, o2.ins[0][1]], o2.ins[0]]], ['w-ny', 'ny', [ny.out, [330, 330], [330, o2.ins[1][1]], o2.ins[1]]],
      ['w-u', 'u', [o1.out, [480, 150], [480, an.ins[0][1]], an.ins[0]]], ['w-q', 'q', [o2.out, [480, 260], [480, an.ins[1][1]], an.ins[1]]],
      ['w-s', 's', [an.out, [670, 205]]],
    ],
    dots: [[130, 80], [170, 158], [170, 330]],
    texts: [['l-x', 50, 90, 'x'], ['l-y', 50, 130, 'y'], ['l-nx', 308, 62, "x'", 'soft', 20], ['l-ny', 308, 312, "y'", 'soft', 20], ['l-s', 705, 215, 'S', 'green', 30],
      ['l-u', 440, 136, 'x+y', 'soft', 18], ['l-qq', 440, 246, "x'+y'", 'soft', 18]],
  };
  const B = v3 ? {
    name: 'hpB',
    gates: [['g-nn', 'not', 520, 350]],
    wires: [['w-q2', 'q', [[480, 260], [480, 350], nn.ins[0]]], ['w-c', 'c', [nn.out, [670, 350]]]],
    dots: [[480, 260]],

  } : {

    dots: [[130, 142]],
    texts: [['l-c', 705, 430, 'C', 'red', 30]],
  };
  return { parts: [A, B] };
}

function haXor() {
  const xo = pin('xor', 360, 150), an = pin('and', 360, 300);
  const A = {
    name: 'hxA',
    gates: [['g-xo', 'xor', 360, 150], ['g-an', 'and', 360, 300]],
    wires: [
      ['w-x1', 'x', [[80, 80], [130, 80], [130, 292], an.ins[0]]], ['w-xa', 'x', [[130, 142], xo.ins[0]]],

    texts: [['l-x', 50, 90, 'x'], ['l-y', 50, 130, 'y'], ['l-s', 640, 160, 'S', 'green', 30], ['l-c', 640, 310, 'C', 'red', 30]],

  return { parts: [A] };
}

const faVals = (x, y, z) => { const p = x ^ y, g = x & y, h = p & z; return { x, y, z, p, g, s: p ^ z, h, c: h | g }; };
function faTwoHA() {
  const x1 = pin('xor', 230, 120), a1 = pin('and', 230, 200), x2 = pin('xor', 430, 160), a2 = pin('and', 430, 270), or = pin('or', 560, 330);

      ['w-x0', 'x', [[80, 80], [110, 80], [110, 192], a1.ins[0]]], ['w-xa', 'x', [[110, 112], x1.ins[0]]],
      ['w-y0', 'y', [[80, 128], x1.ins[1]]], ['w-y1', 'y', [[150, 128], [150, 208], a1.ins[1]]],
    ],
    dots: [[110, 112], [150, 128]],
    texts: [['l-x', 50, 90, 'x'], ['l-y', 50, 138, 'y'], ['l-z', 50, 340, 'z'], ['l-h1', 257, 70, 'Half adder 1', 'soft', 18]],
  };
  const B = {
    name: 'faB',
    gates: [['g-x2', 'xor', 430, 160], ['g-a2', 'and', 430, 270]],
    boxes: [['bx2', 405, 120, 112, 190]],
    wires: [
      ['w-z0', 'z', [[80, 330], [390, 330], [390, 168], x2.ins[1]]], ['w-za', 'z', [[390, 278], a2.ins[1]]],
      ['w-p0', 'p', [x1.out, [360, 120], [360, 262], a2.ins[0]]], ['w-pa', 'p', [[360, 152], x2.ins[0]]],
      ['w-g', 'g', [a1.out, [340, 200], [340, 400], [520, 400], [520, 338], or.ins[1]]],
    ],
    dots: [[360, 152], [390, 278]],
    texts: [['l-h2', 461, 110, 'Half adder 2', 'soft', 18], ['l-p', 342, 106, 'x⊕y', 'soft', 20], ['l-gg', 430, 390, 'xy', 'soft', 20]],
  };
  const C = {
    name: 'faC',
    gates: [['g-or', 'or', 560, 330]],
    wires: [
      ['w-s', 's', [x2.out, [650, 160]]], ['w-h', 'h', [a2.out, [540, 270], [540, 322], or.ins[0]]], ['w-c', 'c', [or.out, [660, 330]]],
    ],
    texts: [['l-s', 690, 170, 'S', 'green', 30], ['l-c', 690, 340, 'C', 'red', 30], ['l-hh', 612, 285, 'z(x⊕y)', 'soft', 20]],
  };
  const tags = { x: [92, 76], y: [92, 122], z: [92, 326], s: [735, 170], c: [735, 340] };
  return { parts: [A, B, C], tags };
}

const HA = haSop(), HP2 = haPos(false), HP3 = haPos(true), HX = haXor(), FA = faTwoHA();
const FLOW_HA = [['x', 'y'], ['nx', 'ny'], ['p1', 'p2', 'c'], ['s']];

// Adds up bits in a column: "1 + 1 + 1 = 11" with the carry in red and the sum in green.
async function addDemo(b, bitsArr, y = 280) {
  const n = bitsArr.reduce((a, c) => a + c, 0), c = n >> 1, s = n & 1;
  await b.write('sv-e', 520, y, bitsArr.join(' + ') + ' =', { size: 70, anchor: 'end' });
  await b.write('sv-c', 580, y, String(c), { size: 70, color: 'red', bold: true });
  await b.write('sv-s', 650, y, String(s), { size: 70, color: 'green', bold: true });
  await b.write('sv-cl', 580, y + 50, 'C', { size: 30, color: 'red' });
  await b.write('sv-sl', 650, y + 50, 'S', { size: 30, color: 'green' });
}

const FAROWS = Array.from({ length: 8 }, (_, m) => { const [x, y, z] = bits3(m); const n = x + y + z; return [x, y, z, n >> 1, n & 1]; });

const FACOLS = [{ h: 'x' }, { h: 'y' }, { h: 'z' }, { h: 'C', c: 'red' }, { h: 'S', c: 'green' }];

      quiz: { answer: ['10'], hint: '1+1 در binary می‌شود 10.', explain: '1 + 1 = 10 در binary؛ یعنی carry C=1 و sum S=0. پس CS = 10.' },
      solve: b => addDemo(b, [1, 1]),
    },
    {
      say: 'حالا full adder با x=1 و y=1 و z=1. دوباره CS را بنویسید.',
      draw: quizBoard(2, 5, 'Full adder:  x = y = z = 1  →  CS = ?', { size: 44 }),
      quiz: { answer: ['11'], hint: 'سه تا 1 را جمع کن: 1+1+1 = 3 و 3 در binary می‌شود 11.', explain: '1 + 1 + 1 = 3 = 11 در binary؛ carry=1 و sum=1.' },
      solve: b => addDemo(b, [1, 1, 1]),
    },
    {
      say: 'کدام عبارت sum یعنی S در half adder است؟',
      draw: quizBoard(3, 5, 'S در half adder کدام است؟', { size: 44, fa: true }),
      quiz: { choices: ["x'y + xy'", 'xy', "x'y' + xy", 'x + y'], correct: 0, explain: `S فقط وقتی 1 است که x و y متفاوت باشند: x'y + xy' (همان x ⊕ y).` },
      solve: async b => {
        await b.write('sv-t', 500, 250, 'S = 1 فقط وقتی x ≠ y', { size: 40, color: 'blue', fa: true });
        await b.write('sv-1', 300, 330, '01 → x\'y', { size: 40 });
        await b.write('sv-2', 700, 330, '10 → xy\'', { size: 40 });
        await b.write('sv-3', 500, 430, "S = x'y + xy'", { size: 50, color: 'green', bold: true });
      },
    },
    {
      say: 'carry C در full adder کدام است؟',
      draw: quizBoard(4, 5, 'C در full adder کدام است؟', { size: 44, fa: true }),
      quiz: { choices: ['xy + xz + yz', "x'y'z + x'yz' + xy'z' + xyz", 'x ⊕ y ⊕ z', 'xyz'], correct: 0, explain: 'C وقتی 1 است که حداقل دو ورودی 1 باشند: xy + xz + yz. گزینه‌ی دوم و سوم همان S هستند.' },
      solve: async b => {
        await b.write('sv-t', 500, 250, 'C = 1 وقتی حداقل دو تا 1 باشند', { size: 38, color: 'blue', fa: true });
        await b.write('sv-1', 500, 340, `${LTR('xy')}  یا  ${LTR('xz')}  یا  ${LTR('yz')}`, { size: 44, color: 'red', fa: true });
        await b.write('sv-2', 500, 430, 'C = xy + xz + yz', { size: 50, color: 'green', bold: true });
      },
    },
    {
      say: 'سؤال آخر: یک full adder را با half adder و OR می‌سازیم. چند تا half adder لازم است؟',
      draw: quizBoard(5, 5, 'چند half adder برای ساختن یک full adder؟', { size: 40, fa: true }),
      quiz: { answer: ['2'], hint: 'یکی x و y را جمع می‌کند، یکی نتیجه را با z.', explain: 'دو half adder: اولی x+y، دومی (x⊕y)+z، و یک OR برای دو carry.' },
      solve: async b => {
        await b.write('sv-a', 250, 270, 'HA 1', { size: 40, color: 'blue' });
        await b.write('sv-a2', 250, 320, 'x + y', { size: 30 });
        await b.write('sv-b', 500, 270, 'HA 2', { size: 40, color: 'blue' });
        await b.write('sv-b2', 500, 320, '(x⊕y) + z', { size: 30 });
        await b.write('sv-o', 750, 270, 'OR', { size: 40, color: 'red' });
        await b.write('sv-o2', 750, 320, 'دو carry', { size: 26, color: 'red', fa: true });
        await b.write('sv-n', 500, 420, '2 half adder', { size: 46, color: 'green', bold: true });
      },
    },
  ],
});
</script>

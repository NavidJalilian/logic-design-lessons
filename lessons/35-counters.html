<script>
// Lesson 35 — book slides 87–88 (Chapter 6: counters; 3-bit binary counter with T flip-flops).
// Explanations are Persian; numbers, math and technical terms stay as written in English.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run (numbers, math) intact inside Persian board text

// ---------------------------------------------------------------- counter logic
const bits3 = s => s.toString(2).padStart(3, '0');            // "A2A1A0"
const bit = (s, i) => (s >> i) & 1;                             // A_i of state s
const tNext = (q, T) => q ^ T;                                  // T flip-flop: Q(t+1) = T ⊕ Q
// The circuit's T inputs for present state s: TA2 = A1·A0, TA1 = A0, TA0 = 1.
const tIn = s => [1, bit(s, 0), bit(s, 1) & bit(s, 0)];         // [TA0, TA1, TA2]
// One clock pulse: every flip-flop applies its own T input.
const step = s => tIn(s).reduce((ns, t, i) => ns | (tNext(bit(s, i), t) << i), 0);
// T inputs needed to go from s to s+1 (T = 1 exactly where a bit changes).
const tNeed = s => [0, 1, 2].map(i => bit(s, i) ^ bit((s + 1) % 8, i));

// ---------------------------------------------------------------- circuit drawing
const FFX = [170, 420, 760];         // left edge of FF0, FF1, FF2
const TY = [200, 200, 208];          // y of each T input / Q output
async function drawCounter(b) {
  for (const [i, x] of FFX.entries()) {
    await b.box(`ff${i}`, x, 160, 100, 120, { color: 'ink', fill: 'soft', dur: 400 });
    await all([
      b.write(`ffT${i}`, x + 10, TY[i] + 8, 'T', { size: 22, anchor: 'start', bold: true, dur: 100 }),
      b.write(`ffC${i}`, x + 10, 262, 'C', { size: 22, anchor: 'start', color: 'orange', bold: true, dur: 100 }),
      b.write(`ffQ${i}`, x + 90, TY[i] + 8, 'Q', { size: 22, anchor: 'end', bold: true, dur: 100 }),
      b.write(`ffn${i}`, x + 50, 305, `FF${i}`, { size: 20, color: 'soft', dur: 100 }),
    ]);
  }
  await all([
    b.wire('wck', [[110, 330], [740, 330]], { color: 'orange' }),
    b.wire('wc0', [[150, 330], [150, 250], [170, 250]], { color: 'orange' }),
    b.wire('wc1', [[400, 330], [400, 250], [420, 250]], { color: 'orange' }),
    b.wire('wc2', [[740, 330], [740, 250], [760, 250]], { color: 'orange' }),
    b.dot('dc0', 150, 330, { color: 'orange' }), b.dot('dc1', 400, 330, { color: 'orange' }),
    b.write('lck', 88, 338, 'cp', { size: 26, color: 'orange', bold: true }),
  ]);
  await all([b.write('tv0', 125, 208, '1', { size: 28, color: 'green', bold: true }), b.wire('wt0', [[140, 200], [170, 200]])]);
  await b.wire('wa0', [[270, 200], [420, 200]], { color: 'blue' });
  await b.dot('da0', 330, 200, { color: 'blue' });
  await b.gate('and', 'and', 620, 208);
  const pa = b.pins('and', 620, 208);
  await all([
    b.wire('wa0b', [[330, 200], [330, 120], [600, 120], [600, 200], pa.ins[0]], { color: 'blue', dur: 600 }),
    b.wire('wa1', [[520, 200], [570, 200], [570, 216], pa.ins[1]], { color: 'blue' }),
  ]);
  await b.wire('wt2', [pa.out, [760, 208]]);
  await b.wire('wa2', [[860, 208], [930, 208]], { color: 'blue' });
  await all([
    b.write('la0', 296, 190, 'A_0', { size: 22, color: 'blue', bold: true }),
    b.write('la1', 545, 190, 'A_1', { size: 22, color: 'blue', bold: true }),
    b.write('la2', 905, 196, 'A_2', { size: 22, color: 'blue', bold: true }),
  ]);
}
// Shows state s: a digit inside each flip-flop, the T inputs (green = 1), and the big read-out.
async function showState(b, s) {
  const t = tIn(s);
  await all([
    ...FFX.map((x, i) => b.write(`ds${i}`, x + 55, 250, String(bit(s, i)), { size: 40, color: 'blue', bold: true, dur: 120 })),
    b.write('tv1', 385, 188, String(t[1]), { size: 24, color: t[1] ? 'green' : 'soft', bold: true, dur: 120 }),
    b.write('tv2', 722, 198, String(t[2]), { size: 24, color: t[2] ? 'green' : 'soft', bold: true, dur: 120 }),
    b.write('big', 500, 510, `A_2A_1A_0 = ${bits3(s)}   (= ${s})`, { size: 34, color: 'green', bold: true, dur: 200 }),
  ]);
}
const seqX = k => 100 + k * 100;
async function seqItem(b, k, s) {
  if (k) await b.write(`sa${k}`, seqX(k) - 50, 418, '→', { size: 22, color: 'soft', dur: 80 });
  await b.write(`sq${k}`, seqX(k), 420, bits3(s), { size: 26, color: k && s === 0 ? 'orange' : 'ink', bold: true, dur: 150 });
}
// One clock pulse from state s: light the T inputs that are 1, toggle those flip-flops, show the new state.
async function countPulse(b, s, k) {
  const t = tIn(s), ns = step(s);
  await b.pulse(['lck', 'wck']);
  await b.pulse(['tv0', ...(t[1] ? ['tv1'] : []), ...(t[2] ? ['tv2'] : [])]);
  await showState(b, ns);
  await b.pulse([0, 1, 2].filter(i => t[i]).map(i => `ds${i}`));
  await seqItem(b, k, ns);
  return ns;
}

// ---------------------------------------------------------------- count table
const PX = [110, 150, 190], NX = [290, 330, 370], TXc = [460, 515, 570];
const rowY = r => 150 + r * 46;

// ---------------------------------------------------------------- timing diagram
const TX = 160, TW = 90;
const px = k => TX + k * TW;
const rise = k => px(k) + TW / 4;
function sq(xs, lv, y, h = 36) {
  let d = `M${xs[0]} ${y - lv[0] * h}`;
  lv.forEach((v, k) => { const yy = y - v * h; if (k) d += `L${xs[k]} ${yy}`; d += `L${xs[k + 1]} ${yy}`; });
  return d;
}

// ---------------------------------------------------------------- quizzes
const QN = 6;
function quizBoard(n, question, o = { size: 40 }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از ${QN}`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 150, question, o);
  };
}
async function circuitSolve(b, s0, pulses) {
  await b.erase('q-q');
  await drawCounter(b);
  await showState(b, s0);
  await seqItem(b, 0, s0);
  let s = s0;
  for (let k = 1; k <= pulses; k++) s = await countPulse(b, s, k);
  if (!pulses) {
    const t = tIn(s0);
    await b.pulse(['tv0', 'tv1', 'tv2']);
    await b.write('tans', 500, 465, `TA_2 TA_1 TA_0 = ${t[2]}${t[1]}${t[0]}`, { size: 34, color: 'orange', bold: true });
  }
}

      },
    },
    // ---------------------------------------------------------- 16. timing
    {
      say: 'همین شمارش را روی نمودار زمانی ببینیم. A0 با هر پالس عوض می‌شود، A1 هر دو پالس یک بار، و A2 هر چهار پالس یک بار. هر flip-flop فرکانس قبلی را *نصف* می‌کند؛ اعداد بالای نمودار هم حالت شمارنده بعد از هر پالس هستند.',
      tip: true,
      draw: async b => {
        await b.clear();
        const n = 8, rows = [150, 250, 350, 450];
        const xs = [px(0)], lv = [];
        for (let k = 0; k < n; k++) { lv.push(0, 1, 0); xs.push(rise(k), rise(k) + TW / 2, px(k + 1)); }
        await b.write('ck-n', 100, rows[0] - 10, 'cp', { size: 26, color: 'orange', bold: true });
        await b.path('ck', sq(xs, lv, rows[0]), { color: 'orange', dur: 900 });
        const S = [0];
        for (let k = 0; k < n; k++) S.push(step(S[k]));
        for (let i = 0; i < 3; i++) {
          const ax = [px(0)], al = [bit(S[0], i)];
          for (let k = 0; k < n; k++) { ax.push(rise(k)); al.push(bit(S[k + 1], i)); }
          ax.push(px(n));
          await b.write(`a${i}-n`, 100, rows[i + 1] - 10, `A_${i}`, { size: 26, color: 'blue', bold: true });
          await b.path(`a${i}`, sq(ax, al, rows[i + 1]), { color: 'blue', dur: 900 });
        }
        for (let k = 0; k < n; k++) await b.write(`sn${k}`, rise(k) + TW * 0.4, 80, String(S[k + 1]), { size: 24, color: 'green', bold: true, dur: 100 });
        await b.write('sn-0', px(0) - 4, 80, '0', { size: 24, color: 'soft', bold: true });
      },
    },
    // ---------------------------------------------------------- 17. generalize
    {
      say: 'نکته‌ی امتحان: الگو را ببینید. هر بیت وقتی toggle می‌شود که *همه‌ی* بیت‌های پایین‌ترش 1 باشند. پس اگر شمارنده‌ی 4 بیتی بخواهند، بدون جدول هم می‌توانید بنویسید: TA3 = A2A1A0.',
      tip: true,
      draw: async b => {
        await b.clear();
        await b.write('h', 500, 90, 'الگوی کلی', { size: 44, color: 'orange', bold: true, fa: true });
        const L = ['TA_0 = 1', 'TA_1 = A_0', 'TA_2 = A_1A_0', 'TA_3 = A_2A_1A_0'];
        for (const [k, l] of L.entries()) await b.write(`g${k}`, 500, 170 + k * 70, l, { size: 38, color: k === 3 ? 'orange' : 'green', bold: true });
        await b.write('n', 500, 480, 'هر بیت وقتی عوض می‌شود که همه‌ی بیت‌های پایین‌ترش 1 باشند', { size: 26, fa: true });
      },
    },
    // ---------------------------------------------------------- 18. summary
    {
      say: 'جمع‌بندی آخرین درس: پنج نکته برای امتحان. یک بار دیگر بخوانیدشان، بعد برویم سراغ سؤال‌ها.',
      draw: async b => {
        await b.clear();
        await b.write('h', 500, 80, 'یادت باشد', { size: 48, color: 'orange', bold: true, fa: true });
        const L = [
          'شمارنده: مدار ترتیبی که با هر پالس به حالت بعدی می‌رود',
          `n بیت → n تا flip-flop → شمارش از 0 تا ${LTR('2^n − 1')}`,
          'با T flip-flop: هر جا بیت عوض می‌شود T = 1، وگرنه T = 0',
          `${LTR('TA2 = A1A0 ,  TA1 = A0 ,  TA0 = 1')}`,
          `بعد از ${LTR('111')} با پالس بعدی به ${LTR('000')} برمی‌گردد`,
        ];
        for (const [k, l] of L.entries()) await b.write(`m${k}`, 900, 160 + k * 72, '•  ' + l, { size: 27, anchor: 'start', fa: true });
      },
    },
    // ---------------------------------------------------------- quizzes
    {
      say: 'نوبت شماست! یک شمارنده‌ی دودویی که از 0 تا 15 بشمارد چند flip-flop لازم دارد؟',
      draw: quizBoard(1, '0 … 15  →  ? flip-flops'),
      quiz: { answer: ['4'], hint: 'با n flip-flop از 0 تا 2^n − 1 می‌شماریم.', explain: '2^4 − 1 = 15، پس 4 flip-flop.' },
      solve: async b => {
        await b.write('a1', 500, 260, '2^n − 1 = 15   →   2^n = 16', { size: 40 });
        await b.write('a2', 500, 340, 'n = 4', { size: 52, color: 'green', bold: true });
      },
    },
    {
      say: 'یک شمارنده‌ی دودویی 5 بیتی تا چه عددی (به decimal) می‌شمارد؟',
      draw: quizBoard(2, '5-bit binary counter:   0 … ?'),
      quiz: { answer: ['31'], hint: '2^n − 1 با n = 5.', explain: '2^5 − 1 = 32 − 1 = 31؛ یعنی از 00000 تا 11111.' },
      solve: async b => {
        await b.write('a1', 500, 260, '2^5 − 1 = 32 − 1', { size: 40 });
        await b.write('a2', 500, 340, '31   =   (11111)_2', { size: 48, color: 'green', bold: true });
      },
    },
    {
      say: 'شمارنده‌ی 3 بیتی در حالت 011 است. بعد از یک پالس، A2A1A0 چه می‌شود؟ سه بیت را بنویسید.',
      draw: quizBoard(3, 'A_2A_1A_0 = 011   →   one pulse   →   ?'),
      quiz: { answer: ['100'], hint: 'در 011 هر سه ورودی T یک هستند.', explain: 'TA2 = A1A0 = 1، TA1 = A0 = 1، TA0 = 1؛ هر سه بیت برعکس می‌شوند: 100.' },
      solve: b => circuitSolve(b, 3, 1),
    },
    {
      say: 'شمارنده در حالت 101 است. ورودی‌های TA2، TA1، TA0 به ترتیب چند هستند؟ سه بیت را بنویسید.',
      draw: quizBoard(4, 'A_2A_1A_0 = 101   →   TA_2 TA_1 TA_0 = ?'),
      quiz: { answer: ['011'], hint: 'TA2 = A1A0، TA1 = A0، TA0 = 1.', explain: 'TA2 = 0·1 = 0، TA1 = 1، TA0 = 1؛ پس 011 — و حالت بعدی 110 است.' },
      solve: b => circuitSolve(b, 5, 0),
    },
    {
      say: 'در شمارنده‌ی 3 بیتی با T flip-flop، ورودی TA2 کدام است؟',
      draw: quizBoard(5, 'TA_2 = ?', { size: 48 }),
      quiz: {
        choices: ['A_0', 'A_1A_0', 'A_2A_1'], correct: 1,
        explain: 'A2 فقط در 011 → 100 و 111 → 000 عوض می‌شود، یعنی وقتی A1 = A0 = 1.',
      },
      solve: async b => {
        await b.write('a1', 500, 260, '011 → 100        111 → 000', { size: 40, color: 'blue' });
        await b.write('a2', 500, 350, 'TA_2 = A_1A_0', { size: 48, color: 'green', bold: true });
      },
    },
    {
      say: 'سؤال آخر: شمارنده در حالت 110 است و سه پالس clock می‌آید. A2A1A0 در پایان چه می‌شود؟',
      draw: quizBoard(6, 'A_2A_1A_0 = 110   →   3 pulses   →   ?'),
      quiz: { answer: ['001'], hint: 'بعد از 111 دوباره 000 می‌آید.', explain: '110 → 111 → 000 → 001' },
      solve: b => circuitSolve(b, 6, 3),
    },
  ],
});
</script>

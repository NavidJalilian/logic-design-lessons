<script>
// Lesson 2 — book slide 3: binary addition, subtraction (borrow adds 2), multiplication.
// The slide's multiplication sketch is too small to read, so the teacher uses an own example (1011 × 101).

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`;
const bits = s => [...s].reverse().map(Number); // index 0 = rightmost column

// Two layouts: the big one for the lesson, a compact one under a quiz question.
const BIG = { right: 700, gap: 72, size: 56, yC: 125, yA: 195, yB: 265, yL: 290, yR: 350, side: 870 };
const SMALL = { right: 640, gap: 62, size: 44, yC: 225, yA: 280, yB: 330, yL: 350, yR: 400, side: 850 };
const X = (L, k) => L.right - k * L.gap;

// ---------------------------------------------------------------- addition
function addPlan(a, c) {
  const A = bits(a), B = bits(c), n = Math.max(A.length, B.length);
  const cols = [];
  let carry = 0;
  for (let k = 0; k < n; k++) {
    const s = (A[k] || 0) + (B[k] || 0) + carry;
    cols.push({ a: A[k] || 0, b: B[k] || 0, cin: carry, s, r: s % 2, cout: s >> 1 });
    carry = s >> 1;
  }
  if (carry) cols.push({ a: 0, b: 0, cin: 1, s: 1, r: 1, cout: 0, last: true });
  return { A, B, cols };
}
async function addSetup(b, P, a, c, L, sign = '+') {
  const A = bits(a), B = bits(c);
  for (let k = A.length - 1; k >= 0; k--) await b.write(`${P}a${k}`, X(L, k), L.yA, String(A[k]), { size: L.size, dur: 160 });
  for (let k = B.length - 1; k >= 0; k--) await b.write(`${P}b${k}`, X(L, k), L.yB, String(B[k]), { size: L.size, dur: 160 });
  const left = X(L, Math.max(A.length, B.length));
  await b.write(`${P}sign`, left - 10, L.yB, sign, { size: L.size, color: 'soft' });
  await b.line(`${P}bar`, left - 40, L.yL, L.right + L.gap / 2, L.yL, { color: 'ink' });
}
// Draws column k of an addition: highlight, side working, result bit, carry into the next column.
async function addCol(b, P, plan, k, L, explain = true) {
  const c = plan.cols[k], x = X(L, k);
  await b.erase(`${P}hl`, 150);
  await b.box(`${P}hl`, x - L.gap / 2 + 6, L.yC - 40, L.gap - 12, L.yR - L.yC + 60, { color: 'orange', r: 10, dur: 300 });
  if (explain) {
    await b.erase(`${P}ex*`, 150);
    const sum = c.last ? 'carry 1' : [c.a, c.b].concat(c.cin ? [c.cin] : []).join(' + ') + ` = ${c.s}`;
    await b.write(`${P}ex1`, L.side, L.yA, sum, { size: 30, color: 'blue' });
    await b.write(`${P}ex2`, L.side, L.yA + 50, `= (${c.s.toString(2)})_2`, { size: 28, color: 'blue' });
    if (!c.last) await b.write(`${P}ex3`, L.side, L.yA + 100, c.cout ? `بنویس ${c.r}، یکی ده‌بر` : `بنویس ${c.r}`, { size: 22, color: 'soft', fa: true });
  }
  await b.write(`${P}r${k}`, x, L.yR, String(c.r), { size: L.size, color: 'green', bold: true });
  if (c.cout) await b.write(`${P}c${k + 1}`, X(L, k + 1), L.yC, '1', { size: L.size * 0.5, color: 'red', bold: true });
}
async function addAll(b, P, a, c, L) {
  const plan = addPlan(a, c);
  await addSetup(b, P, a, c, L);
  for (let k = 0; k < plan.cols.length; k++) await addCol(b, P, plan, k, L, false);
  await b.erase(`${P}hl`);
  return plan;
}

// ---------------------------------------------------------------- subtraction
// Borrowing: take 1 from the next column that has a 1; every column in between becomes 1, and the
// column that needed it gets +2 (in base 2 a borrowed 1 is worth 2).
function subPlan(a, c) {
  const cur = bits(a), B = bits(c), struck = new Set(), cols = [];
  for (let k = 0; k < cur.length; k++) {
    const marks = [];
    const bk = B[k] || 0;
    if (cur[k] < bk) {
      let j = k + 1;
      while (cur[j] === 0) j++;
      for (let m = j; m >= k; m--) {
        cur[m] = m === j ? cur[m] - 1 : m === k ? cur[m] + 2 : 1;
        marks.push({ col: m, val: cur[m], strike: !struck.has(m) });
        struck.add(m);
      }
    }
    cols.push({ top: cur[k], b: bk, r: cur[k] - bk, marks });
  }
  return { cols };
}
async function subSetup(b, P, a, c, L) { return addSetup(b, P, a, c, L, '−'); }
async function subCol(b, P, plan, k, L, explain = true) {
  const c = plan.cols[k], x = X(L, k);
  await b.erase(`${P}hl`, 150);
  await b.box(`${P}hl`, x - L.gap / 2 + 6, L.yC - 40, L.gap - 12, L.yR - L.yC + 60, { color: 'orange', r: 10, dur: 300 });
  if (explain) await b.erase(`${P}ex*`, 150);
  for (const m of c.marks) {
    if (m.strike) await b.line(`${P}x${m.col}`, X(L, m.col) - 16, L.yA - 8, X(L, m.col) + 16, L.yA - 26, { color: 'red', dur: 200 });
    await b.write(`${P}u${m.col}`, X(L, m.col), L.yC, String(m.val), { size: L.size * 0.5, color: 'red', bold: true, dur: 200 });
  }
  if (explain) {
    await b.write(`${P}ex1`, L.side, L.yA, `${c.top} − ${c.b} = ${c.r}`, { size: 30, color: 'blue' });
    if (c.marks.length) await b.write(`${P}ex2`, L.side, L.yA + 50, `قرض: ${LTR('0 + 2 = 2')}`, { size: 22, color: 'soft', fa: true });
  }
  await b.write(`${P}r${k}`, x, L.yR, String(c.r), { size: L.size, color: 'green', bold: true });
}
async function subAll(b, P, a, c, L) {
  const plan = subPlan(a, c);
  await subSetup(b, P, a, c, L);
  for (let k = 0; k < plan.cols.length; k++) await subCol(b, P, plan, k, L, false);
  await b.erase(`${P}hl`);
}

// ---------------------------------------------------------------- multiplication
async function mulAll(b, P, a, c, top, right = 640, gap = 56, size = 40) {
  const x = k => right - k * gap;
  const A = bits(a), B = bits(c);
  const row = (id, s, y, shift, o) => all([...s].reverse().map((d, k) => b.write(`${id}-${k}`, x(k + shift), y, d, { size, dur: 120, ...o })));
  await row(`${P}a`, a, top, 0);
  await row(`${P}b`, c, top + 50, 0);
  await b.write(`${P}x`, x(Math.max(A.length, B.length)) - 10, top + 50, '×', { size, color: 'soft' });
  await b.line(`${P}l1`, x(A.length + B.length) , top + 68, right + 30, top + 68);
  for (let i = 0; i < B.length; i++) {
    const pp = B[i] ? a : '0'.repeat(a.length);
    await b.pulse(`${P}b-${i}`, 350);
    await row(`${P}p${i}`, pp, top + 110 + i * 45, i, { color: B[i] ? 'ink' : 'soft' });
  }
  const yl = top + 110 + B.length * 45 - 22;
  await b.line(`${P}l2`, x(A.length + B.length), yl, right + 30, yl);
  const prod = (parseInt(a, 2) * parseInt(c, 2)).toString(2);
  await row(`${P}r`, prod, yl + 45, 0, { color: 'green', bold: true });
  return prod;
}

function quizBoard(n, question, o = { size: 54 }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از 5`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 150, question, o);
  };
}

// The book's examples.

  'ده‌بر آخر جایی برای رفتن ندارد، پس همان 1 را جلوی جواب می‌نویسیم.',
];

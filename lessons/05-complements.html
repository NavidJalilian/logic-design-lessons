// Lesson 5 — book slide 8 (+ the (r−1)'s complement definition from slide 10): complements.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run intact inside Persian board text

// Complements computed in code (strings of n digits in base r).
function rComp(N, r) { const n = N.length; const v = r ** n - parseInt(N, r); return (v % r ** n).toString(r).toUpperCase().padStart(n, '0'); }
function r1Comp(N, r) { return [...N].map(d => (r - 1 - parseInt(d, r)).toString(r).toUpperCase()).join(''); }

// A number written digit by digit, right-aligned at xr, so columns line up. ids: p0, p1, ...
async function colNum(b, p, str, xr, y, o = {}) {
  const cw = o.cw ?? 32, L = str.length;
  for (let i = 0; i < L; i++) await b.write(`${p}${i}`, xr - (L - 1 - i) * cw, y, str[i], { size: o.size ?? 44, color: o.color ?? 'ink', bold: o.bold, dur: o.dur ?? 70 });
}
// Column subtraction  top − bottom = res, right-aligned at xr.
async function colSub(b, p, top, bottom, res, xr, y0, o = {}) {
  const cw = o.cw ?? 32, L = Math.max(top.length, bottom.length, res.length);
  await colNum(b, `${p}t`, top, xr, y0, { cw });
  await colNum(b, `${p}b`, bottom, xr, y0 + 70, { cw });
  await b.write(`${p}m`, xr - L * cw - 10, y0 + 70, '−', { size: 44 });
  await b.line(`${p}l`, xr - L * cw - 35, y0 + 92, xr + 22, y0 + 92, { color: 'soft' });
  await colNum(b, `${p}r`, res, xr, y0 + 150, { cw, color: 'green', bold: true, dur: 110 });
}

function quizBoard(n, question, o = { size: 50 }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از 6`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 150, question, o);
  };
}
// Quiz solution: top − N column subtraction plus a one-line note on the right.
async function solveSub(b, top, N, res, note) {
  await colSub(b, 's-', top, N, res, 440, 250);
  await b.write('s-n', 760, 330, note, { size: 30, color: 'blue' });
}

// Lesson 30 — book slides 70–75 (Chapter 5: multiplexers, implementing functions with a MUX, demultiplexer).
// Explanations are Persian; numbers, math and technical terms stay as written in English.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run (numbers, math) intact inside Persian board text
const on = (v, c = 'orange') => (v ? c : 'ink');
const bits = (i, n) => i.toString(2).padStart(n, '0');

// ---------------------------------------------------------------- implementation table (computed)
// For each MUX input I_c: the minterm with the input variable = 0 (top row) and = 1 (bottom row),
// whether each is in the function, and the rule's result: 0, 1, v or v'.
function impl(mins, vars, inVar) {
  const n = vars.length, k = vars.indexOf(inVar);
  const cols = [];
  for (let c = 0; c < 2 ** (n - 1); c++) {
    const mint = v => {
      const bs = [];
      let ci = 0;
      for (let j = 0; j < n; j++) {
        if (j === k) bs.push(v);
        else { bs.push((c >> (n - 2 - ci)) & 1); ci++; }
      }
      return parseInt(bs.join(''), 2);
    };
    const top = mint(0), bot = mint(1), t = mins.includes(top), bo = mins.includes(bot);
    cols.push({ top, bot, t, bo, res: t && bo ? '1' : !t && !bo ? '0' : bo ? inVar : inVar + "'" });
  }
  return { cols, sel: [...vars].filter(v => v !== inVar) };
}
const EX1 = impl([1, 3, 5, 6], 'ABC', 'A');            // → 0, 1, A, A'
const EXB = impl([], 'ABC', 'B');                       // layout only: B as the input
const EX2 = impl([1, 2, 4, 5], 'ABC', 'C');             // → C, C', 1, 0
const EX3 = impl([0, 1, 3, 4, 8, 9, 15], 'ABCD', 'A'); // → 1, 1, 0, A', A', 0, 0, A

// Table geometry: columns at x0 + dx*c; rows at y0 (header), y0+55 (v'), y0+110 (v), y0+175 (result).
async function drawImpl(b, id, T, inVar, x0, dx, y0, size = 30) {
  const n = T.cols.length;
  await all(T.cols.map((_, c) => b.write(`${id}-h${c}`, x0 + dx * c, y0, `I_${c}`, { size: size - 4, color: 'blue', bold: true, dur: 100 })));
  await b.line(`${id}-hl`, x0 - 90, y0 + 15, x0 + dx * (n - 1) + 40, y0 + 15, { color: 'soft', width: 2 });
  await all([
    b.write(`${id}-r0`, x0 - 70, y0 + 60, inVar + "'", { size: size - 2, color: 'purple', bold: true }),
    b.write(`${id}-r1`, x0 - 70, y0 + 115, inVar, { size: size - 2, color: 'purple', bold: true }),
  ]);
  for (const [c, col] of T.cols.entries()) {
    await all([
      b.write(`${id}-t${c}`, x0 + dx * c, y0 + 60, String(col.top), { size, dur: 100 }),
      b.write(`${id}-b${c}`, x0 + dx * c, y0 + 115, String(col.bot), { size, dur: 100 }),
    ]);
  }
}
async function circleImpl(b, id, T, x0, dx, y0) {
  for (const [c, col] of T.cols.entries()) {
    const jobs = [];
    if (col.t) jobs.push(b.ring(`${id}-ct${c}`, x0 + dx * c, y0 + 50, 24, 24, { color: 'orange', dur: 250 }));
    if (col.bo) jobs.push(b.ring(`${id}-cb${c}`, x0 + dx * c, y0 + 105, 24, 24, { color: 'orange', dur: 250 }));
    await all(jobs);
  }
}
async function resultImpl(b, id, T, x0, dx, y0, size = 32) {
  await b.line(`${id}-rl`, x0 - 90, y0 + 140, x0 + dx * (T.cols.length - 1) + 40, y0 + 140, { color: 'soft', width: 2 });
  await b.write(`${id}-ra`, x0 - 70, y0 + 182, '→', { size: 30, color: 'green' });
  for (const [c, col] of T.cols.entries()) await b.write(`${id}-res${c}`, x0 + dx * c, y0 + 182, col.res, { size, color: 'green', bold: true, dur: 200 });
}

// ---------------------------------------------------------------- MUX block symbol
// ins: labels for I_0..; sel: select labels (most significant first)
async function muxBlock(b, id, { x = 420, top, gap, ins, sel, inLabels = true, out = 'Y', title = '' }) {
  const h = gap * ins.length + 30;
  await b.box(id, x, top, 160, h, { fill: 'soft', r: 8 });
  await b.write(`${id}-t`, x + 95, top + h / 2 + 10, title || `${ins.length}×1`, { size: 28, bold: true });
  await b.write(`${id}-t2`, x + 95, top + h / 2 + 40, 'MUX', { size: 20, color: 'soft' });
  for (const [k, lab] of ins.entries()) {
    const y = top + 30 + gap * k;
    await all([
      b.wire(`${id}-i${k}`, [[x - 50, y], [x, y]], { dur: 100 }),
      b.write(`${id}-in${k}`, x + 16, y + 6, String(k), { size: 16, color: 'purple', dur: 60 }),
      inLabels ? b.write(`${id}-il${k}`, x - 80, y + 9, lab, { size: 26, color: 'blue', bold: true, dur: 100 }) : Promise.resolve(),
    ]);
  }
  for (const [k, s] of sel.entries()) {
    const sx = x + 40 + k * (80 / Math.max(1, sel.length - 1));
    await all([
      b.wire(`${id}-s${k}`, [[sx, top + h], [sx, top + h + 30]], { dur: 100 }),
      b.write(`${id}-sl${k}`, sx, top + h + 55, s, { size: 22, color: 'purple', bold: true, dur: 80 }),
    ]);
  }
  await b.wire(`${id}-o`, [[x + 160, top + h / 2], [x + 220, top + h / 2]], { dur: 150 });
  await b.write(`${id}-ol`, x + 245, top + h / 2 + 10, out, { size: 30, color: 'green', bold: true });
  return { h, inY: k => top + 30 + gap * k, outY: top + h / 2 };
}

// ---------------------------------------------------------------- 4-to-1 MUX gate circuit
const AX = 600, AY = [100, 200, 300, 400];
const SR = { S1: 200, S1p: 340, S0: 370, S0p: 490 }, SROW = { S1: 470, S0: 510 };
const aRail = (k, j) => (j === 1 ? ((k >> 1) ? 'S1' : 'S1p') : ((k & 1) ? 'S0' : 'S0p'));
const aPin = (k, j) => AY[k] + (j - 1) * 16;
const OR4 = { x: 780, y: 250 };
const VROUTE = [740, 715, 720, 735];
async function drawMux4(b) {
  for (const s of ['S1', 'S0']) {
    const Y = SROW[s], nx = s === 'S1' ? 250 : 400;
    await b.write(`ml${s}`, 50, Y + 8, s === 'S1' ? 'S_1' : 'S_0', { size: 24, color: 'purple', bold: true, dur: 80 });
    await b.wire(`mi${s}`, [[70, Y], [nx, Y]], { dur: 150 });
    await b.gate(`mn${s}`, 'not', nx, Y, { dur: 200 });
    await b.wire(`mc${s}`, [[nx + 62, Y], [SR[s + 'p'], Y]], { dur: 100 });
    await b.dot(`md${s}`, SR[s], Y);
  }
  for (const r of Object.keys(SR)) {
    const ys = [];
    for (let k = 0; k < 4; k++) for (const j of [1, 2]) if (aRail(k, j) === r) ys.push(aPin(k, j));
    await b.wire(`mr${r}`, [[SR[r], Math.min(...ys)], [SR[r], SROW[r.slice(0, 2)]]], { dur: 200 });
  }
  await all([
    b.write('mrl1', SR.S1p + 16, SROW.S1 - 12, "S_1'", { size: 15, color: 'purple', dur: 60 }),
    b.write('mrl0', SR.S0p + 16, SROW.S0 - 12, "S_0'", { size: 15, color: 'purple', dur: 60 }),
  ]);
  const p = b.pins('or', OR4.x, OR4.y, 4);
  for (let k = 0; k < 4; k++) {
    await all([
      b.write(`mil${k}`, 50, aPin(k, 0) + 7, `I_${k}`, { size: 22, color: 'blue', bold: true, dur: 80 }),
      b.wire(`mw${k}-0`, [[70, aPin(k, 0)], [AX, aPin(k, 0)]], { dur: 200 }),
      ...[1, 2].map(j => b.wire(`mw${k}-${j}`, [[SR[aRail(k, j)], aPin(k, j)], [AX, aPin(k, j)]], { dur: 150 })),
      ...[1, 2].map(j => b.dot(`md${k}-${j}`, SR[aRail(k, j)], aPin(k, j), { r: 4 })),
    ]);
    await b.gate(`ma${k}`, 'and', AX, AY[k], { dur: 200 });
    await b.wire(`mo${k}`, [[AX + 60, AY[k]], [VROUTE[k], AY[k]], [VROUTE[k], p.ins[k][1]], p.ins[k]], { dur: 200 });
  }
  await b.gate('mor', 'or', OR4.x, OR4.y);
  await b.wire('mout', [p.out, [900, OR4.y]]);
  await b.write('mY', 930, OR4.y + 10, 'Y', { size: 32, color: 'green', bold: true });
}
async function setMux4(b, s1, s0, I) {
  const sig = { S1: s1, S1p: 1 - s1, S0: s0, S0p: 1 - s0 };
  const sel = 2 * s1 + s0, jobs = [];
  jobs.push(b.recolor('miS1', on(s1)), b.recolor('mcS1', on(1 - s1)), b.recolor('miS0', on(s0)), b.recolor('mcS0', on(1 - s0)));
  for (const r of Object.keys(SR)) jobs.push(b.recolor(`mr${r}`, on(sig[r])));
  for (let k = 0; k < 4; k++) {
    jobs.push(b.recolor(`mw${k}-0`, on(I[k])));
    for (const j of [1, 2]) jobs.push(b.recolor(`mw${k}-${j}`, on(sig[aRail(k, j)])));
    jobs.push(b.recolor(`mo${k}`, on(k === sel && I[k])));
  }
  jobs.push(b.recolor('mout', on(I[sel])));
  await all(jobs);
  await all([
    ...I.map((v, k) => b.write(`miv${k}`, 100, aPin(k, 0) - 8, String(v), { size: 20, color: 'orange', bold: true })),
    b.write('msv1', 100, SROW.S1 - 10, String(s1), { size: 20, color: 'orange', bold: true }),
    b.write('msv0', 100, SROW.S0 - 10, String(s0), { size: 20, color: 'orange', bold: true }),
  ]);
  await b.pulse(`ma${sel}`);
  await b.write('mYv', 930, OR4.y + 50, `= ${I[sel]}`, { size: 26, color: 'green', bold: true });
}

function quizBoard(n, question, o = { size: 46 }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از 5`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 125, question, o);
  };
}

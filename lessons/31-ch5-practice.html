// Lesson 31 — book slide 76 (Chapter 5 exercises), solved step by step.
// Explanations are Persian; numbers, math and technical terms stay as written in English.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run (numbers, math) intact inside Persian board text
const bits = (i, n) => i.toString(2).padStart(n, '0');

// ---------------------------------------------------------------- MUX implementation table (computed)
function impl(mins, vars, inVar) {
  const n = vars.length, k = vars.indexOf(inVar);
  const cols = [];
  for (let c = 0; c < 2 ** (n - 1); c++) {
    const mint = v => {
      const bs = [];
      let ci = 0;
      for (let j = 0; j < n; j++) {
        if (j === k) bs.push(v);
        else { bs.push((c >> (n - 2 - ci)) & 1); ci++; }
      }
      return parseInt(bs.join(''), 2);
    };
    const top = mint(0), bot = mint(1), t = mins.includes(top), bo = mins.includes(bot);
    cols.push({ top, bot, t, bo, res: t && bo ? '1' : !t && !bo ? '0' : bo ? inVar : inVar + "'" });
  }
  return { cols, sel: [...vars].filter(v => v !== inVar) };
}
const F4 = [0, 2, 4, 7];
const E4A = impl(F4, 'xyz', 'x');   // part a: x (the "A", most significant) is the input → 1, 0, x', x
const E4C = impl(F4, 'xyz', 'z');   // part b: z (the "C", least significant) is the input → z', z', z', z
const resStr = T => T.cols.map(c => c.res).join(' , ');

async function drawImpl(b, id, T, inVar, x0, dx, y0, colHead) {
  await all(T.cols.map((_, c) => b.write(`${id}-h${c}`, x0 + dx * c, y0, `I_${c}`, { size: 26, color: 'blue', bold: true, dur: 100 })));
  if (colHead) await all(T.cols.map((_, c) => b.write(`${id}-s${c}`, x0 + dx * c, y0 - 38, `${colHead}=${bits(c, 2)}`, { size: 18, color: 'soft', dur: 80 })));
  await b.line(`${id}-hl`, x0 - 90, y0 + 15, x0 + dx * (T.cols.length - 1) + 40, y0 + 15, { color: 'soft', width: 2 });
  await all([
    b.write(`${id}-r0`, x0 - 70, y0 + 60, inVar + "'", { size: 28, color: 'purple', bold: true }),
    b.write(`${id}-r1`, x0 - 70, y0 + 115, inVar, { size: 28, color: 'purple', bold: true }),
  ]);
  for (const [c, col] of T.cols.entries()) {
    await all([
      b.write(`${id}-t${c}`, x0 + dx * c, y0 + 60, String(col.top), { size: 30, dur: 100 }),
      b.write(`${id}-b${c}`, x0 + dx * c, y0 + 115, String(col.bot), { size: 30, dur: 100 }),
    ]);
  }
}
async function solveImpl(b, id, T, inVar, colHead) {
  const x0 = 380, dx = 120, y0 = 230;
  await drawImpl(b, id, T, inVar, x0, dx, y0, colHead);
  for (const [c, col] of T.cols.entries()) {
    const jobs = [];
    if (col.t) jobs.push(b.ring(`${id}-ct${c}`, x0 + dx * c, y0 + 50, 24, 24, { color: 'orange', dur: 250 }));
    if (col.bo) jobs.push(b.ring(`${id}-cb${c}`, x0 + dx * c, y0 + 105, 24, 24, { color: 'orange', dur: 250 }));
    await all(jobs);
  }
  await b.line(`${id}-rl`, x0 - 90, y0 + 140, x0 + dx * 3 + 40, y0 + 140, { color: 'soft', width: 2 });
  await b.write(`${id}-ra`, x0 - 70, y0 + 182, '→', { size: 30, color: 'green' });
  for (const [c, col] of T.cols.entries()) await b.write(`${id}-res${c}`, x0 + dx * c, y0 + 182, col.res, { size: 34, color: 'green', bold: true, dur: 200 });
}

// ---------------------------------------------------------------- decoder blocks
// A decoder box with inputs on the left and outputs 0..n-1 on the right (stubs end at x + w + 30).
async function decoderBox(b, id, { x, top, w, gapOut, ins, outs, title }) {
  const h = gapOut * outs + 30;
  await b.box(id, x, top, w, h, { fill: 'soft', r: 8 });
  await b.write(`${id}-t`, x + w / 2, top + h / 2 + 10, title, { size: 28, bold: true });
  const inGap = h / (ins.length + 1);
  for (const [k, v] of ins.entries()) {
    const y = top + inGap * (k + 1);
    await all([
      b.wire(`${id}-i${k}`, [[x - 50, y], [x, y]], { dur: 120 }),
      b.write(`${id}-il${k}`, x - 75, y + 9, v, { size: 26, color: 'blue', bold: true, dur: 80 }),
    ]);
  }
  const outY = k => top + 30 + gapOut * k;
  for (let k = 0; k < outs; k++) {
    await all([
      b.wire(`${id}-o${k}`, [[x + w, outY(k)], [x + w + 30, outY(k)]], { dur: 80 }),
      b.write(`${id}-ol${k}`, x + w - 15, outY(k) + 6, String(k), { size: 18, color: 'purple', dur: 60 }),
    ]);
  }
  return { outY, outX: x + w + 30 };
}
// Wires outputs into one gate; the output farthest from its pin gets the vertical furthest right.
async function autoRoute(b, id, outs, outY, x0, kind, gx, gy) {
  const n = outs.length, p = b.pins(kind, gx, gy, n);
  const legs = [...outs].sort((a, c) => a - c).map((o, k) => ({ o, pin: p.ins[k], d: Math.abs(outY(o) - p.ins[k][1]) }));
  [...legs].sort((a, c) => a.d - c.d).forEach((l, r) => { l.v = gx - 30 - (n - 1 - r) * 20; });
  for (const l of legs) await b.wire(`${id}-w${l.o}`, [[x0, outY(l.o)], [l.v, outY(l.o)], [l.v, l.pin[1]], l.pin], { dur: 250 });
  await b.gate(`${id}-g`, kind, gx, gy);
  return p.out;
}

// Exercise 2: 1-bit comparator from a 2×4 decoder (inputs A0, B0 → outputs are the minterms of A0B0).
const CMP = [0, 1, 2, 3].map(m => { const a = m >> 1, bb = m & 1; return { m, a, b: bb, gt: +(a > bb), eq: +(a === bb), lt: +(a < bb) }; });
const EQ_OUTS = CMP.filter(r => r.eq).map(r => r.m), GT_OUT = CMP.find(r => r.gt).m, LT_OUT = CMP.find(r => r.lt).m;
async function drawCmpDecoder(b) {
  const d = await decoderBox(b, 'cd', { x: 300, top: 120, w: 140, gapOut: 80, ins: ['A_0', 'B_0'], outs: 4, title: '2×4' });
  for (const [id, m, lab] of [['lt', LT_OUT, 'A<B'], ['gt', GT_OUT, 'A>B']]) {
    await b.wire(`cd-${id}`, [[d.outX, d.outY(m)], [570, d.outY(m)]]);
    await b.write(`cd-${id}l`, 615, d.outY(m) + 9, lab, { size: 28, color: 'green', bold: true });
  }
  const p = b.pins('or', 700, 270, 2), V = [670, 680];
  for (const [k, m] of EQ_OUTS.entries()) {
    await b.wire(`cq-w${m}`, [[d.outX, d.outY(m)], [V[k], d.outY(m)], [V[k], p.ins[k][1]], p.ins[k]], { dur: 300 });
  }
  await b.gate('cq-g', 'or', 700, 270);
  await b.wire('cd-eq', [p.out, [830, 270]]);
  await b.write('cd-eql', 875, 279, 'A=B', { size: 28, color: 'green', bold: true });
  return d;
}

// Exercise 3: f(x,y,z) = Σ(0,2,3,5) from a 3×8 decoder and an OR.
const F3 = [0, 2, 3, 5];
async function drawF3(b) {
  const d = await decoderBox(b, 'd3', { x: 300, top: 90, w: 150, gapOut: 50, ins: ['x', 'y', 'z'], outs: 8, title: '3×8' });
  const o = await autoRoute(b, 'f3', F3, d.outY, d.outX, 'or', 660, 240);
  await b.wire('f3-o', [o, [780, 240]]);
  await b.write('f3-l', 805, 249, 'f', { size: 34, color: 'green', bold: true });
  await all(F3.map(k => b.recolor(`d3-ol${k}`, 'orange')));
  return d;
}

function quizBoard(n, total, question, o = { size: 44 }) {
  return async b => {

    await b.write('q-n', 500, 60, `تمرین ${n}`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 125, question, o);
    void total;
  };
}

      say: 'یادآوری روش: MUX 4×1 با دو خط select. جدول پیاده‌سازی می‌کشیم: سطر بالا minterm هایی که متغیر ورودی‌شان 0 است، سطر پایین آن‌هایی که 1 است. minterm های تابع را دایره می‌کشیم و ستون به ستون: هیچ → 0، هر دو → 1، فقط پایین → متغیر، فقط بالا → مکمل متغیر.',

      solve: b => solveImpl(b, 'A', E4A, 'x', 'yz'),

    // ---------------------------------------------------------- 16. quiz 4b

      quiz: {

      solve: b => solveImpl(b, 'C', E4C, 'z', 'xy'),

    // ---------------------------------------------------------- 17. quiz check
    {
      say: 'یک بررسی: در قسمت ب، وقتی xy = 11 باشد f برابر چیست؟',

      quiz: {
        choices: ["z'", 'z', '1'], correct: 1,
        explain: 'xy = 11 ورودی I3 را انتخاب می‌کند که برابر z است. بررسی: minterm 6 (110) در تابع نیست و minterm 7 (111) هست، پس f = z.',
      },
      solve: async b => {
        await b.write('s1', 500, 250, 'xy = 11  →  I_3', { size: 44, color: 'purple' });

    // ---------------------------------------------------------- 18. summary
    {

      draw: async b => {
        await b.clear();
        await b.write('h', 500, 75, 'یادت باشد', { size: 48, color: 'orange', bold: true, fa: true });

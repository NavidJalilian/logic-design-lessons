// Lesson 4 — book slides 6–7 (Chapter 1): binary ↔ octal (3-bit groups) ↔ hex (4-bit groups).

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run intact inside Persian board text
const DIG = '0123456789ABCDEF';

// Plans the grouping of a binary string into n-bit groups, counted outward from the point (px).
// Each bit has a raw x (written side by side) and a grouped x (spread into groups). Zeros are
// padded on the far left of the whole part and the far right of the fraction.
function grouping(bin, n, px, cw = 22, gap = 26) {
  const [w, f = ''] = bin.split('.');
  const padW = (n - w.length % n) % n, padF = f ? (n - f.length % n) % n : 0;
  const W = '0'.repeat(padW) + w, Fr = f + '0'.repeat(padF);
  const bits = [];
  for (let i = 0; i < W.length; i++) {
    const r = W.length - 1 - i, g = Math.floor(r / n);
    bits.push({ ch: W[i], pad: i < padW, side: 'w', g, gx: px - gap - cw / 2 - r * cw - g * gap, rx: px - cw * 0.8 - r * cw });
  }
  for (let i = 0; i < Fr.length; i++) {
    const g = Math.floor(i / n);
    bits.push({ ch: Fr[i], pad: i >= f.length, side: 'f', g, gx: px + gap + cw / 2 + i * cw + g * gap, rx: px + cw * 0.8 + i * cw });
  }
  const groups = [];
  for (const side of ['w', 'f']) {
    const gs = [...new Set(bits.filter(t => t.side === side).map(t => t.g))];
    for (const g of gs) {
      const idx = bits.map((t, k) => k).filter(k => bits[k].side === side && bits[k].g === g);
      const xs = idx.map(k => bits[k].gx), str = idx.map(k => bits[k].ch).join('');
      groups.push({ side, g, idx, x0: Math.min(...xs), x1: Math.max(...xs), cx: (Math.min(...xs) + Math.max(...xs)) / 2, str, digit: DIG[parseInt(str, 2)] });
    }
  }
  const wg = groups.filter(g => g.side === 'w').sort((a, b) => b.g - a.g);
  const fg = groups.filter(g => g.side === 'f').sort((a, b) => a.g - b.g);
  const answer = wg.map(g => g.digit).join('') + (fg.length ? '.' + fg.map(g => g.digit).join('') : '');
  return { bits, groups, px, padW, padF, hasPoint: !!f, answer };
}
// Writes the bits side by side (no pads yet).
async function drawRaw(b, p, P, y, size = 34) {
  for (const [k, t] of P.bits.entries()) if (!t.pad) await b.write(`${p}b${k}`, t.rx, y, t.ch, { size, dur: 70 });
  if (P.hasPoint) await b.write(`${p}pt`, P.px, y, '.', { size });
}
// Spreads one side into groups, adds red padding zeros, underlines each group.
async function groupSide(b, p, P, side, y, size = 34) {
  const ks = P.bits.map((t, k) => k).filter(k => P.bits[k].side === side);
  await all(ks.filter(k => !P.bits[k].pad).map(k => b.move(`${p}b${k}`, P.bits[k].gx - P.bits[k].rx, 0)));
  for (const k of ks.filter(k => P.bits[k].pad)) await b.write(`${p}b${k}`, P.bits[k].gx, y, '0', { size, color: 'red', bold: true, dur: 150 });
  await all(P.groups.filter(g => g.side === side).map(g => b.line(`${p}u${side}${g.g}`, g.x0 - 10, y + 12, g.x1 + 10, y + 12, { color: 'purple', width: 2.5, dur: 300 })));
}
async function groupDigits(b, p, P, side, y, size = 34) {
  const gs = P.groups.filter(g => g.side === side).sort((a, c) => (side === 'w' ? c.g - a.g : a.g - c.g));
  for (const g of gs) await b.write(`${p}d${side}${g.g}`, g.cx, y, g.digit, { size, color: 'blue', bold: true, dur: 200 });
  if (side === 'w' && P.hasPoint) await b.write(`${p}dpt`, P.px, y, '.', { size, color: 'blue' });
}
async function fullGrouping(b, p, bin, n, px, y) {
  const P = grouping(bin, n, px);
  await drawRaw(b, p, P, y);
  await groupSide(b, p, P, 'w', y);
  if (P.hasPoint) await groupSide(b, p, P, 'f', y);
  await groupDigits(b, p, P, 'w', y + 60);
  if (P.hasPoint) await groupDigits(b, p, P, 'f', y + 60);
  return P.answer;
}

// Point x that centres a grouped number on cx.
function centerPx(bin, n, cx = 500) {
  const xs = grouping(bin, n, 0).bits.map(t => t.gx);
  return Math.round(cx - (Math.min(...xs) + Math.max(...xs)) / 2);
}

// Reverse: each octal / hex digit → its n-bit group, written under it with an arrow.
async function expandDigits(b, p, num, n, cx, y, sp) {
  const chars = [...num], p0 = chars.indexOf('.');
  const ds = chars.filter(c => c !== '.'), intLen = p0 < 0 ? ds.length : p0;
  const width = (ds.length - 1) * sp + (intLen < ds.length ? sp * 0.4 : 0);
  const X = j => cx - width / 2 + j * sp + (j >= intLen ? sp * 0.4 : 0);
  for (const [j, d] of ds.entries()) await b.write(`${p}x${j}`, X(j), y, d, { size: 50, dur: 150 });
  const ptX = intLen < ds.length ? X(intLen - 1) + sp * 0.7 : null;
  if (ptX) await b.write(`${p}xpt`, ptX, y, '.', { size: 50 });
  const G = ds.map(d => parseInt(d, 16).toString(2).padStart(n, '0'));
  for (const [j, g] of G.entries()) {
    await b.arrow(`${p}xa${j}`, X(j), y + 12, X(j), y + 45, { color: 'soft', head: 8, dur: 200 });
    await b.write(`${p}xg${j}`, X(j), y + 85, g, { size: 32, color: 'blue', dur: 250 });
  }
  if (ptX) await b.write(`${p}xgpt`, ptX, y + 85, '.', { size: 32, color: 'blue' });
  const whole = G.slice(0, intLen).join(''), frac = G.slice(intLen).join('');
  const trimmed = (whole.replace(/^0+(?=.)/, '') + (frac ? '.' + frac : '')).replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
  return { spaced: G.slice(0, intLen).join(' ') + (frac ? ' . ' + G.slice(intLen).join(' ') : ''), trimmed };
}

function quizBoard(n, question, o = { size: 54 }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از 6`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 150, question, o);
  };
}
async function solveGroup(b, bin, n) {
  const base = n === 3 ? 8 : 16;
  const ans = await fullGrouping(b, 's-', bin, n, centerPx(bin, n), 270);
  await b.write('s-ans', 500, 440, `(${bin})_2 = (${ans})_${base}`, { size: 44, color: 'green', bold: true });
}
async function solveExpand(b, num, n) {
  const base = n === 3 ? 8 : 16;
  const r = await expandDigits(b, 's-', num, n, 500, 250, n === 3 ? 110 : 130);
  await b.write('s-ans', 500, 445, `(${num})_${base} = (${r.trimmed})_2`, { size: 44, color: 'green', bold: true });
  await b.write('s-n', 500, 505, 'صفرهای اول عدد را می‌شود انداخت', { size: 22, color: 'soft', fa: true });
}

const EX1 = '10110001101011.111100000110';
const P1 = grouping(EX1, 3, 546);
const EX2 = '10110001101011.11110010';
const P2 = grouping(EX2, 4, 614);
const Y = 240; // row of the bits in the worked examples

        await b.write('s1n', 500, 200, `هر رقم ← ${LTR('3')} بیت`, { size: 22, color: 'soft', fa: true });
        const bin = '10110001101011', Q = grouping(bin, 4, centerPx(bin, 4));
        await drawRaw(b, 'v', Q, 280);
        await groupSide(b, 'v', Q, 'w', 280);
        await groupDigits(b, 'v', Q, 'w', 345);
        await b.write('ans', 500, 440, '= (2C6B)_16 = (11371)_10', { size: 44, color: 'green', bold: true });
      },
    },
    // ---------------------------------------------------------- 18. summary
    {
      say: 'جمع‌بندی: این چهار نکته را به خاطر بسپار، بعد سراغ سؤال‌ها.',
      draw: async b => {
        await b.clear();
        await b.write('h', 500, 80, 'یادت باشد', { size: 48, color: 'orange', bold: true, fa: true });
        const L = [
          `octal: گروه ${LTR('3')}بیتی؛ hex: گروه ${LTR('4')}بیتی`,
          'گروه‌بندی از ممیز: صحیح به چپ، اعشار به راست',
          'صفر اضافه فقط در دورترین سمت از ممیز',
          'برگشت: هر رقم جدا به 3 یا 4 بیت؛ صفرهای وسط بمانند',
        ];
        for (const [k, l] of L.entries()) await b.write(`m${k}`, 900, 170 + k * 80, '•  ' + l, { size: 28, anchor: 'start', fa: true });
      },
    },
    // ---------------------------------------------------------- quizzes
    {
      say: 'نوبت شماست! (1011101)_2 را به octal تبدیل کنید.',
      draw: quizBoard(1, '(1011101)_2 = ( ? )_8'),
      quiz: { answer: ['135'], hint: 'از سمت راست سه‌تا سه‌تا جدا کن؛ گروه آخر صفر می‌خواهد.', explain: '001 011 101 → 1، 3، 5؛ پس 135.' },
      solve: b => solveGroup(b, '1011101', 3),
    },
    {
      say: 'حالا hex: (110101.11)_2 را به مبنای 16 ببرید.',
      draw: quizBoard(2, '(110101.11)_2 = ( ? )_16'),
      quiz: { answer: ['35.C'], hint: 'چهارتا چهارتا از ممیز؛ اعشار .11 می‌شود .1100.', explain: '0011 0101 . 1100 → 3، 5، C؛ پس 35.C.' },
      solve: b => solveGroup(b, '110101.11', 4),
    },
    {
      say: 'برعکس: (47)_8 را به binary ببرید.',
      draw: quizBoard(3, '(47)_8 = ( ? )_2'),
      quiz: { answer: ['100111'], hint: 'هر رقم octal را به 3 بیت تبدیل کن.', explain: '4 = 100 و 7 = 111؛ پس 100111.' },
      solve: b => solveExpand(b, '47', 3),
    },
    {
      say: '(A9)_16 را به binary ببرید.',
      draw: quizBoard(4, '(A9)_16 = ( ? )_2'),
      quiz: { answer: ['10101001'], hint: 'A = 10 = 1010. هر رقم hex چهار بیت است.', explain: 'A = 1010 و 9 = 1001؛ پس 10101001.' },
      solve: b => solveExpand(b, 'A9', 4),
    },
    {
      say: 'سؤال تله‌ای! (11.1)_2 در octal کدام است؟',
      draw: quizBoard(5, '(11.1)_2 = ( ? )_8'),
      quiz: {
        choices: ['(3.1)_8', '(3.4)_8', '(11.1)_8'], correct: 1,
        hint: 'صفر اعشار سمت راست اضافه می‌شود.',
        explain: 'قسمت صحیح 011 = 3، اعشار .1 → .100 = 4؛ پس 3.4. (3.1 یعنی صفرها را سمت اشتباه گذاشته‌ای.)',
      },
      solve: b => solveGroup(b, '11.1', 3),
    },
    {
      say: 'سؤال آخر، با پل binary: (57)_8 را به hex ببرید.',
      draw: quizBoard(6, '(57)_8 = ( ? )_16'),
      quiz: { answer: ['2F'], hint: 'اول به binary باز کن، بعد چهارتا چهارتا گروه کن.', explain: '57 → 101 111 = 101111 → 0010 1111 → 2F.' },
      solve: async b => {
        await expandDigits(b, 's-', '57', 3, 330, 230, 110);
        const Q = grouping('101111', 4, centerPx('101111', 4, 330));
        await drawRaw(b, 's-v', Q, 410);
        await groupSide(b, 's-v', Q, 'w', 410);
        await groupDigits(b, 's-v', Q, 'w', 470);
        await b.write('s-ans', 760, 330, '(57)_8 = (2F)_16', { size: 42, color: 'green', bold: true });
      },
    },
  ],
});

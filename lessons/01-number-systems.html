const fmt = n => String(+n.toFixed(6));
const all = list => Promise.all(list);

// Lays out the digits of a number like "1010.11" around centre x.
function layout(num, cx, gap) {
  const chars = [...num];
  const p = chars.indexOf('.');
  const ds = chars.filter(c => c !== '.');
  const intLen = p < 0 ? ds.length : p;
  const width = (ds.length - 1) * gap + (intLen < ds.length ? gap * 0.4 : 0);
  const x0 = cx - width / 2;
  const digits = ds.map((ch, j) => ({ ch, val: parseInt(ch, 16), pos: intLen - 1 - j, x: x0 + j * gap + (j >= intLen ? gap * 0.4 : 0) }));
  return { digits, pointX: intLen < ds.length ? x0 + (intLen - 0.3) * gap : null, left: x0, right: x0 + width };
}

// Quiz solution: digits → place values → products → total.
async function expand(b, num, base, y = 245) {
  const L = layout(num, 500, 120);
  await all(L.digits.map((d, k) => b.write(`sv-d${k}`, d.x, y, d.ch, { size: 64 })));
  if (L.pointX) await b.write('sv-pt', L.pointX, y, '.', { size: 64 });
  await b.write('sv-base', L.right + 60, y + 18, String(base), { size: 30, color: 'blue' });
  for (const [k, d] of L.digits.entries()) {
    const pv = base ** d.pos;
    await b.pulse(`sv-d${k}`, 400);
    await all([
      b.write(`sv-pv${k}`, d.x, y + 60, `${base}^{${d.pos}}=${fmt(pv)}`, { size: 22, color: 'blue', dur: 350 }),
      b.write(`sv-p${k}`, d.x, y + 110, `${d.val}×${fmt(pv)}`, { size: 24, dur: 350 }),
    ]);
    await b.write(`sv-r${k}`, d.x, y + 150, fmt(d.val * pv), { size: 28, color: d.val ? 'green' : 'soft', dur: 300 });
  }
  const total = L.digits.reduce((s, d) => s + d.val * base ** d.pos, 0);
  await b.write('sv-sum', 500, y + 245, `(${num})_${base} = (${fmt(total)})_10`, { size: 44, color: 'green', bold: true });
}

}

        await all(['base 10', 'base 16', 'base 8', 'base 2'].map((h, k) => b.write(`th${k}`, C[k], 58, h, { size: 26, color: 'blue', bold: true })));
        await all([300, 500, 700].map((x, k) => b.line(`tv${k}`, x, 38, x, 548, { color: 'soft', width: 2, dur: 300 })));
        await b.line('th', 110, 74, 890, 74, { color: 'soft', width: 2, dur: 300 });
        for (let r = 0; r < 16; r++) {
          const y = 102 + r * 28.5;
          const row = [String(r).padStart(2, '0'), r.toString(16).toUpperCase(), r.toString(8).padStart(2, '0'), r.toString(2).padStart(4, '0')];
          await all(row.map((v, k) => b.write(`t${r}-${k}`, C[k], y, v, { size: 22, dur: 110 })));
        }
        await b.line('roll10', 160, 102 + 9 * 28.5 + 9, 240, 102 + 9 * 28.5 + 9, { color: 'red' });
        await b.line('roll8', 560, 102 + 7 * 28.5 + 9, 640, 102 + 7 * 28.5 + 9, { color: 'red' });
        await all([b.recolor('t10-0', 'red'), b.recolor('t8-2', 'red')]);
      },
    },
    // ---------------------------------------------------------- 21. summary
    {
      say: "Let's lock it in. Five things to remember for the exam. Read them once more, then try the quiz.",
      draw: async b => {
        await b.clear();
        await b.write('h', 500, 80, 'Remember', { size: 50, color: 'orange', bold: true });
        const L = [
          '1. value = digit × base^{position},  then add',
          '2. positions: 0, 1, 2 … to the left;  -1, -2 … after the point',
          '3. binary: just add the place values under each 1',
          '4. hex: A=10  B=11  C=12  D=13  E=14  F=15',
          '5. every digit must be smaller than the base',
        ];
        for (const [k, l] of L.entries()) await b.write(`m${k}`, 110, 160 + k * 72, l, { size: 30, anchor: 'start' });
      },
    },
    // ---------------------------------------------------------- quizzes
    {
      say: "Your turn! Convert (1101)_2 to decimal. Type your answer and press Check.",
      speak: "Your turn! Convert one one zero one, in binary, to decimal. Type your answer and press Check.",
      draw: quizBoard(1, '(1101)_2 = ( ? )_10'),
      quiz: { answer: ['13'], hint: 'place values are 8, 4, 2, 1 — add the ones under each 1.', explain: '8 + 4 + 1 = 13.', explainSpeak: 'eight plus four plus one is thirteen.' },
      solve: b => expand(b, '1101', 2),
    },
    {
      say: "Now a fraction: convert (0.101)_2 to decimal.",
      speak: "Now a fraction. Convert zero point one zero one, in binary, to decimal.",
      draw: quizBoard(2, '(0.101)_2 = ( ? )_10'),
      quiz: { answer: ['0.625', '.625'], hint: 'after the point the places are 0.5, 0.25, 0.125.', explain: '0.5 + 0.125 = 0.625.', explainSpeak: 'zero point five plus zero point one two five is zero point six two five.' },
      solve: b => expand(b, '0.101', 2),
    },
    {
      say: "Hexadecimal: convert (2A)_16 to decimal.",
      speak: "Hexadecimal. Convert two A, in base sixteen, to decimal.",
      draw: quizBoard(3, '(2A)_16 = ( ? )_10'),
      quiz: { answer: ['42'], hint: 'A means 10. The places are 16 and 1.', explain: '2 × 16 + 10 × 1 = 32 + 10 = 42.', explainSpeak: 'two times sixteen, plus ten, is forty two.' },
      solve: b => expand(b, '2A', 16),
    },
    {
      say: "A base you haven't seen yet — same rule. Convert (123)_4 to decimal.",
      speak: "A base you haven't seen yet. Same rule. Convert one two three, in base four, to decimal.",
      draw: quizBoard(4, '(123)_4 = ( ? )_10'),
      quiz: { answer: ['27'], hint: 'powers of 4: 16, 4, 1.', explain: '1 × 16 + 2 × 4 + 3 × 1 = 16 + 8 + 3 = 27.', explainSpeak: 'sixteen plus eight plus three is twenty seven.' },
      solve: b => expand(b, '123', 4),
    },
    {
      say: "Trap question! Which one of these is *not* a valid base-8 number?",
      draw: quizBoard(5, 'Which is NOT a valid octal number?'),
      quiz: {
        choices: ['(1777)_8', '(2058)_8', '(640)_8'], correct: 1,
        explain: 'octal digits are only 0 to 7, so the 8 in 2058 is impossible.',
      },
      solve: async b => {
        await b.write('c0', 250, 280, '(1777)_8  ✓', { size: 40, color: 'green' });
        await b.write('c1', 500, 280, '(2058)_8  ✗', { size: 40, color: 'red' });
        await b.write('c2', 750, 280, '(640)_8  ✓', { size: 40, color: 'green' });
        await b.ring('r8', 495, 268, 20, 30, { color: 'red' });
        await b.write('why', 500, 390, 'base 8 → digits 0 … 7 only', { size: 36, color: 'blue' });
      },
    },
    {
      say: "Last one: convert (17)_8 to decimal. Then check your answer against the table we built.",
      speak: "Last one. Convert one seven, in base eight, to decimal. Then check your answer against the table we built.",
      draw: quizBoard(6, '(17)_8 = ( ? )_10'),
      quiz: { answer: ['15'], hint: 'the places are 8 and 1.', explain: '1 × 8 + 7 × 1 = 15 — just like the table: octal 17 is decimal 15.', explainSpeak: 'eight plus seven is fifteen. Just like the table: octal seventeen is decimal fifteen.' },
      solve: b => expand(b, '17', 8),
    },
  ],
});

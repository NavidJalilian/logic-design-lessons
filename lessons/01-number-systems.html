// Lays out the digits of a number like "1010.11" around centre x.
function layout(num, cx, gap) {
  const chars = [...num];
  const p = chars.indexOf('.');
  const ds = chars.filter(c => c !== '.');
  const intLen = p < 0 ? ds.length : p;
  const width = (ds.length - 1) * gap + (intLen < ds.length ? gap * 0.4 : 0);
  const x0 = cx - width / 2;
  const digits = ds.map((ch, j) => ({ ch, val: parseInt(ch, 16), pos: intLen - 1 - j, x: x0 + j * gap + (j >= intLen ? gap * 0.4 : 0) }));
  return { digits, pointX: intLen < ds.length ? x0 + (intLen - 0.3) * gap : null, left: x0, right: x0 + width };
}

// Quiz solution: digits → place values → products → total.
async function expand(b, num, base, y = 245) {
  const L = layout(num, 500, 120);
  await all(L.digits.map((d, k) => b.write(`sv-d${k}`, d.x, y, d.ch, { size: 64 })));
  if (L.pointX) await b.write('sv-pt', L.pointX, y, '.', { size: 64 });
  await b.write('sv-base', L.right + 60, y + 18, String(base), { size: 30, color: 'blue' });
  for (const [k, d] of L.digits.entries()) {
    const pv = base ** d.pos;
    await b.pulse(`sv-d${k}`, 400);
    await all([
      b.write(`sv-pv${k}`, d.x, y + 60, `${base}^{${d.pos}}=${fmt(pv)}`, { size: 22, color: 'blue', dur: 350 }),
      b.write(`sv-p${k}`, d.x, y + 110, `${d.val}×${fmt(pv)}`, { size: 24, dur: 350 }),
    ]);
    await b.write(`sv-r${k}`, d.x, y + 150, fmt(d.val * pv), { size: 28, color: d.val ? 'green' : 'soft', dur: 300 });
  }
  const total = L.digits.reduce((s, d) => s + d.val * base ** d.pos, 0);
  await b.write('sv-sum', 500, y + 245, `(${num})_${base} = (${fmt(total)})_10`, { size: 44, color: 'green', bold: true });
}

    await b.write('q-q', 500, 150, question, o);
  };
}

      say: 'ضرب کنیم: 11 × 4096 = 45056، 6 × 256 = 1536، 5 × 16 = 80، 15 × 1 = 15. جمع کل: (46687)_10.',
      draw: async b => {
        const T = ['11×4096', '6×256', '5×16', '15×1'], R = ['45056', '1536', '80', '15'];
        for (let k = 0; k < 4; k++) {
          await b.write(`p${k}`, X16[k], 390, T[k], { size: 28 });
          await b.write(`r${k}`, X16[k], 440, R[k], { size: 32, color: 'green' });
          if (k < 3) await b.write(`rp${k}`, X16[k] + 50, 440, '+', { size: 30, color: 'soft', dur: 120 });
        }
        await b.write('ans', 500, 515, '= (46687)_10', { size: 46, color: 'green', bold: true });
      },
    },
    // ---------------------------------------------------------- 20. table
    {
      say: 'این جدول کتاب است: 0 تا 15 در چهار مبنا. به *سرریز* دقت کن: وقتی رقم‌های یک مبنا تمام می‌شود، 10 می‌نویسد و از نو شروع می‌کند. octal بعد از 7 سرریز می‌کند، decimal بعد از 9، binary بعد از هر 1، و hex تازه بعد از F.',
      term: ['Octal (base 8)', 'مبنای 8'],
      draw: async b => {
        await b.clear();
        const C = [200, 400, 600, 800];
        await all(['base 10', 'base 16', 'base 8', 'base 2'].map((h, k) => b.write(`th${k}`, C[k], 58, h, { size: 26, color: 'blue', bold: true })));
        await all([300, 500, 700].map((x, k) => b.line(`tv${k}`, x, 38, x, 548, { color: 'soft', width: 2, dur: 300 })));
        await b.line('th', 110, 74, 890, 74, { color: 'soft', width: 2, dur: 300 });
        for (let r = 0; r < 16; r++) {
          const y = 102 + r * 28.5;
          const row = [String(r).padStart(2, '0'), r.toString(16).toUpperCase(), r.toString(8).padStart(2, '0'), r.toString(2).padStart(4, '0')];
          await all(row.map((v, k) => b.write(`t${r}-${k}`, C[k], y, v, { size: 22, dur: 110 })));
        }
        await b.line('roll10', 160, 102 + 9 * 28.5 + 9, 240, 102 + 9 * 28.5 + 9, { color: 'red' });
        await b.line('roll8', 560, 102 + 7 * 28.5 + 9, 640, 102 + 7 * 28.5 + 9, { color: 'red' });
        await all([b.recolor('t10-0', 'red'), b.recolor('t8-2', 'red')]);
      },
    },
    // ---------------------------------------------------------- 21. summary
    {
      say: 'بیایید جمع‌بندی کنیم: پنج نکته برای امتحان. یک بار دیگر بخوانیدشان، بعد برویم سراغ سؤال‌ها.',
      draw: async b => {
        await b.clear();
        await b.write('h', 500, 80, 'یادت باشد', { size: 48, color: 'orange', bold: true, fa: true });
        const L = [
          'هر رقم × مبنا به توان مکانش، بعد همه را جمع کن',
          `مکان‌ها: به چپ ${LTR('0, 1, 2 …')}   بعد از ممیز ${LTR('-1, -2 …')}`,
          'در binary فقط ارزش مکانیِ زیر هر 1 را جمع کن',
          `در hex:  ${LTR('A=10  B=11  C=12  D=13  E=14  F=15')}`,
          'هر رقم باید از مبنا کوچک‌تر باشد',
        ];
        for (const [k, l] of L.entries()) await b.write(`m${k}`, 880, 160 + k * 72, '•  ' + l, { size: 27, anchor: 'start', fa: true });
      },
    },
    // ---------------------------------------------------------- quizzes
    {
      say: 'نوبت شماست! (1101)_2 را به decimal تبدیل کنید. جواب را بنویسید و «بررسی» را بزنید.',
      draw: quizBoard(1, '(1101)_2 = ( ? )_10'),
      quiz: { answer: ['13'], hint: 'ارزش‌های مکانی 8، 4، 2، 1 هستند — زیر هر 1 را جمع کن.', explain: '8 + 4 + 1 = 13' },
      solve: b => expand(b, '1101', 2),
    },
    {
      say: 'حالا یک عدد اعشاری: (0.101)_2 را به decimal تبدیل کنید.',
      draw: quizBoard(2, '(0.101)_2 = ( ? )_10'),
      quiz: { answer: ['0.625'], hint: 'بعد از ممیز ارزش‌ها 0.5، 0.25 و 0.125 هستند.', explain: '0.5 + 0.125 = 0.625' },
      solve: b => expand(b, '0.101', 2),
    },
    {
      say: 'مبنای 16: (2A)_16 را به decimal تبدیل کنید.',
      draw: quizBoard(3, '(2A)_16 = ( ? )_10'),
      quiz: { answer: ['42'], hint: 'A یعنی 10. ارزش‌های مکانی 16 و 1 هستند.', explain: '2 × 16 + 10 × 1 = 32 + 10 = 42' },
      solve: b => expand(b, '2A', 16),
    },
    {
      say: 'یک مبنای تازه، همان قانون: (123)_4 را به decimal تبدیل کنید.',
      draw: quizBoard(4, '(123)_4 = ( ? )_10'),
      quiz: { answer: ['27'], hint: 'توان‌های 4: یعنی 16، 4، 1.', explain: '1 × 16 + 2 × 4 + 3 × 1 = 16 + 8 + 3 = 27' },
      solve: b => expand(b, '123', 4),
    },
    {
      say: 'سؤال تله‌ای! کدام‌یک از این‌ها عدد معتبر مبنای 8 *نیست*؟',
      draw: quizBoard(5, 'کدام عدد در مبنای 8 معتبر نیست؟', { size: 44, fa: true }),
      quiz: {
        choices: ['(1777)_8', '(2058)_8', '(640)_8'], correct: 1,
        explain: 'در مبنای 8 فقط رقم‌های 0 تا 7 داریم، پس رقم 8 در 2058 غیرممکن است.',
      },
      solve: async b => {
        await b.write('c0', 250, 280, '(1777)_8  ✓', { size: 40, color: 'green' });
        await b.write('c1', 500, 280, '(2058)_8  ✗', { size: 40, color: 'red' });
        await b.write('c2', 750, 280, '(640)_8  ✓', { size: 40, color: 'green' });
        await b.ring('r8', 495, 268, 20, 30, { color: 'red' });
        await b.write('why', 500, 390, 'در مبنای 8 فقط رقم‌های 0 تا 7 داریم', { size: 32, color: 'blue', fa: true });
      },
    },
    {
      say: 'سؤال آخر: (17)_8 را به decimal تبدیل کنید، بعد جوابتان را با جدول مقایسه کنید.',
      draw: quizBoard(6, '(17)_8 = ( ? )_10'),
      quiz: { answer: ['15'], hint: 'ارزش‌های مکانی 8 و 1 هستند.', explain: '1 × 8 + 7 × 1 = 15 — درست مثل جدول: 17 در octal همان 15 در decimal است.' },
      solve: b => expand(b, '17', 8),
    },
  ],
});
</script>

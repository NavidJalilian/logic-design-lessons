// Lesson 9 — book slide 14 (Chapter 2: Boolean algebra — definition, postulates, duality).
// Explanations are Persian; math and technical terms stay in English.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run (math) intact inside Persian board text
const N = a => 1 - a;
// All input rows for n variables, counting up in binary: [[0,0,0], [0,0,1], ...]
const ROWS = n => Array.from({ length: 2 ** n }, (_, i) => Array.from({ length: n }, (_, k) => (i >> (n - 1 - k)) & 1));

// One truth-table column: header at (x, y0), then one value per row, rh apart.
async function col(b, id, x, y0, rh, head, vals, o = {}) {
  await b.write(`${id}-h`, x, y0, head, { size: o.hs || 26, color: o.hc || 'blue', bold: true, dur: 250 });
  for (const [r, v] of vals.entries()) {
    await b.write(`${id}-${r}`, x, y0 + rh * (r + 1), String(v), { size: o.size || 28, color: o.color || 'ink', dur: o.dur ?? 80 });
  }
}
// A whole table: cols = [{ h, v: [...] , color }], X = column centres.
async function table(b, p, X, y0, rh, cols, o = {}) {
  for (const [k, c] of cols.entries()) await col(b, `${p}${k}`, X[k], y0, rh, c.h, c.v, { ...o, color: c.color });
  await b.line(`${p}-hl`, X[0] - 40, y0 + 14, X[X.length - 1] + (o.lastW || 50), y0 + 14, { color: 'soft', width: 2, dur: 250 });
}
// Ring a column of a table that has n rows.
function ringCol(b, id, x, y0, rh, n, w = 40, color = 'orange') {
  const top = y0 - 30, bot = y0 + rh * n + 14;
  return b.ring(id, x, (top + bot) / 2, w, (bot - top) / 2, { color, tilt: 0 });
}
// Writes an expression token by token (tokens split on spaces) so single symbols can be recoloured.
// colors: { index: color }. Returns the x of each token.
async function seq(b, id, cx, y, str, o = {}) {
  const t = str.split(' '), size = o.size || 40, gap = o.gap || size * 0.72;
  const x0 = cx - ((t.length - 1) * gap) / 2;
  await all(t.map((s, k) => b.write(`${id}-${k}`, x0 + k * gap, y, s, { size, color: (o.colors || {})[k] || o.color || 'ink', bold: !!(o.colors || {})[k], dur: 300 })));
  return t.map((_, k) => x0 + k * gap);
}

// A postulate card: Persian title, then rule (a) and rule (b) on two lines (tokens split on spaces).
async function rule(b, title, a, bb) {
  await b.clear();
  await b.write('rt', 500, 72, title, { size: 36, color: 'orange', bold: true, fa: true });
  await b.write('ral', 130, 150, '(a)', { size: 26, color: 'purple' });
  await seq(b, 'ra', 500, 150, a, { size: 42, gap: 30 });
  await b.write('rbl', 130, 215, '(b)', { size: 26, color: 'purple' });
  await seq(b, 'rb', 500, 215, bb, { size: 42, gap: 30 });
}

function quizBoard(n, question, o = { size: 50 }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از 5`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 150, question, o);
  };
}

const R1 = ROWS(1), R2 = ROWS(2), R3 = ROWS(3);
const TY = 300, TH = 46;                       // small check tables: header y and row height
const X8 = [90, 150, 210, 300, 420, 560, 680, 840]; // the 3-variable distributive table

Teacher.start({

    },

    {

      },
    },

      say: 'اصل 2: *complement* یا عضو مکمل. برای هر x یک x′ هست که x + x′ = 1 و x · x′ = 0. چرا؟ چون x و x′ همیشه برعکس هم‌اند: یکی‌شان حتماً 1 است، پس OR آن‌ها 1 می‌شود؛ و هیچ‌وقت هر دو 1 نیستند، پس AND آن‌ها 0 می‌شود.',

        await b.ring('cmr2', 560, 368, 50, 50, { color: 'green', tilt: 0 });
        await b.ring('cmr3', 700, 368, 50, 50, { color: 'green', tilt: 0 });
        await b.write('c2', 560, 460, 'همیشه 1', { size: 24, color: 'green', fa: true });

          { h: 'x + y', v: R2.map(([x, y]) => x | y), color: 'green' }, { h: 'y + x', v: R2.map(([x, y]) => y | x), color: 'green' },

        ]);
        await all([ringCol(b, 'cor1', 460, 285, 46, 4, 110, 'green'), ringCol(b, 'cor2', 720, 285, 46, 4, 110, 'blue')]);
      },
    },
    // ---------------------------------------------------------- 10. distributive (a)
    {
      say: 'اصل 4: *distributive* یا توزیع‌پذیری. قسمت (a) آشناست: x · (y + z) = x·y + x·z؛ همان «پخش کردن» ضرب روی جمع که از دبیرستان بلدیم.',
      term: ['Distributive', 'توزیع‌پذیری'],
      draw: async b => {
        await rule(b, 'اصل 4 — توزیع‌پذیری (distributive)', 'x · ( y + z ) = x · y + x · z', 'x + ( y · z ) = ( x + y ) · ( x + z )');
        await b.dim(['rb-*', 'rbl'], 0.15);
        await b.ring('rar', 500, 142, 250, 36);
      },
    },
    // ---------------------------------------------------------- 11. distributive (b)
    {
      say: 'ولی قسمت (b) عجیب است: x + y·z = (x + y)·(x + z). یعنی + را هم می‌شود روی · پخش کرد! در حساب معمولی این غلط است: 1 + 2×3 = 7 ولی (1+2)×(1+3) = 12. در جبر بول اما درست است؛ بیایید ببینیم چرا.',

        await b.dim(['rb-*', 'rbl'], 1);
        await b.dim(['ra-*', 'ral', 'rar'], 0.2);
        await b.ring('rbr', 500, 205, 330, 40, { color: 'orange' });
        await b.write('ar', 500, 320, '1 + 2×3 = 7        (1+2)×(1+3) = 12', { size: 34, color: 'red' });

    // ---------------------------------------------------------- 12. distributive (b) table
    {

      draw: async b => {
        await b.clear();
        await b.write('ha', 330, 70, '(a)', { size: 34, color: 'purple', bold: true });

// Lesson 6 — book slides 9–10 (Chapter 1): subtraction M − N with r's and (r−1)'s complements.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run intact inside Persian board text

function rComp(N, r) { const n = N.length; return ((r ** n - parseInt(N, r)) % r ** n).toString(r).toUpperCase().padStart(n, '0'); }
function r1Comp(N, r) { return [...N].map(d => (r - 1 - parseInt(d, r)).toString(r).toUpperCase()).join(''); }

// M − N in base r with the r's complement (kind 'r') or the (r−1)'s complement (kind 'r1').
function compSub(M, N, r, kind) {
  const n = Math.max(M.length, N.length);
  M = M.padStart(n, '0'); N = N.padStart(n, '0');
  const comp = kind === 'r' ? rComp(N, r) : r1Comp(N, r);
  const sum = (parseInt(M, r) + parseInt(comp, r)).toString(r).toUpperCase().padStart(n, '0');
  const carry = sum.length > n;
  let res;
  if (carry) {
    const dropped = sum.slice(1);
    res = kind === 'r' ? dropped : (parseInt(dropped, r) + 1).toString(r).toUpperCase().padStart(n, '0');
  } else res = kind === 'r' ? rComp(sum, r) : r1Comp(sum, r);
  return { n, M, N, comp, sum, carry, res, final: (carry ? '' : '−') + res };
}

async function colNum(b, p, str, xr, y, o = {}) {
  const cw = o.cw ?? 32, L = str.length;
  for (let i = 0; i < L; i++) await b.write(`${p}${i}`, xr - (L - 1 - i) * cw, y, str[i], { size: o.size ?? 44, color: o.color ?? 'ink', bold: o.bold, dur: o.dur ?? 70 });
}
// Column addition top + bottom = sum; an extra left digit (end carry) is drawn red.
async function colAdd(b, p, top, bottom, sum, xr, y0, o = {}) {
  const cw = o.cw ?? 32, size = o.size ?? 44, L = Math.max(top.length, bottom.length, sum.length);
  await colNum(b, `${p}t`, top, xr, y0, { cw, size });
  await colNum(b, `${p}b`, bottom, xr, y0 + 70, { cw, size, color: 'blue' });
  await b.write(`${p}m`, xr - L * cw - 10, y0 + 70, '+', { size });
  await b.line(`${p}l`, xr - L * cw - 35, y0 + 92, xr + 22, y0 + 92, { color: 'soft' });
  await colNum(b, `${p}r`, sum, xr, y0 + 150, { cw, size, color: 'green', bold: true, dur: 110 });
  if (sum.length > Math.max(top.length, bottom.length)) await b.recolor(`${p}r0`, 'red');
}

function quizBoard(n, question, o = { size: 46 }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از 6`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 140, question, o);
  };
}
// Quiz solution: complement line, column addition, then the final step on the right.
async function solveSub(b, M, N, r, kind, name) {
  const S = compSub(M, N, r, kind);
  await b.write('s-c', 500, 200, `${name} of ${S.N} = ${S.comp}`, { size: 30, color: 'blue' });
  await colAdd(b, 's-', S.M, S.comp, S.sum, 400, 270, { size: 40, cw: 30 });
  let last;
  if (S.carry && kind === 'r') last = `drop carry → ${S.res}`;
  else if (S.carry) last = `${S.sum.slice(1)} + 1 = ${S.res}`;
  else last = `−(${name} of ${S.sum}) = −${S.res}`;
  await b.write('s-st', 740, 350, S.carry ? 'carry ✓' : 'no carry', { size: 30, color: S.carry ? 'red' : 'orange' });
  await b.write('s-ans', 500, 525, last, { size: 38, color: 'green', bold: true });
}

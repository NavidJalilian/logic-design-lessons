// Lesson 10 — book slides 15–19 (Chapter 2: theorems of Boolean algebra and how to prove them).
// Explanations are Persian; math and technical terms stay in English.
// Note: the handwritten proof of x·0 = 0 on slide 16 is wrong (it ends "= 1"); a correct proof is taught.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run (math) intact inside Persian board text
const N = a => 1 - a;
const ROWS = n => Array.from({ length: 2 ** n }, (_, i) => Array.from({ length: n }, (_, k) => (i >> (n - 1 - k)) & 1));
const R1 = ROWS(1), R2 = ROWS(2), R3 = ROWS(3);

// One truth-table column: header at (x, y0), then one value per row, rh apart.
async function col(b, id, x, y0, rh, head, vals, o = {}) {
  await b.write(`${id}-h`, x, y0, head, { size: o.hs || 26, color: o.hc || 'blue', bold: true, dur: 250 });
  for (const [r, v] of vals.entries()) {
    await b.write(`${id}-${r}`, x, y0 + rh * (r + 1), String(v), { size: o.size || 28, color: o.color || 'ink', dur: o.dur ?? 80 });
  }
}
async function table(b, p, X, y0, rh, cols, o = {}) {
  for (const [k, c] of cols.entries()) await col(b, `${p}${k}`, X[k], y0, rh, c.h, c.v, { ...o, color: c.color });
  await b.line(`${p}-hl`, X[0] - 40, y0 + 14, X[X.length - 1] + (o.lastW || 60), y0 + 14, { color: 'soft', width: 2, dur: 250 });
}
function ringCol(b, id, x, y0, rh, n, w = 40, color = 'orange') {
  const top = y0 - 30, bot = y0 + rh * n + 14;
  return b.ring(id, x, (top + bot) / 2, w, (bot - top) / 2, { color, tilt: 0 });
}
// Writes an expression token by token (tokens split on spaces) so single symbols can be addressed.
async function seq(b, id, cx, y, str, o = {}) {
  const t = str.split(' '), size = o.size || 40, gap = o.gap || size * 0.72;
  const x0 = cx - ((t.length - 1) * gap) / 2;
  await all(t.map((s, k) => b.write(`${id}-${k}`, x0 + k * gap, y, s, { size, color: (o.colors || {})[k] || o.color || 'ink', bold: !!(o.colors || {})[k], dur: 300 })));
  return t.map((_, k) => x0 + k * gap);
}

// Proof layout: claim on top, then numbered lines; each line = math on the left, the rule used on the right.
const PY = k => 150 + k * 62;
async function claim(b, fa, math) {
  await b.clear();
  await b.write('cl', 940, 80, fa, { size: 32, color: 'orange', bold: true, fa: true, anchor: 'start' });
  await b.write('cm', 110, 80, math, { size: 38, color: 'orange', bold: true, anchor: 'start' });
}
async function pline(b, id, k, math, why, o = {}) {
  await b.write(id, k ? 190 : 110, PY(k), math, { size: 34, anchor: 'start', color: o.color });
  if (why) await b.write(id + 'w', 940, PY(k), why, { size: 22, color: o.whyColor || 'purple', anchor: 'start', fa: true });
}
const P = {
  p1a: `اصل 1: ${LTR('x + 0 = x')}`,
  p1b: `اصل 1: ${LTR('x · 1 = x')}`,
  p2a: `اصل 2: ${LTR("x + x' = 1")}`,
  p2b: `اصل 2: ${LTR("x · x' = 0")}`,
  p4a: `اصل 4: ${LTR('x(y + z) = xy + xz')}`,
  p4b: `اصل 4: ${LTR('x + yz = (x + y)(x + z)')}`,
};

function quizBoard(n, question, o = { size: 50 }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از 5`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 150, question, o);
  };
}

const XA = [100, 160, 220, 330, 470, 620, 770];      // associative table
const XD = [110, 180, 290, 420, 550, 630, 760];      // DeMorgan table

Teacher.start({

    // ---------------------------------------------------------- 1. intro + postulate card

      term: ['Theorem', 'قضیه'],
      draw: async b => {

        await b.box('bx', 120, 110, 760, 330, { color: 'blue', fill: 'blue' });
        const L = [
          ['1', 'x + 0 = x', 'x · 1 = x', 'خنثی'],
          ['2', "x + x' = 1", "x · x' = 0", 'مکمل'],
          ['3', 'x + y = y + x', 'xy = yx', 'جابه‌جایی'],
          ['4', 'x(y + z) = xy + xz', 'x + yz = (x + y)(x + z)', 'توزیع'],

        for (const [k, [n, a, c, fa]] of L.entries()) {

            b.write(`b${k}`, 620, y, c, { size: 30 }),
            b.write(`f${k}`, 860, y, fa, { size: 22, color: 'soft', fa: true, anchor: 'start' }),

    {

        await b.write('bb', 680, 170, '(b)   x · x = x', { size: 44 });

      },
    },
    // ---------------------------------------------------------- 3. proof 1a line 1
    {

      draw: async b => {
        await pline(b, 'l1', 1, "= (x + x)(x + x')", P.p2a);
        await b.pulse(['l1', 'l1w']);
      },
    },
    // ---------------------------------------------------------- 5. line 3
    {
      say: 'حالا شکل (x + y)(x + z) را می‌بینیم که در آن y = x و z = x′ است. اصل 4 (b) را برعکس می‌خوانیم: (x + y)(x + z) = x + yz. پس می‌شود x + x·x′.',
      draw: async b => {
        await pline(b, 'l2', 2, "= x + x · x'", P.p4b);
      },
    },
    // ---------------------------------------------------------- 6. lines 4-5
    {
      say: 'طبق اصل 2، x · x′ = 0، پس می‌ماند x + 0. و طبق اصل 1، x + 0 = x. ثابت شد: x + x = x. دقت کنید که هر قدم فقط از یک اصل استفاده کرد.',
      draw: async b => {
        await pline(b, 'l3', 3, '= x + 0', P.p2b);
        await pline(b, 'l4', 4, '= x', P.p1a, { color: 'green' });

      },

    // ---------------------------------------------------------- 7. theorem 1b by duality
    {
      say: 'برای (b) لازم نیست از صفر فکر کنیم. هر قدم اثبات (a) از یک اصل استفاده کرد؛ dual هر اصل هم خودش یک اصل است. پس اگر *کل اثبات* را dual کنیم، یک اثبات درست برای x · x = x داریم. به این *principle of duality* یا اصل دوگانی می‌گویند.',

      draw: async b => {
        await claim(b, 'قضیه‌ی 1 (b) — از dual', 'x · x = x');
        await pline(b, 'm0', 0, 'x · x = x · x + 0', P.p1a);
        await pline(b, 'm1', 1, "= x · x + x · x'", P.p2b);
        await pline(b, 'm2', 2, "= x · (x + x')", P.p4a);
        await pline(b, 'm3', 3, '= x · 1', P.p2a);
        await pline(b, 'm4', 4, '= x', P.p1b, { color: 'green' });
        await b.write('n', 500, 500, `هر قدم = dual همان قدم در (a):  ${LTR('+ ↔ ·  ,  0 ↔ 1')}`, { size: 26, color: 'blue', fa: true });
      },
    },

    {

        await claim(b, 'قضیه‌ی 2 (a)', 'x + 1 = 1');
        await pline(b, 'l0', 0, 'x + 1 = 1 · (x + 1)', P.p1b);
        await pline(b, 'l1', 1, "= (x + x')(x + 1)", P.p2a);
        await pline(b, 'l2', 2, "= x + x' · 1", P.p4b);
      },
    },

    {

        await b.write('ok', 500, 500, '✓ ثابت شد', { size: 34, color: 'green', bold: true, fa: true });

    },

      say: 'حالا (b): x · 0 = 0. *در جزوه اینجا اشتباه نوشته شده.* اثباتِ جزوه تقریباً کپیِ اثبات (a) است: از x · 0 شروع نمی‌کند، قدم اولش (x + x)(x + 1) با قدم بعد برابر نیست، و آخرش به 1 می‌رسد، در حالی که ادعا 0 بود! این اثبات را کنار بگذارید.',
      draw: async b => {
        await claim(b, 'اثبات جزوه برای (b) — غلط', 'x · 0 = 0');
        const W = ['= (x + x)(x + 1)', "= x + (x' · 1)", "= x + x'", '= 1'];
        for (const [k, w] of W.entries()) await b.write(`w${k}`, 190, PY(k), w, { size: 34, anchor: 'start', color: 'soft' });

        await b.line('x2', 170, PY(3) + 10, 470, PY(0) - 40, { color: 'red', width: 5 });

        await b.write('e2', 940, PY(1), 'قدم اول با قدم دوم برابر نیست', { size: 24, color: 'red', fa: true, anchor: 'start' });

      },
    },
    // ---------------------------------------------------------- 11. correct proof of 2b
    {
      say: 'اثبات درست، dual اثبات (a) است. x · 0 را با 0 جمع می‌کنیم (اصل 1)، آن 0 را x · x′ می‌نویسیم (اصل 2)، x را فاکتور می‌گیریم (اصل 4 (a))، x′ + 0 = x′ (اصل 1) و در آخر x · x′ = 0 (اصل 2). نتیجه واقعاً 0 شد.',
      draw: async b => {
        await claim(b, 'قضیه‌ی 2 (b) — اثبات درست', 'x · 0 = 0');
        await pline(b, 'l0', 0, 'x · 0 = 0 + x · 0', P.p1a);
        await pline(b, 'l1', 1, "= x · x' + x · 0", P.p2b);
        await pline(b, 'l2', 2, "= x · (x' + 0)", P.p4a);
        await pline(b, 'l3', 3, "= x · x'", P.p1a);
        await pline(b, 'l4', 4, '= 0', P.p2b, { color: 'green' });
        await b.write('ok', 500, 500, '✓ این بار درست به 0 رسیدیم', { size: 32, color: 'green', bold: true, fa: true });
      },
    },
    // ---------------------------------------------------------- 12. theorem 3
    {
      say: 'قضیه‌ی 3: (x′)′ = x؛ دو بار NOT یعنی برگشت به خود x. اثبات با یک استدلال: طبق اصل 2، x + x′ = 1 و x · x′ = 0؛ یعنی x′ مکمل x است. با جابه‌جایی همین دو رابطه می‌گویند x هم مکمل x′ است. از طرفی (x′)′ هم طبق تعریف مکمل x′ است. چون مکمل هر عضو *منحصربه‌فرد* است، پس (x′)′ = x.',
      term: ['Involution (Theorem 3)', 'قضیه‌ی 3'],
      draw: async b => {
        await claim(b, 'قضیه‌ی 3', "(x')' = x");
        await b.write('a1', 110, 165, "x + x' = 1 ,   x · x' = 0", { size: 32, anchor: 'start' });

        await b.write('a2', 110, 245, "x' + x = 1 ,   x' · x = 0", { size: 32, anchor: 'start' });
        await b.write('a2w', 940, 245, `پس x هم مکمل ${LTR("x'")} است`, { size: 24, color: 'purple', fa: true, anchor: 'start' });
        await b.write('a3', 110, 325, "(x')'", { size: 32, anchor: 'start' });

        await b.box('bx', 200, 380, 600, 70, { color: 'green', fill: 'green' });
        await b.write('a4', 500, 425, `مکمل منحصربه‌فرد است  ←  ${LTR("(x')' = x")}`, { size: 30, color: 'green', bold: true, fa: true });
      },
    },
    // ---------------------------------------------------------- 13. theorem 4a
    {
      say: 'قضیه‌ی 4، *absorption* یا جذب: x + xy = x. انگار x جمله‌ی xy را «می‌بلعد». اثبات: x را x · 1 می‌نویسیم، x را فاکتور می‌گیریم: x(1 + y). طبق قضیه‌ی 2، 1 + y = 1، پس x · 1 = x.',
      term: ['Absorption (Theorem 4)', 'جذب'],
      draw: async b => {
        await claim(b, 'قضیه‌ی 4 (a) — جذب', 'x + xy = x');
        await pline(b, 'l0', 0, 'x + xy = x · 1 + x · y', P.p1b);
        await pline(b, 'l1', 1, '= x · (1 + y)', P.p4a);
        await pline(b, 'l2', 2, '= x · 1', `قضیه‌ی 2: ${LTR('1 + y = 1')}`, { whyColor: 'blue' });
        await pline(b, 'l3', 3, '= x', P.p1b, { color: 'green' });
      },
    },
    // ---------------------------------------------------------- 14. theorem 4b
    {
      say: 'قسمت (b)، یعنی x(x + y) = x، طبق دوگانی خودبه‌خود درست است: dual رابطه‌ی x + xy = x همین است. اگر بخواهید مستقیم هم می‌شود: پخش کن، x · x + x · y؛ طبق قضیه‌ی 1 این x + xy است و طبق (a) برابر x.',
      draw: async b => {
        await claim(b, 'قضیه‌ی 4 (b)', 'x(x + y) = x');
        await b.write('d', 500, 170, 'dual of  x + xy = x   →   x(x + y) = x   ✓', { size: 32, color: 'blue' });
        await b.write('or', 500, 240, 'یا مستقیم:', { size: 26, color: 'soft', fa: true });

        await pline(b, 'l2', 4, '= x', 'قضیه‌ی 4 (a)', { color: 'green', whyColor: 'blue' });

    // ---------------------------------------------------------- 15. proof by truth table
    {
      say: 'راه دوم اثبات: *truth table* یا جدول صحت. چون هر متغیر فقط 0 یا 1 است، می‌توانیم *همه‌ی* حالت‌ها را امتحان کنیم. مثال کتاب: x + xy = x. ستون x و ستون x + xy را مقایسه کنید: 0، 0، 1، 1 و 0، 0، 1، 1. یکی‌اند، پس رابطه درست است.',
      term: ['Truth table', 'جدول صحت (جدول درستی)'],

        await table(b, 't', X, 170, 56, [

    // ---------------------------------------------------------- 16. associative statement
    {
      say: 'قانون *associative* یا شرکت‌پذیری: x + (y + z) = (x + y) + z و x(yz) = (xy)z. یعنی وقتی چند OR یا چند AND پشت هم داریم، ترتیب گروه‌بندی مهم نیست. کتاب می‌گوید اثبات جبری‌اش *طولانی* است، پس با جدول ثابتش می‌کنیم.',

        await b.clear();

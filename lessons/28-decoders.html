// Lesson 28 — book slides 63–68 (Chapter 5: decoders).
// Explanations are Persian; numbers, math and technical terms stay as written in English.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run (numbers, math) intact inside Persian board text
const on = (v, c = 'orange') => (v ? c : 'ink');

// minterm i of the variables vs, e.g. mt(5, 'xyz') = "xy'z"
const mt = (i, vs) => [...vs].map((v, j) => v + (((i >> (vs.length - 1 - j)) & 1) ? '' : "'")).join('');
const bits = (i, n) => i.toString(2).padStart(n, '0');

// ---------------------------------------------------------------- 3-to-8 decoder gate circuit
const DV = ['x', 'y', 'z'];
const ROWY = [52, 87, 122];
const RT = [410, 260, 110], RC = [520, 370, 220], NOTX = [430, 280, 130];
const GX = 620, GY = i => 165 + 50 * i;
const bit3 = (i, j) => (i >> (2 - j)) & 1;
const pinY = (i, j) => GY(i) + (j - 1) * 16;
const railEnd = (j, val) => Math.max(...[0, 1, 2, 3, 4, 5, 6, 7].filter(i => bit3(i, j) === val).map(i => pinY(i, j)));

async function drawDec38(b) {
  for (let j = 0; j < 3; j++) {
    const Y = ROWY[j];
    await b.write(`il${j}`, 52, Y + 8, DV[j], { size: 26, color: 'blue', bold: true, dur: 120 });
    await b.wire(`in${j}`, [[70, Y], [NOTX[j], Y]], { dur: 200 });
    await b.gate(`nt${j}`, 'not', NOTX[j], Y, { dur: 250 });
    await b.dot(`id${j}`, RT[j], Y);
    await all([
      b.wire(`rt${j}`, [[RT[j], Y], [RT[j], railEnd(j, 1)]], { dur: 300 }),
      b.wire(`rc${j}`, [[NOTX[j] + 62, Y], [RC[j], Y], [RC[j], railEnd(j, 0)]], { dur: 300 }),
      b.write(`rl${j}`, RC[j] + 16, Y + 26, DV[j] + "'", { size: 18, color: 'purple', dur: 100 }),
    ]);
  }
  for (let i = 0; i < 8; i++) {
    const ws = [];
    for (let j = 0; j < 3; j++) {
      const rx = bit3(i, j) ? RT[j] : RC[j];
      ws.push(b.wire(`gw${i}-${j}`, [[rx, pinY(i, j)], [GX, pinY(i, j)]], { dur: 180 }), b.dot(`gd${i}-${j}`, rx, pinY(i, j), { r: 4 }));
    }
    await all(ws);
    await b.gate(`g${i}`, 'and', GX, GY(i), { dur: 220 });
    await all([
      b.wire(`go${i}`, [[GX + 60, GY(i)], [700, GY(i)]], { dur: 120 }),
      b.write(`dl${i}`, 710, GY(i) + 7, `D_${i} = ${mt(i, 'xyz')}`, { size: 22, anchor: 'start', dur: 150 }),
    ]);
  }
}
// Sets the input bits and lights the gate whose three inputs are all 1.
async function setDec38(b, v) {
  const jobs = [];
  for (let j = 0; j < 3; j++) {
    const val = bit3(v, j);
    jobs.push(b.recolor(`in${j}`, on(val)), b.recolor(`rt${j}`, on(val)), b.recolor(`rc${j}`, on(1 - val)));
    for (let i = 0; i < 8; i++) jobs.push(b.recolor(`gw${i}-${j}`, on(bit3(i, j) === val)));
  }
  for (let i = 0; i < 8; i++) jobs.push(b.recolor(`go${i}`, on(i === v)), b.recolor(`dl${i}`, i === v ? 'green' : 'ink'));
  await all(jobs);
  await b.write('xyz', 850, 52, `xyz = ${bits(v, 3)}`, { size: 30, color: 'orange', bold: true });
  await b.pulse(`g${v}`);
}

// ---------------------------------------------------------------- 3×8 decoder block
const OUTY = k => 115 + 50 * k, BIN = [200, 290, 380];
async function decBlock(b, id) {
  await b.box(id, 280, 90, 180, 400, { fill: 'soft', r: 8 });
  await all([b.write(`${id}-t1`, 380, 280, '3×8', { size: 30, bold: true }), b.write(`${id}-t2`, 380, 312, 'decoder', { size: 20, color: 'soft' })]);
  for (const [k, v] of DV.entries()) {
    await all([
      b.wire(`${id}-i${k}`, [[225, BIN[k]], [280, BIN[k]]], { dur: 150 }),
      b.write(`${id}-il${k}`, 205, BIN[k] + 9, v, { size: 28, color: 'blue', bold: true, dur: 100 }),
      b.write(`${id}-iw${k}`, 308, BIN[k] + 6, `2^${2 - k}`, { size: 16, color: 'purple', dur: 100 }),
    ]);
  }
  for (let k = 0; k < 8; k++) {
    await all([
      b.wire(`${id}-o${k}`, [[460, OUTY(k)], [490, OUTY(k)]], { dur: 100 }),
      b.write(`${id}-ol${k}`, 445, OUTY(k) + 6, String(k), { size: 18, dur: 80 }),
    ]);
  }
}
// Wires decoder outputs into one gate: the output farthest from its pin gets the vertical
// furthest right, so the wires never run on top of each other.
async function autoRoute(b, id, outs, kind, gx, gy) {
  const n = outs.length, p = b.pins(kind, gx, gy, n);
  const sorted = [...outs].sort((a, c) => a - c);
  const legs = sorted.map((o, k) => ({ o, pin: p.ins[k], d: Math.abs(OUTY(o) - p.ins[k][1]) }));
  [...legs].sort((a, c) => a.d - c.d).forEach((l, r) => { l.v = gx - 30 - (n - 1 - r) * 20; });
  for (const l of legs) await b.wire(`${id}-w${l.o}`, [[490, OUTY(l.o)], [l.v, OUTY(l.o)], [l.v, l.pin[1]], l.pin], { dur: 250 });
  await b.gate(`${id}-g`, kind, gx, gy);
  return p.out;
}

// ---------------------------------------------------------------- full adder from a decoder
const S_LIST = [1, 2, 4, 7], C_LIST = [3, 5, 6, 7];
async function drawFA(b) {
  await decBlock(b, 'dk');
  const ps = b.pins('or', 820, 190, 4), pc = b.pins('or', 600, 400, 4);
  const R = {
    s1: [[490, OUTY(1)], [700, OUTY(1)], [700, ps.ins[0][1]], ps.ins[0]],
    s2: [[490, OUTY(2)], [720, OUTY(2)], [720, ps.ins[1][1]], ps.ins[1]],
    s4: [[490, OUTY(4)], [750, OUTY(4)], [750, ps.ins[2][1]], ps.ins[2]],
    s7: [[490, OUTY(7)], [780, OUTY(7)], [780, ps.ins[3][1]], ps.ins[3]],
    c3: [[490, OUTY(3)], [560, OUTY(3)], [560, pc.ins[0][1]], pc.ins[0]],
    c5: [[490, OUTY(5)], [520, OUTY(5)], [520, pc.ins[1][1]], pc.ins[1]],
    c6: [[490, OUTY(6)], [540, OUTY(6)], [540, pc.ins[2][1]], pc.ins[2]],
    c7: [[580, OUTY(7)], [580, pc.ins[3][1]], pc.ins[3]],
  };
  for (const [id, pts] of Object.entries(R)) await b.wire(`fa-${id}`, pts, { dur: 220 });
  await b.dot('fa-d7', 580, OUTY(7));
  await all([b.gate('fa-gs', 'or', 820, 190), b.gate('fa-gc', 'or', 600, 400)]);
  await all([b.wire('fa-os', [ps.out, [915, 190]]), b.wire('fa-oc', [pc.out, [700, 400]])]);
  await all([
    b.write('fa-ls', 940, 199, 'S', { size: 32, color: 'green', bold: true }),
    b.write('fa-lc', 725, 409, 'C', { size: 32, color: 'green', bold: true }),
    b.write('fa-es', 880, 290, 'S = Σ(1,2,4,7)', { size: 22, color: 'blue' }),
    b.write('fa-ec', 880, 470, 'C = Σ(3,5,6,7)', { size: 22, color: 'blue' }),
  ]);
}

// ---------------------------------------------------------------- 2-to-4 NAND decoder with enable
const NY = { A: 150, B: 300, E: 480 }, NG = [100, 210, 320, 430], NGX = 520;
const NR = { Ap: 185, Bp: 225, A: 340, B: 370, Ep: 400 };
const nPin = (i, j) => NG[i] + (j - 1) * 16;
const nRail = (i, j) => (j === 0 ? ((i >> 1) ? 'A' : 'Ap') : j === 1 ? ((i & 1) ? 'B' : 'Bp') : 'Ep');
function railSpan(r) {
  const ys = [];
  for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) if (nRail(i, j) === r) ys.push(nPin(i, j));
  ys.push(r[0] === 'A' ? NY.A : r[0] === 'B' ? NY.B : NY.E);
  return [Math.min(...ys), Math.max(...ys)];
}
async function drawNand(b) {
  for (const v of ['A', 'B']) {
    const Y = NY[v];
    await b.write(`nl${v}`, 52, Y + 9, v, { size: 28, color: 'blue', bold: true, dur: 100 });
    await b.wire(`n${v}0`, [[70, Y], [100, Y]], { dur: 120 });
    await b.gate(`n${v}n1`, 'not', 100, Y, { dur: 220 });
    await b.wire(`n${v}1`, [[162, Y], [260, Y]], { dur: 150 });
    await b.gate(`n${v}n2`, 'not', 260, Y, { dur: 220 });
    await b.wire(`n${v}2`, [[322, Y], [NR[v], Y]], { dur: 120 });
  }
  await b.write('nlE', 52, NY.E + 9, 'E', { size: 28, color: 'blue', bold: true, dur: 100 });
  await b.wire('nE0', [[70, NY.E], [100, NY.E]], { dur: 120 });
  await b.gate('nEn1', 'not', 100, NY.E, { dur: 220 });
  await b.wire('nE1', [[162, NY.E], [NR.Ep, NY.E]], { dur: 150 });
  for (const r of Object.keys(NR)) {
    const [y0, y1] = railSpan(r);
    await b.wire(`nr${r}`, [[NR[r], y0], [NR[r], y1]], { dur: 200 });
  }
  await all([b.dot('ndAp', NR.Ap, NY.A), b.dot('ndBp', NR.Bp, NY.B)]);
  await all([
    b.write('nrlAp', NR.Ap - 14, NY.A - 10, "A'", { size: 16, color: 'purple', dur: 80 }),
    b.write('nrlBp', NR.Bp - 14, NY.B - 10, "B'", { size: 16, color: 'purple', dur: 80 }),
    b.write('nrlEp', NR.Ep + 16, NY.E - 10, "E'", { size: 16, color: 'purple', dur: 80 }),
  ]);
  for (let i = 0; i < 4; i++) {
    const ws = [];
    for (let j = 0; j < 3; j++) {
      const x = NR[nRail(i, j)];
      ws.push(b.wire(`nw${i}-${j}`, [[x, nPin(i, j)], [NGX, nPin(i, j)]], { dur: 150 }), b.dot(`nd${i}-${j}`, x, nPin(i, j), { r: 4 }));
    }
    await all(ws);
    await b.gate(`ng${i}`, 'nand', NGX, NG[i], { dur: 220 });
    await all([b.wire(`no${i}`, [[NGX + 72, NG[i]], [620, NG[i]]], { dur: 100 }), b.write(`nol${i}`, 645, NG[i] + 7, `D_${i}`, { size: 22, dur: 100 })]);
  }
}
const nandOut = (E, A, B) => [0, 1, 2, 3].map(i => +!((((i >> 1) ? A : 1 - A) & ((i & 1) ? B : 1 - B) & (1 - E))));
async function setNand(b, E, A, B) {
  const sig = { A, Ap: 1 - A, B, Bp: 1 - B, Ep: 1 - E };
  const jobs = [];
  for (const v of ['A', 'B']) jobs.push(b.recolor(`n${v}0`, on(sig[v])), b.recolor(`n${v}1`, on(1 - sig[v])), b.recolor(`n${v}2`, on(sig[v])));
  jobs.push(b.recolor('nE0', on(E)), b.recolor('nE1', on(1 - E)));
  for (const r of Object.keys(NR)) jobs.push(b.recolor(`nr${r}`, on(sig[r])));
  for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) jobs.push(b.recolor(`nw${i}-${j}`, on(sig[nRail(i, j)])));
  const D = nandOut(E, A, B);
  for (let i = 0; i < 4; i++) jobs.push(b.recolor(`no${i}`, on(D[i])));
  await all(jobs);
  await all([
    b.write('nvA', 52, NY.A - 22, String(A), { size: 24, color: 'orange', bold: true }),
    b.write('nvB', 52, NY.B - 22, String(B), { size: 24, color: 'orange', bold: true }),
    b.write('nvE', 52, NY.E - 22, String(E), { size: 24, color: 'orange', bold: true }),
  ]);
  await all(D.map((d, i) => b.write(`nv${i}`, 645, NG[i] + 38, `= ${d}`, { size: 20, color: d ? 'soft' : 'green', bold: !d })));
}
const NT_X = [690, 730, 770, 820, 860, 900, 940];
const NT_ROWS = [['1', 'X', 'X', ...nandOut(1, 0, 0).map(String)],
  ...[0, 1, 2, 3].map(i => ['0', String(i >> 1), String(i & 1), ...nandOut(0, i >> 1, i & 1).map(String)])];

// ---------------------------------------------------------------- 4×16 from two 3×8
const UP = 70, LO = 310, OSY = (top, k) => top + 16 + 24 * k, PINS = [40, 90, 140, 175];
async function draw416(b) {
  for (const [id, top, lbl] of [['up', UP, 'D_0 … D_7'], ['lo', LO, 'D_8 … D_15']]) {
    await b.box(`b-${id}`, 420, top, 160, 200, { fill: 'soft', r: 8 });
    await all([
      b.write(`b-${id}-t`, 510, top + 100, '3×8', { size: 28, bold: true }),
      ...['2^2', '2^1', '2^0', 'E'].map((t, k) => b.write(`b-${id}-p${k}`, 442, top + PINS[k] + 5, t, { size: 14, color: 'purple', dur: 80 })),
    ]);
    for (let k = 0; k < 8; k++) {
      const n = id === 'up' ? k : k + 8;
      await all([
        b.wire(`o16-${n}`, [[580, OSY(top, k)], [600, OSY(top, k)]], { dur: 60 }),
        b.write(`o16l-${n}`, 625, OSY(top, k) + 5, `D_${n}`, { size: 15, dur: 60 }),
      ]);
    }
    await b.write(`b-${id}-r`, 690, top + 105, lbl, { size: 18, color: 'soft' });
  }
  const BUS = { x: 390, y: 360, z: 330 };
  for (const [k, v] of ['x', 'y', 'z'].entries()) {
    const yu = UP + PINS[k], yl = LO + PINS[k];
    await b.write(`b-il${k}`, 60, yu + 8, v, { size: 26, color: 'blue', bold: true, dur: 80 });
    await b.wire(`b-iu${k}`, [[80, yu], [420, yu]], { dur: 200 });
    await b.dot(`b-id${k}`, BUS[v], yu);
    await b.wire(`b-ib${k}`, [[BUS[v], yu], [BUS[v], yl], [420, yl]], { dur: 250 });
  }
  await b.write('b-wl', 60, 528, 'w', { size: 26, color: 'blue', bold: true });
  await b.wire('b-w', [[80, 520], [300, 520], [300, LO + PINS[3]], [420, LO + PINS[3]]], { dur: 300 });
  await b.dot('b-wd', 150, 520);
  await b.wire('b-w1', [[150, 520], [150, UP + PINS[3]], [200, UP + PINS[3]]], { dur: 250 });
  await b.gate('b-wn', 'not', 200, UP + PINS[3]);
  await b.wire('b-w2', [[262, UP + PINS[3]], [420, UP + PINS[3]]], { dur: 200 });
}
async function set416(b, v) {
  const w = v >> 3;
  const jobs = [b.recolor('b-up', w ? 'ink' : 'orange'), b.recolor('b-lo', w ? 'orange' : 'ink')];
  for (let n = 0; n < 16; n++) jobs.push(b.recolor(`o16-${n}`, on(n === v)), b.recolor(`o16l-${n}`, n === v ? 'green' : 'ink'));
  jobs.push(b.recolor('b-w', on(w)), b.recolor('b-w1', on(w)), b.recolor('b-w2', on(1 - w)));
  await all(jobs);
  await b.write('b-val', 800, 300, `wxyz = ${bits(v, 4)}`, { size: 30, color: 'orange', bold: true });
}

function quizBoard(n, question, o = { size: 48 }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از 5`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 125, question, o);
  };
}

      draw: async b => {

          'تابع = decoder + OR روی minterm های تابع',
          `خروجی active-low: انتخاب‌شده ${LTR('0')} و بقیه ${LTR('1')}`,
          `${LTR('4×16')} = دو ${LTR('3×8')}؛ بیت w روی enable ها`,

    // ---------------------------------------------------------- quizzes
    {
      say: 'نوبت شماست! یک decoder با 5 ورودی حداکثر چند خروجی دارد؟',

      solve: async b => {

    {

      solve: async b => { await b.clear(); await drawDec38(b); await setDec38(b, 6); },

      draw: quizBoard(3, 'F = Σ(0,3,5)  →  OR ← ?'),
      quiz: {
        choices: ['D_0 , D_3 , D_5', 'D_1 , D_2 , D_4 , D_6 , D_7', 'D_0 , D_3 , D_5 , D_7'], correct: 0,

      },
      solve: async b => {

    {

      draw: quizBoard(4, 'E = 0 , A = 0 , B = 1  →  D_{0}D_{1}D_{2}D_3 = ?'),
      quiz: { answer: ['1011'], hint: 'مدار روشن است؛ AB = 01 یعنی خروجی 1 انتخاب می‌شود — و انتخاب‌شده صفر است.', explain: 'AB = 01 پس D1 = 0 و بقیه 1 هستند: 1011.' },
      solve: async b => { await b.clear(); await drawNand(b); await setNand(b, 0, 0, 1); },
    },
    {
      say: 'سؤال آخر: در decoder 4×16 که از دو 3×8 ساخته شده، اگر wxyz = 0110 باشد کدام خروجی فعال است؟ شماره‌اش را بنویسید.',
      draw: quizBoard(5, 'wxyz = 0110  →  D_{?} '),

      solve: async b => { await b.clear(); await draw416(b); await set416(b, 6); },

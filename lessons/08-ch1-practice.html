// Lesson 8 — book slide 13: the Chapter 1 exercises, as a practice exam.
// The slide gives no answers; every answer below is computed by the helpers in this file.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run intact inside Persian board text
const DIG = '0123456789ABCDEF';
const TOTAL = 10;

// ---- decimal → base r: repeated division (whole part)
function divRows(n, base) {
  const rows = [];
  do { rows.push({ n, base, q: Math.floor(n / base), r: n % base }); n = Math.floor(n / base); } while (n > 0);
  return rows;
}
async function divTable(b, p, n, base, g) {
  const rows = divRows(n, base);
  for (const [k, row] of rows.entries()) {
    const y = g.y0 + k * g.dy;
    await b.write(`${p}e${k}`, g.xr, y, `${row.n} ÷ ${base} = ${row.q}`, { size: g.size, anchor: 'end', dur: 300 });
    await b.write(`${p}r${k}`, g.xr + 70, y, String(row.r), { size: g.size, color: 'red', bold: true, dur: 150 });
  }
  await b.arrow(`${p}up`, g.xr + 140, g.y0 + (rows.length - 1) * g.dy + 5, g.xr + 140, g.y0 - g.size, { color: 'orange' });
  return rows.map(r => DIG[r.r]).reverse().join('');
}
// ---- decimal fraction → base r: repeated multiplication, exact integer arithmetic
const dec = (num, k) => String(num).padStart(k, '0').replace(/0+$/, '');
function mulRows(frac, base, max) {
  const digits = frac.split('.')[1], k = digits.length, den = 10 ** k;
  let num = Number(digits);
  const rows = [];
  while (num && rows.length < max) {
    const prod = num * base, d = Math.floor(prod / den), rest = prod % den;
    rows.push({ inS: '0.' + dec(num, k), outS: `${d}.${dec(rest, k) || '0'}`, d });
    num = rest;
  }
  return { rows, ended: num === 0 };
}
async function mulTable(b, p, frac, base, g, max) {
  const { rows, ended } = mulRows(frac, base, max);
  for (const [k, row] of rows.entries()) {
    const y = g.y0 + k * g.dy;
    await b.write(`${p}e${k}`, g.xr, y, `${row.inS} × ${base} = ${row.outS}`, { size: g.size, anchor: 'end', dur: 300 });
    await b.write(`${p}r${k}`, g.xr + 70, y, DIG[row.d], { size: g.size, color: 'green', bold: true, dur: 150 });
  }
  if (!ended) await b.write(`${p}more`, g.xr - 110, g.y0 + rows.length * g.dy - 8, '⋮', { size: g.size, color: 'soft' });
  await b.arrow(`${p}dn`, g.xr + 130, g.y0 - g.size, g.xr + 130, g.y0 + (rows.length - 1) * g.dy + 5, { color: 'orange' });
  return { res: '0.' + rows.map(r => DIG[r.d]).join(''), ended };
}

// ---- binary → octal / hex: n-bit groups counted outward from the point (see Lesson 4)
function grouping(bin, n, px, cw = 22, gap = 26) {
  const [w, f = ''] = bin.split('.');
  const padW = (n - w.length % n) % n, padF = f ? (n - f.length % n) % n : 0;
  const W = '0'.repeat(padW) + w, Fr = f + '0'.repeat(padF);
  const bits = [];
  for (let i = 0; i < W.length; i++) {
    const r = W.length - 1 - i, g = Math.floor(r / n);
    bits.push({ ch: W[i], pad: i < padW, side: 'w', g, gx: px - gap - cw / 2 - r * cw - g * gap, rx: px - cw * 0.8 - r * cw });
  }
  for (let i = 0; i < Fr.length; i++) {
    const g = Math.floor(i / n);
    bits.push({ ch: Fr[i], pad: i >= f.length, side: 'f', g, gx: px + gap + cw / 2 + i * cw + g * gap, rx: px + cw * 0.8 + i * cw });
  }
  const groups = [];
  for (const side of ['w', 'f']) {
    for (const g of [...new Set(bits.filter(t => t.side === side).map(t => t.g))]) {
      const idx = bits.map((t, k) => k).filter(k => bits[k].side === side && bits[k].g === g);
      const xs = idx.map(k => bits[k].gx), str = idx.map(k => bits[k].ch).join('');
      groups.push({ side, g, x0: Math.min(...xs), x1: Math.max(...xs), cx: (Math.min(...xs) + Math.max(...xs)) / 2, digit: DIG[parseInt(str, 2)] });
    }
  }
  const wg = groups.filter(g => g.side === 'w').sort((a, c) => c.g - a.g);
  const fg = groups.filter(g => g.side === 'f').sort((a, c) => a.g - c.g);
  return { bits, groups, px, hasPoint: !!f, answer: wg.map(g => g.digit).join('') + (fg.length ? '.' + fg.map(g => g.digit).join('') : '') };
}
function centerPx(bin, n, cx = 500) {
  const xs = grouping(bin, n, 0).bits.map(t => t.gx);
  return Math.round(cx - (Math.min(...xs) + Math.max(...xs)) / 2);
}
async function fullGrouping(b, p, bin, n, y) {
  const P = grouping(bin, n, centerPx(bin, n));
  for (const [k, t] of P.bits.entries()) if (!t.pad) await b.write(`${p}b${k}`, t.rx, y, t.ch, { size: 34, dur: 60 });
  if (P.hasPoint) await b.write(`${p}pt`, P.px, y, '.', { size: 34 });
  await all(P.bits.map((t, k) => (t.pad ? null : b.move(`${p}b${k}`, t.gx - t.rx, 0))));
  for (const [k, t] of P.bits.entries()) if (t.pad) await b.write(`${p}b${k}`, t.gx, y, '0', { size: 34, color: 'red', bold: true, dur: 120 });
  for (const [k, g] of P.groups.entries()) {
    await b.line(`${p}u${k}`, g.x0 - 10, y + 12, g.x1 + 10, y + 12, { color: 'purple', width: 2.5, dur: 200 });
    await b.write(`${p}d${k}`, g.cx, y + 60, g.digit, { size: 34, color: 'blue', bold: true, dur: 150 });
  }
  if (P.hasPoint) await b.write(`${p}dpt`, P.px, y + 60, '.', { size: 34, color: 'blue' });
  return P.answer;
}
// ---- octal / hex → binary: each digit to its n-bit group
async function expandDigits(b, p, num, n, cx, y, sp) {
  const chars = [...num], p0 = chars.indexOf('.');
  const ds = chars.filter(c => c !== '.'), intLen = p0 < 0 ? ds.length : p0;
  const width = (ds.length - 1) * sp + (intLen < ds.length ? sp * 0.4 : 0);
  const X = j => cx - width / 2 + j * sp + (j >= intLen ? sp * 0.4 : 0);
  for (const [j, d] of ds.entries()) await b.write(`${p}x${j}`, X(j), y, d, { size: 50, dur: 150 });
  const ptX = intLen < ds.length ? X(intLen - 1) + sp * 0.7 : null;
  if (ptX) await b.write(`${p}xpt`, ptX, y, '.', { size: 50 });
  const G = ds.map(d => parseInt(d, 16).toString(2).padStart(n, '0'));
  for (const [j, g] of G.entries()) {
    await b.arrow(`${p}xa${j}`, X(j), y + 12, X(j), y + 45, { color: 'soft', head: 8, dur: 200 });
    await b.write(`${p}xg${j}`, X(j), y + 85, g, { size: 32, color: 'blue', dur: 250 });
  }
  if (ptX) await b.write(`${p}xgpt`, ptX, y + 85, '.', { size: 32, color: 'blue' });
  const whole = G.slice(0, intLen).join(''), frac = G.slice(intLen).join('');
  return (whole.replace(/^0+(?=.)/, '') + (frac ? '.' + frac : '')).replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
}

function quizBoard(n, title, question, o = { size: 50 }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 55, `سؤال ${n} از ${TOTAL} — ${title}`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 140, question, o);
  };
}
async function solveGroup(b, bin, n) {
  const ans = await fullGrouping(b, 's-', bin, n, 270);
  await b.write('s-ans', 500, 450, `(${bin})_2 = (${ans})_${n === 3 ? 8 : 16}`, { size: 44, color: 'green', bold: true });
}
async function solveExpand(b, num, n) {
  const r = await expandDigits(b, 's-', num, n, 500, 240, n === 3 ? 120 : 140);
  await b.write('s-ans', 500, 450, `(${num})_${n === 3 ? 8 : 16} = (${r})_2`, { size: 44, color: 'green', bold: true });
  await b.write('s-n', 500, 510, 'صفرهای اول و آخر عدد را انداختیم', { size: 22, color: 'soft', fa: true });
}

  e5: grouping('100110.1011', 4, 0).answer,

      },
      solve: async b => {
        for (const [k, s] of COUNT.entries()) {
          const y = 225 + k * 52;
          await b.write(`s-b${k}`, 460, y, s, { size: 38, color: k ? 'green' : 'ink', anchor: 'end', bold: k > 0, dur: 150 });
          await b.write(`s-d${k}`, 640, y, `= ${11 + k}`, { size: 30, color: 'soft', dur: 120 });
          if (k) await b.write(`s-p${k}`, 280, y - 26, '+1', { size: 20, color: 'orange', dur: 80 });
        }
        await b.ring('s-r', 412, 473, 66, 30, { color: 'orange' });
        await b.write('s-n', 820, 473, 'یک رقم بیشتر!', { size: 24, color: 'orange', fa: true });
      },
    },
    // ---------------------------------------------------------- Q9
    {
      say: 'تمرین 9، آخرین سؤال: عدد قبل از 110 (در مبنای 2) کدام است؟',
      draw: quizBoard(10, 'تمرین 9', 'number before (110)_2 = ?'),
      quiz: { answer: ['101'], hint: '110 در decimal چند است؟ یکی کمش کن.', explain: '110 = 6، پس عدد قبلی 5 = 101. چک: 101 + 1 = 110.' },
      solve: async b => {
        await b.write('s-1', 500, 250, '(110)_2 = 6', { size: 40 });
        await b.write('s-2', 500, 320, '6 − 1 = 5 = (101)_2', { size: 40, color: 'green', bold: true });
        await b.write('s-3', 500, 400, 'check:  101 + 1 = 110  ✓', { size: 32, color: 'blue' });
      },
    },
    // ---------------------------------------------------------- outro
    {
      say: 'آفرین، فصل 1 تمام شد! اگر جایی اشتباه کردی، برگرد و همان درس را دوباره ببین. در فصل بعد سراغ *جبر بول* می‌رویم: قوانینی که با همین 0 و 1 و AND و OR و NOT کار می‌کنند.',
      draw: async b => {
        await b.clear();
        await b.write('h', 500, 90, 'یادت باشد', { size: 48, color: 'orange', bold: true, fa: true });
        const L = [
          'قسمت صحیح و اعشار را همیشه جدا تبدیل کن',
          'اعشاری که تمام نمی‌شود: تا تعداد رقم خواسته‌شده',
          'گروه‌بندی از ممیز؛ صفر فقط در دورترین سمت',
          `شمردن در binary: ${LTR('1 + 1 = 10')}`,
        ];
        for (const [k, l] of L.entries()) await b.write(`m${k}`, 900, 180 + k * 72, '•  ' + l, { size: 28, anchor: 'start', fa: true });
        await b.write('next', 500, 500, 'فصل بعد: جبر بول', { size: 34, color: 'blue', bold: true, fa: true });
      },
    },
  ],
});
</script>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logic Design Course</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/teacher.css">
</head>
<body>
<main class="course">
  <header>
    <h1>طراحی مدارهای منطقی — درس‌های متحرک</h1>
    <p>هر درس مثل یک معلم پای تخته است: در هر قدم یک ایده، و در آخر سؤال‌های شبیه امتحان. شماره‌ی اسلایدها به کتاب (88 اسلاید) اشاره می‌کند.</p>
  </header>
  <div id="outline"></div>
</main>
<script>
// [title, book slides, what it covers, file (only when built)]
const COURSE = [
  ['فصل 1 · سیستم‌های دودویی', 'Binary systems', [
    ['دستگاه‌های عددی و ارزش مکانی', '1–2', 'تبدیل مبناهای 10، 2، 5 و 16 به decimal · رقم‌های hex · جدول شمارش', 'lessons/01-number-systems.html'],
    ['محاسبات binary', '3', 'جمع، تفریق (قرض = 2) و ضرب در binary'],
    ['تبدیل decimal به هر مبنا', '4–5', 'تقسیم‌های متوالی برای قسمت صحیح، ضرب‌های متوالی برای قسمت اعشار'],
    ['میان‌بر binary ↔ octal ↔ hex', '6–7', 'گروه‌های 3 بیتی (octal) و 4 بیتی (hex)، و برعکس'],
    ['مکمل‌ها (complements)', '8', "مکمل r (rⁿ − N) و مکمل r−1"],
    ['تفریق با مکمل', '9–10', 'حالت‌های M ≥ N و M < N · مکمل 1 · end-around carry'],
    ['منطق دودویی و timing diagram', '11–12', 'گیت‌های AND، OR، NOT · جدول درستی · خواندن timing diagram'],
    ['امتحان تمرینی فصل 1', '13', '9 تمرین کتاب، قدم‌به‌قدم حل‌شده'],
  ]],
  ['فصل 2 · جبر بول', 'Boolean algebra', [
    ['قوانین جبر بول و duality', '14', 'identity، complement، commutative، distributive · ترفند duality'],
    ['قضیه‌ها و روش اثبات آن‌ها', '15–19', 'x+x=x، x+1=1، absorption، DeMorgan · اثبات با جدول درستی · ترتیب عملگرها'],
    ['از تابع بول تا جدول درستی و گیت', '20–22', 'جدول 2ⁿ سطری · رسم تابع به شکل مدار'],
    ['ساده‌سازی با جبر بول', '23', 'ساده‌سازی قدم‌به‌قدم · قضیه‌ی consensus'],
    ['مکمل یک تابع', '24–25', 'DeMorgan برای n متغیر · مثال‌های حل‌شده'],
    ['Minterm و maxterm، فرم‌های Σ و Π', '26–30', 'فرم‌های استاندارد · بسط دادن · تبدیل Σ و Π به هم'],
    ['همه‌ی گیت‌ها', '31–32', 'NAND، NOR، XOR، XNOR، buffer · کدام‌ها شرکت‌پذیرند'],
    ['امتحان تمرینی فصل 2', '33', 'تمرین‌های کتاب، حل‌شده'],
  ]],
  ['فصل 3 · ساده‌سازی توابع منطقی', 'Simplification of logic functions', [
    ['جدول کارنو: 2 و 3 متغیر', '34–39', 'ترتیب Gray code · گروه‌بندی 1ها · همسایه‌های دور'],
    ['جدول کارنو: 4 و 5 متغیر', '40–43', 'گروه‌های 1، 2، 4، 8، 16 خانه‌ای · جدول 5 متغیره'],
    ['Product of sums با جدول کارنو', '44–45', 'گروه‌بندی 0ها برای F′ و بعد DeMorgan'],
    ['مدار فقط با NAND یا فقط با NOR', '46–48', 'معادل گیت‌ها · دو حباب پشت‌سرهم هم را خنثی می‌کنند'],
    ["حالت‌های don't-care", '49–50', 'استفاده از خانه‌های X برای گروه‌های بزرگ‌تر'],
    ['امتحان تمرینی فصل 3', '51', 'تمرین‌های کتاب، حل‌شده'],
  ]],
  ['فصل 4 · مدارهای ترکیبی', 'Combinational circuits', [
    ['Half adder و full adder', '52–55', 'جدول درستی، جدول کارنو، مدار · full adder از دو half adder'],
    ['Half subtractor و full subtractor', '56–57', 'معادله‌های difference و borrow'],
    ['XOR و اتحادهایش', '58–59', 'قوانین XOR و XNOR که در امتحان می‌آیند'],
    ['امتحان تمرینی فصل 4', '60', 'تمرین‌های کتاب، حل‌شده'],
  ]],
  ['فصل 5 · بلوک‌های MSI', 'Adders, decoders, multiplexers', [
    ['Parallel adder و magnitude comparator', '61–62', 'جمع‌کننده‌ی 4 بیتی ripple · مقایسه‌ی دو عدد'],
    ['Decoder', '63–68', 'decoder سه به هشت · تابع با decoder و OR · decoder با NAND · 4×16 از دو 3×8'],
    ['Encoder', '69', 'encoder هشت به سه (octal به binary)'],
    ['Multiplexer', '70–75', 'MUX چهار به یک · پیاده‌سازی هر تابع با MUX · demultiplexer'],
    ['امتحان تمرینی فصل 5', '76', 'تمرین‌های کتاب، حل‌شده'],
  ]],
  ['فصل 6 · مدارهای ترتیبی', 'Sequential circuits', [
    ['مدار ترتیبی و latch', '77–80', 'حافظه و clock · latch با NOR و NAND · حالت‌های ممنوع'],
    ['Flip-flop های RS و D با clock', '81–83', 'جدول و معادله‌ی مشخصه'],
    ['Flip-flop های JK و T', '84–86', 'toggle · معادله‌های Q(t+1)'],
    ['شمارنده‌ها (counters)', '87–88', 'شمارنده‌ی 3 بیتی با T flip-flop'],
  ]],
];

let n = 0;
document.getElementById('outline').innerHTML = COURSE.map(([title, en, lessons]) => `
  <section class="chapter">
    <h2>${title}</h2>
    <div class="fa-title" lang="en" dir="ltr">${en}</div>
    <ol start="${n + 1}">
      ${lessons.map(([t, slides, covers, href]) => { n++; return `
        <li>${href ? `<a href="${href}"><strong>${t}</strong></a><span class="badge ready">آماده</span>` : `<strong>${t}</strong><span class="badge soon">به‌زودی</span>`}
          <span class="slides">· اسلاید ${slides}</span>
          <span class="covers">${covers}</span></li>`; }).join('')}
    </ol>
  </section>`).join('');
</script>
</body>
</html>
